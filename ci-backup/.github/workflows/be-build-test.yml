name: backend build test

# 백엔드가 빌드되는지 보는 **CI 검사**다. PR/push 마다 돈다. artifact 를 올리지 않는다 —
# 배포는 이 워크플로우 산출물을 쓰지 않고, 개발자가 로컬에서 backend/scripts/build.sh(pnpm ci:bundle)
# 로 구운 번들을 deploy-backend.sh 로 보낸다. 빌드 로직의 단일 출처는 그 build.sh 다.
#
# 이 워크플로우는 **빌드 방법을 모른다.** backend/scripts/build.sh 를 호출만 한다.
# 로직을 여기 YAML 에 적으면 로컬에서 재현할 방법이 없어져서, CI 에서만 깨지는 실패가 생긴다.
# 로컬에서 같은 것을 돌리려면: cd backend && pnpm ci:bundle

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend/scripts/build.sh'
      # 버전 계산도 빌드의 일부다. 이게 빠져 있어서, version.sh 를 고쳐도 빌드가
      # 다시 돌지 않아 CI 에서 sha 가 unknown 으로 찍히는 걸 한참 못 봤다.
      - 'backend/scripts/version.sh'
      - '.github/workflows/be-build-test.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'backend/scripts/build.sh'
      # 버전 계산도 빌드의 일부다. 이게 빠져 있어서, version.sh 를 고쳐도 빌드가
      # 다시 돌지 않아 CI 에서 sha 가 unknown 으로 찍히는 걸 한참 못 봤다.
      - 'backend/scripts/version.sh'
      - '.github/workflows/be-build-test.yml'
  workflow_dispatch:

# 새 push/PR 커밋이 오면 이전 빌드는 의미가 없으니 취소한다(검사라 최신만 통과하면 됨).
# group 에 github.ref 를 써서 브랜치·PR 별로 나눈다 — 다른 브랜치/PR 끼리는 서로 안 건드린다.
# PR 은 ref 가 refs/pull/N/merge 라, 같은 PR 에 새 커밋을 push 하면 이전 빌드가 취소된다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # 미리 구워둔 툴체인 이미지. node·pnpm 이 이미 들어 있어 설치 단계가 없다.
    # 버전을 고정해서 쓴다. latest 는 일부러 만들지 않는다(docker/node-builder/README.md).
    container:
      image: ghcr.io/plzhans/hans-api/node-builder:node24

    steps:
      - uses: actions/checkout@v5

      # pnpm store 를 캐시해 매 빌드마다 패키지를 다시 받지 않게 한다.
      # 이미지가 굽는 건 node·pnpm 까지고, 프로젝트 의존성은 여기서 받는다.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('backend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: ./backend/scripts/build.sh
