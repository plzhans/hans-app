# medifinder 서브트리의 워크스페이스.
#
# **web 은 여기 없다.** 프론트 앱들은 각자 독립 워크스페이스에 자기 lockfile 을 두는 것이
# 이 레포의 관례고(frontend/hansapp-* 도 같다), web 도 그대로 따른다. 여기 묶는 것은
# 서버측 두 패키지뿐이다.
packages:
  - 'cli'
  - 'application'

# 스크립트 실행 전 의존성 검증을 끈다. backend 와 같은 이유 — pnpm 11 은 이 설정을
# .npmrc 가 아니라 여기서 읽는다.
verifyDepsBeforeRun: false

allowBuilds:
  '@swc/core': true
  esbuild: true
