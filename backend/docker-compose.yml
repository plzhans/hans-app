# 로컬 개발환경(MySQL + Redis + Elasticsearch). backend 폴더에서 `docker compose up -d` 로 띄운다.
#
# 이미지(docker/mysql9/)는 "MySQL 9 + 서버 공통 설정"까지만 담당한다.
# 버전·설정은 공유 개발 DB(MySQL HeatWave 9.7.1-cloud)에 맞춰져 있다.
# 이 스택에서 쓸 DB·계정을 만드는 건 아래 initdb 마운트가 한다.
name: hansapp-backend

services:
  # hansapp-db:
  #   build:
  #     # backend/ 가 아니라 레포 루트의 docker/ 아래에 둔다. 다른 스택(node-builder)과 같은 자리다.
  #     context: ../docker/mysql9
  #     args:
  #       # 실제 DB 와 같은 패치버전. 올리기 전에 `SELECT @@version` 부터 확인할 것.
  #       MYSQL_VERSION: 9.7.1
  #   image: hansapp/mysql9:9.7.1
  #   container_name: hansapp-db
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root

  #     # 메인 DB 와 앱 계정은 mysql 이미지의 기본 기능이 만든다.
  #     # MYSQL_USER 는 MYSQL_DATABASE 에 대해서만 권한을 받는다.
  #     # 로그·shadow DB 는 여기서 못 만들므로(변수가 DB 하나만 받는다) initdb 스크립트가 이어서 만든다.
  #     # 접속 정보의 출처는 여기 한 곳뿐이다. initdb 스크립트는 이 값들을 읽어 쓴다.
  #     MYSQL_DATABASE: local_hansapp
  #     MYSQL_USER: local_hansapp
  #     # 로컬 컨테이너 전용이라 감출 게 없다. 계정명과 같게 둔다.
  #     MYSQL_PASSWORD: local_hansapp

  #     # 컨테이너 OS 시간대. MySQL 서버 시간대는 별개이며 server.cnf 가 정한다(둘 다 UTC).
  #     TZ: UTC
  #   ports:
  #     # 호스트에 이미 MySQL 이 돌고 있어도 부딪히지 않게 3306 을 피한다.
  #     # 바꾸려면 MYSQL_PORT=... 로 덮어쓰고 config/local/local.env 의 포트도 같이 고친다.
  #     - '${MYSQL_PORT:-13306}:3306'
  #   volumes:
  #     - hansapp-db-data:/var/lib/mysql
  #     # 위 변수로 못 만드는 로그·shadow DB 를 마저 만드는 스크립트. 이미지에 굽지 않고 여기서 붙인다.
  #     # datadir 이 비어 있을 때(최초 기동, 볼륨 삭제 후)만 한 번 실행된다.
  #     # 스크립트를 고쳤으면 `docker compose down -v && docker compose up -d` 로 볼륨을 지우고 다시 올려야 반영된다.
  #     - ./infra/local/mysql-db/docker-initdb:/docker-entrypoint-initdb.d:ro
  #   healthcheck:
  #     # 앱을 붙이기 전에 DB 가 실제로 접속을 받는지 확인한다.
  #     # root 로 ping 을 쳐야 "접속은 되는데 초기화가 안 끝난" 상태를 걸러낼 수 있다.
  #     test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
  #     interval: 5s
  #     timeout: 5s
  #     retries: 20
  #     # 초기화(3개 DB 생성)에 시간이 걸린다. 그동안의 실패는 재시도로 치지 않는다.
  #     start_period: 40s

  # 로컬 개발용 Redis. 운영 튜닝(infra/develop/redis)은 신경 쓰지 않고 최소 설정만 둔다.
  # 비밀번호는 config/.env.local 의 REDIS_URL 과 맞춘다.
  hansapp-redis:
    image: redis:7.4-alpine
    container_name: hansapp-redis
    restart: unless-stopped
    # 로컬도 auth 를 켜 둔다. 꺼 두면 접속 코드가 로컬만 달라지고, 그 차이는 개발 서버에
    # 올린 뒤에야 드러난다.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-pwd-redis}']
    ports:
      # 호스트에서 충돌하면 REDIS_PORT 로 덮어쓴다.
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - hansapp-redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pwd-redis}
    healthcheck:
      # 컨테이너 내부 env 를 쓰기 위해 compose 보간을 피해 $$ 로 이스케이프한다.
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # # 로컬 개발용 Elasticsearch 단일 노드. 버전은 develop(infra/develop/elasticsearch)과 맞춘다.
  # # 로컬은 보안을 끈다 — 인증 없이 http://127.0.0.1:9200 으로 바로 붙는다.
  hansapp-search:
    # 순정 이미지가 아니라 형태소 플러그인(nori·kuromoji·smartcn·icu)을 설치한 이미지로 빌드한다.
    # 순정이면 'Unknown tokenizer type [nori_tokenizer]' 로 스키마 적용이 실패한다.
    # develop 과 같은 Dockerfile 을 재사용한다(플러그인 설치 = 로컬·develop 공통 관심사).
    build:
      context: ./infra/develop/elasticsearch
      args:
        ELASTICSEARCH_VERSION: '9.3.1'
    image: hansapp/elasticsearch:9.3.1
    container_name: hansapp-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=elastic
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # 단일 노드라 디스크 워터마크 때문에 인덱스가 read-only 로 잠기는 것 방지.
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - '${ELASTICSEARCH_PORT:-9200}:9200'
    volumes:
      - hansapp-search-data:/usr/share/elasticsearch/data
    healthcheck:
      # 보안이 켜져 있어 인증 없이 부르면 401 이라 항상 unhealthy 가 된다.
      # 컨테이너 내부 env(ELASTIC_PASSWORD)를 쓰기 위해 compose 보간을 피해 $$ 로 이스케이프한다.
      test:
        [
          'CMD-SHELL',
          'curl -sf -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  hansapp-db-data:
    name: hansapp-db-data
  hansapp-redis-data:
    name: hansapp-redis-data
  hansapp-search-data:
    name: hansapp-search-data
