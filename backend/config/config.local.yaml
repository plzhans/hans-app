# hansapp local 환경 설정.

database:
  url: ${DATABASE_URL}
  logUrl: ${DATABASE_LOG_URL}
  shadowUrl: ${DATABASE_SHADOW_URL}

redis:
  url: ${REDIS_URL}

elasticsearch:
  url: ${ELASTICSEARCH_URL}
  # 인덱스 이름 접두사. 미설정이면 환경 이름(local). dev 클러스터를 같이 쓰므로
  # 남의 인덱스를 건드리지 않으려면 자기 접두사를 준다.
  indexPrefix: ${ELASTICSEARCH_INDEX_PREFIX:local}

cache:
  memoryMaxEntries: 10000
  memoryTtlSec: 300
  sharedTtlSec: 600

auth:
  rootDomain:
  externalUrl: http://localhost:5173
  jwt:
    issuer: http://127.0.0.1:3000
    allowedIssuers:
      - http://develop.plzhans.com
      - http://127.0.0.1:3000
    secret: ${AUTH_JWT_SECRET}
    keyDir: ${AUTH_JWT_KEY_DIR}

apps-api:
  # 이 서비스의 외부 주소(포털웹). 메일 템플릿의 링크 base 로 쓴다.
  externalUrl: http://127.0.0.1:3000

google:
  clientId: ${GOOGLE_CLIENT_ID}
  clientSecret: ${GOOGLE_CLIENT_SECRET}

naver:
  clientId: ${NAVER_CLIENT_ID}
  clientSecret: ${NAVER_CLIENT_SECRET}

kakao:
  clientId: ${KAKAO_CLIENT_ID}
  clientSecret: ${KAKAO_CLIENT_SECRET}

line:
  clientId: ${LINE_CLIENT_ID}
  clientSecret: ${LINE_CLIENT_SECRET}

krdata:
  serviceKey: ${KRDATA_SERVICE_KEY}
  hiraDetailVersion: ${KRDATA_HIRA_DETAIL_VERSION}

# 국토교통부(vworld). 3D 지도·항공사진. **vworld 서비스키는 공공데이터포털과 별개**.
molit:
  vworld:
    serviceKey: ${KRGO_MOLIT_VWORLD_SERVICE_KEY}

juso:
  serviceKey: ${KRGO_JUSO_SERVICE_KEY}

llm:
  # anthropic | openai | local. local 은 OpenAI 호환 엔드포인트(ollama·vLLM·LM Studio).
  defaultProvider: anthropic
  timeoutSec: 30
  # 필터 JSON 만 받으므로 크게 잡을 이유가 없다. 넘치면 잘린 JSON 이라 호출이 실패한다.
  maxTokens: 2048
  # 프롬프트 파일 자리. 상대경로면 cwd → 워크스페이스 루트 순으로 찾는다.
  promptDir: data/healthcare/svc-prompts
  # 질문 끝의 `/test` 를 답변 모드로 받는다. **로그인이 붙기 전까지의 임시 수단**이라
  # 켜져 있으면 누구나 유료로 팔 답변을 공짜로 받는다 — 운영은 반드시 꺼 둔다.
  allowTestCommand: ${LLM_ALLOW_TEST_COMMAND:true}
  # 업체 이름으로 둔다(모델 이름 claude 가 아니라). openai 와 같은 층위여야 읽을 때
  # 헷갈리지 않고, 한 업체가 모델을 여럿 내도 이 키는 그대로다.
  anthropic:
    apiKey: ${ANTHROPIC_API_KEY}
    # 구독 토큰. **로컬 전용** — 개인 구독이라 사용자 트래픽을 태우면 안 된다.
    #   claude setup-token 생성
    # 키와 토큰이 둘 다 있으면 키가 이긴다.
    authToken: ${ANTHROPIC_AUTH_TOKEN}
    # 기본값은 여기(코드 아님). **날짜 없는 별칭**이어야 한다 — 스냅샷 ID 는 은퇴하고,
    # 그날 설정을 안 건드린 배포가 조용히 404 를 맞는다. 응답이 실제 버전을 알려준다.
    # haiku 인 이유: 구독 토큰으로 opus·sonnet 은 429 고, 질문 → 코드 추출엔 이걸로 충분하다.
    defaultModel: ${ANTHROPIC_DEFAULT_MODEL:claude-haiku-4-5}
  openai:
    apiKey: ${OPENAI_API_KEY}
    # 모델 이름은 계정마다 다르다. 기본값을 박아두지 않는다.
    defaultModel: ${OPENAI_DEFAULT_MODEL}
