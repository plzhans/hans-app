# local 에서 config.yaml 과 달라지는 값만.

elasticsearch:
  # dev 클러스터를 같이 쓴다. 개인 접두사로 바꿔 쓸 수 있다.
  indexPrefix: local

auth:
  # IP 는 쿠키 Domain 으로 못 쓴다.
  rootDomain:
  # http 로 뜬다.
  cookieSecure: false
  externalUrl: http://127.0.0.1:5173
  jwt:
    issuer: http://127.0.0.1:3000
    allowedIssuers:
      - http://develop.plzhans.com
      - http://127.0.0.1:3000

apps-api:
  externalUrl: http://127.0.0.1:3000
  swagger:
    enabled: true
    ipRestricted: false

admin:
  jwt:
    issuer: http://127.0.0.1:3001

apps-admin-api:
  externalUrl: http://127.0.0.1:3001
  cors:
    # 관리자 SPA 의 Vite dev server(5273 auth · 5274 web · 5275 admin).
    origins:
      - http://127.0.0.1:5275
      - http://localhost:5275
  swagger:
    enabled: true
