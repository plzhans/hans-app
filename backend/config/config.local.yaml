# local 에서 config.yaml 과 달라지는 값만.

elasticsearch:
  indexPrefix: local

auth:
  rootDomain:
  cookieSecure: false
  externalUrl: http://127.0.0.1:5273/auth
  jwt:
    # discovery 문서를 내는 오리진과 같아야 한다(= API 주소).
    issuer: http://127.0.0.1:3000
    allowedIssuers:
      - http://127.0.0.1:3000

apps-api:
  externalUrl: http://127.0.0.1:3000
  swagger:
    enabled: true
  error:
    debug: true

admin:
  jwt:
    issuer: http://127.0.0.1:3001

apps-admin-api:
  externalUrl: http://127.0.0.1:5275
  cors:
    # 관리자 SPA 의 Vite dev server(5273 auth · 5274 web · 5275 admin).
    origins:
      - http://127.0.0.1:5275

  swagger:
    enabled: true
  error:
    debug: true
