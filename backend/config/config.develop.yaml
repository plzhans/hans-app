# hansapp develop 환경 설정.
#
# yaml = 구조·기본값의 단일 원천.
#
# ── env 로 덮는 법 ────────────────────────────────────────────────────────────
# **여기 있는 모든 값은 경로를 대문자로 편 이름의 환경변수가 덮는다**(Spring relaxed binding).
# 그래서 `${VAR}` 를 적을 필요가 없다 — 키를 선언해 두기만 하면 된다.
#
#   auth.jwt.secret                 → AUTH_JWT_SECRET
#   apps-api.web.sslCertificateKey  → APPS_API_WEB_SSL_CERTIFICATE_KEY
#   auth.jwt.allowedIssuers         → AUTH_JWT_ALLOWED_ISSUERS  (리스트는 콤마로)
#
# camelCase 와 kebab-case 가 `_` 로 갈린다. **두 경로가 같은 이름으로 접히면 부팅을 거부한다** —
# 환경변수로 둘을 구별할 방법이 없기 때문이다(`a.b` 와 `a_b` 는 둘 다 `A_B` 다).
#
# 값 없이 `url:` 로 둔 줄은 "이름만 잡아 둔" 선언이다 — 값은 .env 로만 들어온다.
# 여기 없는 경로도 env 만으로 값이 들어온다(Spring 과 같다). 다만 **여기 적어 두는 편이 낫다** —
# 이 파일이 곧 무엇을 덮을 수 있는지의 목록이고, 안 적힌 값은 아무도 있는 줄 모른다.
#
# ── `${VAR}` 를 남겨 둔 줄 ────────────────────────────────────────────────────
# **이름이 규칙과 다를 때만** 쓴다. 남이 정한 이름(prisma 가 직접 읽는 DATABASE_URL), 또는
# 한 값을 두 경로가 나눠 쓰는 별칭(auth.otp.hashSecret). 자리표시자가 있어도 경로 이름으로
# 덮는 길은 그대로 열려 있고, 그쪽이 이긴다.
#
# `${VAR:기본값}` 은 env 에 **키가 없을 때만** 기본값을 쓴다(Spring 과 같다. bash 의 `:-` 가 아니다).
#
# ── 빈값 ──────────────────────────────────────────────────────────────────────
# **빈값은 어엿한 값이다** — `VAR=` 로 두면 빈 문자열이 그대로 들어온다(TLS 를 끄는 방법이 이것이다).
# 그래서 기본값을 원하면 .env 에서 그 줄을 지워야 한다. 비워 두는 것으로는 안 된다.
#
# **비밀값은 여기 박지 않고 env 로만 주입.**

# ── DB (Prisma) ───────────────────────────────────────────────────────────────
# 실제 연결값은 .env. **주의: Prisma migrate 는 yaml 이 아니라 스키마의 env("...") 로 env 를 직접 읽는다**
# (별개 CLI 라 앱/ConfigSource 를 안 탐). 그래서 여기 이름을 바꾸면 prisma 스키마의 env() 도 같이 바꿔야 한다.
database:
  # 메인 DB 연결 문자열(시크릿).
  url:
  # 로그 DB. 보존주기·관리 주기가 달라 메인과 분리돼 있다.
  logUrl:
  # prisma migrate dev 전용 shadow DB. 마이그레이션 생성 시 Prisma 가 통째로 비운다(실데이터 금지).
  shadowUrl:

# 캐시·세션·rate limit 저장소(시크릿 포함 연결 문자열).
redis:
  url:

# 검색 엔진 연결(시크릿 포함).
elasticsearch:
  url:
  # 인덱스 이름 접두사(develop-healthcare_hospital). 한 클러스터를 여러 환경이 나눠 쓰는
  # 유일한 격리 단위다. **환경 이름과 분리**돼 있어 같은 develop 안에서도 접두사만 따로
  # 돌릴 수 있다(새 매핑을 나란히 올려 비교할 때). 미설정이면 환경 이름을 쓴다.
  indexPrefix: develop

# 서버 기동·종료 슬랙 알림. **셋 다 비면 알림만 꺼지고 서버는 정상으로 뜬다** — 부가 기능이라
# 없다고 부팅을 막지 않는다.
#
# botToken 이 있으면 chat.postMessage 로 보낸다. 이때만 슬랙이 메시지 id(ts)를 돌려주므로
# **종료 알림을 시작 알림의 스레드에 달 수 있다.** webhookUrl 은 그 폴백이고, 웹훅은 응답이
# 'ok' 뿐이라 시작·종료가 서로 무관한 별개 메시지가 된다.
slack:
  # 봇 토큰(시크릿, xoxb-). 슬랙 앱 OAuth & Permissions 에서 chat:write 스코프로 발급.
  botToken:
  # 보낼 채널. C 로 시작하는 id 를 권한다(채널 이름을 바꿔도 안 깨진다).
  # **botToken 과 짝이다** — 웹훅은 발행 시점에 채널이 고정돼 이 값을 쓰지 않는다.
  channel:
  # Incoming Webhook URL(시크릿). 토큰이 없을 때만 쓰인다.
  webhookUrl:
  # 이 프로세스를 띄운 배포가 만든 슬랙 스레드의 ts. 있으면 기동 알림이 그 스레드에 붙는다.
  # **배포가 docker compose up 할 때만 넣는다** — .env 에는 없고, 값이 낡으면 앱이 무시한다.
  deployThreadTimestamp:

# API 접근(서비스키·클라이언트) 2단 캐시 TTL. 인증마다 DB 를 때리지 않으려는 것.
# 메모리 → 공유(Redis) → DB. TTL 을 짧게 둬 무효화-조회 경쟁이 나도 이 안에 자가 치유되게 한다.
cache:
  # 프로세스 메모리 캐시 최대 엔트리 수.
  memoryMaxEntries: 10000
  # 프로세스 메모리 캐시 TTL(초, 5분).
  memoryTtlSec: 300
  # 공유 캐시(Redis) TTL(초, 10분).
  sharedTtlSec: 600

auth:
  # 서비스 루트 도메인(앞 점 없이). **SSO 쿠키 Domain + 1st-party 판단이 여기서 파생된다.**
  # *.plzhans.com 을 자사로 인정하고, hans-auth 로그인을 콘솔이 리다이렉트 없이 쿠키로 인지하게 한다.
  # **로컬 API(127.0.0.1)에선 설정 금지**(IP 는 쿠키 Domain 불가 → 미설정 시 host-only + 루프백 폴백).
  rootDomain: plzhans.com
  # 소셜 로그인 흐름(state·흐름 쿠키)의 유효시간(초). **둘이 같은 값을 쓴다.**
  # provider 화면에서 계정을 고르고 동의하는 시간이라 너무 짧으면 정상 로그인이 실패한다.
  socialFlowTtlSec: 600
  # 쿠키에 Secure 를 붙일지. HTTPS 로 서비스하면 켠다.
  #
  # **sameSite 와는 별개다** — 그쪽은 lax 로 고정돼 있다(refresh-cookie.ts).
  # none 으로 열면 아무 사이트나 refresh 쿠키를 태워 /oauth/token 을 부를 수 있고,
  # rotate 구조라 그것만으로 피해자 세션이 무효화된다(응답을 못 읽어도 목적 달성).
  cookieSecure: true
  # 쿠키 이름 접두사. **환경마다 달라야 한다.**
  # develop-auth·api 는 develop.plzhans.com 의 서브도메인이 아니라 plzhans.com 의 형제라,
  # 쿠키 도메인을 양쪽 다 plzhans.com 까지 올려야 한다. 이름까지 같으면 한 환경에서
  # 로그인할 때마다 다른 환경의 세션 토큰을 덮어쓰고, 그 토큰은 상대 DB 에 없어 거절된다.
  cookiePrefix:
  # bcrypt 비용 계수. 비밀번호 해싱을 의도적으로 느리게 해 brute-force 를 막는다.
  # 1 늘 때마다 연산량(=CPU)이 2배. 10=일반 기본, 12=더 안전. 저사양 서버면 10 권장.
  bcryptRounds: 10
  # OAuth2 authorization_endpoint = **프론트(hans-auth 로그인 UI)의 로그인 URL**.
  # 백엔드가 "남(프론트)의 주소"라 스스로 못 알아 설정으로 주입. discovery(.well-known)에 실려
  # 외부 클라(medifinder)가 "로그인하러 어디로 보낼지" 참조한다. 미설정이면 discovery 에서 뺀다(optional).
  # 예: https://auth.plzhans.com/login
  # 인증웹(fe/hans-auth) 외부 주소. 자사 로그인 착지점(/me·/callback)과 discovery 의
  # authorization_endpoint(/login)가 모두 여기서 파생된다.
  # **로컬에서 이 설정으로 띄울 때 덮을 수 있어야 한다.** 소셜 로그인 착지점(/me·/callback)이
  # 여기서 파생되므로, 리터럴로 두면 로컬 서버로 로그인해도 배포된 인증웹으로 날아간다.
  # 값에는 라우터 프리픽스까지 포함한다(예: http://127.0.0.1:5274/auth).
  externalUrl: https://develop-auth.plzhans.com
  # 탈퇴 후 재가입 제한(쿨다운) 보존일. 이 기간엔 같은 이메일 재가입을 막는다.
  withdrawalRetentionDays: 30
  jwt:
    # access token 발급자(iss) 클레임. 미설정이면 iss 를 넣지 않는다.
    issuer: http://develop.plzhans.com
    # 받아들일 iss 허용목록(다중 발급처). 로컬(127.0.0.1)이 dev DB 로 발급한 토큰도 dev 서버가 수용하게.
    allowedIssuers:
      - http://develop.plzhans.com
      - http://127.0.0.1:3000
    # 대칭 서명 비밀키(시크릿). 소셜 state/티켓·OTP pepper·토큰 HMAC 사전검증에 쓴다.
    secret:
    # access token 비대칭(ES256) 서명 키 디렉터리. 키가 있으면 ES256, 없으면 HS256(secret) 폴백.
    keyDir:
    # 만료 3종. **기본값이 코드(auth.config.ts)에 있어 주석으로 가려 둔다** —
    # 이 환경만 다르게 가져갈 때 그 줄을 살린다. 값은 기간 문자열(1h·7d·5m).
    #
    # access token 만료(짧게). 만료되면 refresh 로 재발급.
    #accessTokenExpiresIn: 1h
    # refresh token 만료(길게). 이 기간엔 재로그인 없이 세션이 유지된다.
    #refreshTokenExpiresIn: 7d
    # 인가코드(소셜/OAuth) 만료. 1회용이라 아주 짧게.
    #authCodeExpiresIn: 5m
  otp:
    # 이메일 인증코드 자릿수.
    codeLength: 6
    # 코드 유효시간(초, 10분).
    ttlSec: 600
    # 코드 검증 최대 시도 횟수(초과 시 무효화 — brute-force 방지).
    maxAttempts: 5
    # 재발송 쿨다운(초). 연타 발송 방지.
    resendCooldownSec: 60
    # 시간당 최대 발송 수(스팸·발송비용 방지).
    maxSendsPerHour: 5
    # 코드 해시용 pepper(시크릿). DB 엔 코드 원문이 아니라 해시만 저장한다.
    hashSecret: ${AUTH_JWT_SECRET}

apps-api:
  # 앱 이름. 로그·에러 보고 등에 쓰인다.
  name: hansapp-api
  # 이 서비스의 외부 주소(포털웹). 메일 템플릿의 링크 base 로 쓴다.
  externalUrl: https://develop.plzhans.com
  web:
    # HTTP 리슨 포트. 컨테이너가 APPS_API_WEB_PORT 로 덮을 수 있다.
    port: 3000
    # 대외적으로 표현하는 서비스 공개 URL. 메일 템플릿({{appName}}/{{appUrl}}) 등이 참조한다.
    # nginx 의 ssl_certificate / ssl_certificate_key 와 같은 이름·같은 역할이다.
    # **둘 다 있으면 HTTPS 로, 둘 다 비면 HTTP 로 뜬다.** 한쪽만 있으면 부팅을 거부한다
    # — 조용히 HTTP 로 떨어지면 평문으로 서비스가 열린다.
    #
    # 앞단이 TLS 를 끝내는 구성(nginx·cloudflared tunnel·LB)으로 갈아탈 때는 두 줄을
    # 비우면 되고 코드는 안 바뀐다. 인프라 교체가 설정 두 줄인 셈이다.
    #
    # 발급: backend/ssl-issue.sh <환경> <호스트명>  (Cloudflare Origin CA, 15년)
    # 배포: .enc 로 커밋되고 ci-deploy.sh 가 풀어 서버에 놓는다 — jwt 키와 같은 경로.
    # Cloudflare Origin CA 로 발급한 develop-api.plzhans.com 인증서(2041-07 만료).
    # 경로가 상대경로인 이유: 컨테이너 WORKDIR 이 /app 이고 compose 가 config/develop 을
    # 그 아래로 마운트한다. 로컬에서 돌릴 때도 backend/ 기준이라 같은 경로가 맞는다.
    sslCertificate: ${SSL_CERTIFICATE:config/develop/ssl/fullchain.pem}
    sslCertificateKey: ${SSL_CERTIFICATE_KEY:config/develop/ssl/privkey.pem}
  proxy:
    # Express 'trust proxy'. 프록시(nginx/LB/CDN) 뒤에서 진짜 클라 IP 를 인식하게 한다(rate limit 정확도).
    # 값: 홉 수(1) / 신뢰 IP·CIDR(콤마) / true|false. 위조 XFF 로 IP 한도 우회를 막으려 명시로만 켠다.
    trust: 1
    # rate limit·로그가 쓸 "진짜 클라 IP" 를 뽑을 헤더. 미설정이면 req.ip 폴백.
    # Cloudflare 뒤라면 cf-connecting-ip. (개발은 프록시가 없어 사실상 미사용.)
    clientIpHeader: cf-connecting-ip
  # 에러 추적(Sentry). **DSN 은 비밀이 아니다** — 이벤트 "전송 전용" 공개 엔드포인트라
  # 프론트 번들에도 그대로 박히는 값이고, 이걸로는 아무것도 읽지 못한다. 그래서 env 로 빼지 않고
  # 여기 리터럴로 고정한다(환경별 파일이라 환경마다 다른 프로젝트를 붙일 수도 있다).
  # environment(local|develop|production)·release(버전+커밋 sha)는 코드가 부팅 때 붙인다 → instrument.ts.
  # **dsn 이 비면 Sentry 를 아예 켜지 않는다**(서버는 그대로 뜬다).
  sentry:
    # 끄개. dsn 을 비워도(SENTRY_DSN 이 아니라 <섹션>_SENTRY_DSN=) 꺼지지만, 그러면 어느
    # 프로젝트였는지가 설정에서 사라진다. **apps-api 와 apps-batch 가 이 한 이름을 나눠 쓴다** —
    # 한 번에 둘 다 끄려는 것이다. 개인 오버라이드(config/.env.<환경>.local)로 끈다.
    enabled: ${SENTRY_ENABLED:true}
    dsn: https://30dcd86a5a79770494c2cdb8db9e3cdb@o4507886343159808.ingest.de.sentry.io/4511811369566288
    # 성능 트레이스 표본 비율(0=끔, 1=전부). 개발은 트래픽이 적어 전부 본다.
    tracesSampleRate: 1.0

# 관리자 인증. 공개 API(auth.*)와 계정도 세션도 시크릿도 갈라져 있다.
#
# **ADMIN_JWT_SECRET 은 AUTH_JWT_SECRET 과 반드시 달라야 한다.** 같으면 hansapp-api 가 발급한
# access token 이 관리자 API 의 서명 검증을 통과해, 일반 회원 토큰으로 관리자 API 를 부를 수 있다.
# 부팅 때 두 값을 비교해 같으면 뜨지 않는다 — 설정 실수로 조용히 뚫리는 쪽을 막는다.
admin:
  jwt:
    issuer: https://admin-develop.plzhans.com
    secret: ${ADMIN_JWT_SECRET}
    # accessTokenExpiresIn(5m) / refreshTokenExpiresIn(8h) 기본값은 코드가 원천이다.
    # 환경마다 다르게 갈 때만 이 줄을 살린다.

  # 첫 관리자 계정 자동 생성. **local·develop 전용이다** — 운영에서는 이 값과 무관하게
  # 동작하지 않는다(코드가 막는다. AdminBootstrapService 주석 참고).
  #
  # 계정이 **하나도 없을 때만** 만든다. 재부팅해도 기존 계정은 건드리지 않는다.
  # 이렇게 만든 계정은 첫 로그인에서 비밀번호를 반드시 바꿔야 한다.
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
    email: ${ADMIN_BOOTSTRAP_EMAIL:plzhans@gmail.com}
    name: ${ADMIN_BOOTSTRAP_NAME:관리자}
    # 비우면 난수를 만들어 **부팅 로그에 한 번** 찍는다. 놓쳤으면
    # `hansapp-cli admin password-reset <email>` 로 다시 발급한다.
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

apps-admin-api:
  name: hansapp-admin-api
  externalUrl: https://admin-develop.plzhans.com
  web:
    # **3001 이다(3000 아님).** 관리자 API 의 전용 포트를 환경마다 다르게 두면
    # 로컬에서 develop 설정으로 띄웠을 때 hansapp-api(3000)와 부딪힌다.
    # 컨테이너 안에서는 혼자 떠서 아무 값이나 되지만, compose 의 포트 매핑을
    # `<호스트>:3001` 로 맞춰야 한다.
    port: 3001
    # ⚠️ **아직 비어 있다 → 컨테이너 안에서 HTTP 로 뜬다.**
    # 관리자용 Origin CA 인증서(admin-develop.plzhans.com)를 발급해 config/develop 아래에 두고
    # 이 두 줄을 채우는 것은 배포 배선 단계에서 한다 — 지금은 배포 대상이 아니다.
    # 발급: backend/ssl-issue.sh develop admin-develop.plzhans.com
    sslCertificate: ${ADMIN_SSL_CERTIFICATE:}
    sslCertificateKey: ${ADMIN_SSL_CERTIFICATE_KEY:}
  proxy:
    trust: 1
    clientIpHeader: cf-connecting-ip
  # 관리자 SPA 는 같은 오리진에서 뜬다 → CORS 를 켜지 않는다(비우면 아예 안 켠다).
  cors:
    origins: []
  swagger:
    # 관리자 API 는 외부 소비자가 없다. develop 은 켜 두고 production 만 끈다.
    enabled: ${ADMIN_SWAGGER_ENABLED:true}
  sentry:
    # 끄개는 apps-api·apps-batch 와 같은 이름을 나눠 쓴다 — 한 번에 다 끄려는 것이다.
    enabled: ${SENTRY_ENABLED:true}
    # **아직 프로젝트를 파지 않았다.** 비어 있으면 Sentry 를 아예 켜지 않는다(서버는 그대로 뜬다).
    # 공개 API DSN 을 재사용하지 않는다 — 호출량이 두 자릿수 이상 차이나 관리자 오류가 묻힌다.
    dsn: ''
    tracesSampleRate: 1.0

search:
  # Elasticsearch 정본 스키마 JSON 디렉터리(비밀 아님). **비워서 패키지 동봉본을 쓴다**
  # (@hansapp/search 의 elasticsearch/ — files 에 있어 배포 번들에도 실린다).
  #
  # 여기에 경로를 적으면 cwd 기준이다. 컨테이너의 cwd 는 /app 이고 compose 는 yaml 하나만
  # 마운트하므로, config/schema 같은 값을 두면 정본을 못 찾아 ENOENT 로 죽는다.
  # 서버에서 스키마만 고쳐 재적용할 일이 생기면 그때 디렉터리를 마운트하고 경로를 적는다.
  schemaDir: ''
  # 색인 벌크 배치 크기(한 번에 밀어넣는 문서 수).
  batchSize: 1000

# 메일 설정(mail.*)은 여기 없다. **관리 화면에서 관리하고 DB(env_setting)에 있다.**
# 값을 보거나 고치려면 관리자 → 설정 → 메일 발송. 여기에 다시 적으면 DB 값이 이겨서 안 먹는다.

# ── 외부 플랫폼 provider (OAuth) ────────────────────────────────────────────────
# google/naver/kakao/line 플랫폼 연동 자격증명. **소셜 "로그인" 전용이 아니라** 그 플랫폼 API 를
# 쓰기 위한 provider 다(로그인은 그 용도 중 하나). clientId/secret 이 둘 다 있어야 그 provider 가
# 활성 — 하나라도 없으면 그 provider 만 비활성(서버는 정상).
google:
  clientId:
  clientSecret:

naver:
  clientId:
  clientSecret:

kakao:
  # 카카오는 REST API 키를 clientId 로 쓴다(secret 은 콘솔에서 켰을 때만 선택적으로).
  clientId:
  clientSecret:

line:
  clientId:
  clientSecret:

# 서비스키(krdata.serviceKey · molit.vworld.serviceKey · juso.serviceKey)는 여기 없다.
# **관리 화면에서 관리하고 DB(env_setting)에 있다.** 관리자 → 설정 → 외부 연동.
# 여기에 다시 적어도 DB 값이 이겨서 안 먹는다. 재시도·타임아웃 같은 비밀 아닌 값만 남긴다.

# 공공데이터 포털(data.go.kr / odcloud).
krdata:
  # 호출 실패 시 최대 재시도 횟수.
  maxRetry: 3
  # 응답 읽기 타임아웃(ms).
  readTimeoutMs: 60000
  # HIRA(심평원) 상세 API 버전. 미설정이면 기본 버전을 쓴다.
  hiraDetailVersion:

# 도로명주소(juso.go.kr).
juso:
  maxRetry: 3
  readTimeoutMs: 30000

# 배치 잡. **`batch:` 를 두 번 쓰면 안 된다** — YAML 중복 키는 에러가 아니라 뒤엣것이 앞엣것을
# 통째로 덮는다(cron 이 조용히 사라진다). 배치 설정은 이 블록 하나에 모은다.
apps-batch:
  # 앱 이름. 로그·에러 보고 등에 쓰인다.
  name: hansapp-batch
  # 실행 스케줄(cron). 기본 매일 04:00.
  cron: ${BATCH_CRON:0 4 * * *}
  # 실행당 최대 외부 API 호출 수(0=무제한). 비용·레이트 보호용.
  maxCallsPerRun: ${BATCH_MAX_CALLS_PER_RUN:0}
  # 에러 추적(Sentry). **apps-api 와 별도 프로젝트다**(DSN 이 다르다) — 이슈 스트림과 알림 규칙을
  # 나누려는 것이다. 배치는 "한 번 실패해도 즉시 알림", API 는 "임계치 초과 시 알림" 으로 성격이 다르다.
  # DSN 은 비밀이 아니다(전송 전용 공개값 — apps-api.sentry 주석 참고). 비우면 Sentry 를 켜지 않는다.
  sentry:
    # 끄개. dsn 을 비워도(SENTRY_DSN 이 아니라 <섹션>_SENTRY_DSN=) 꺼지지만, 그러면 어느
    # 프로젝트였는지가 설정에서 사라진다. **apps-api 와 apps-batch 가 이 한 이름을 나눠 쓴다** —
    # 한 번에 둘 다 끄려는 것이다. 개인 오버라이드(config/.env.<환경>.local)로 끈다.
    enabled: ${SENTRY_ENABLED:true}
    dsn: https://a5e2142ef80fdfd565e7a89133fe3347@o4507886343159808.ingest.de.sentry.io/4511811388244048
    # 성능 트레이스 표본 비율(0=끔, 1=전부). 개발은 트래픽이 적어 전부 본다.
    tracesSampleRate: 1.0

# ── 앱 자격증명 암호화 ─────────────────────────────────────────────────────────
# 앱이 등록한 외부 자격증명(LLM 업체 키·외부 서비스 키)을 DB 에 잠글 때 쓰는 마스터 키.
# 32바이트 난수를 base64 로 넣는다.
#   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
#
# **표는 나뉘어도 자물쇠는 하나다** — app_llm_key 와 app_external_key 가 이 꾸러미를 같이 쓴다.
# 나누면 키를 교체할 때 두 벌을 따로 돌려야 하고, 한쪽만 옮긴 채 옛 키를 지우는 사고가 열린다.
#
# **교체는 v2 를 더하는 것이지 v1 을 바꾸는 것이 아니다.** 새로 잠그는 값만 v2 로 가고
# v1 로 잠긴 값은 그대로 남는다 — 다 옮기기 전에 v1 을 지우면 그 값들은 영영 못 연다.
#
# 비어 있으면 키 등록 기능만 꺼진다(서버는 정상 기동).
appSecretEncryption:
  v1: ${APP_SECRET_ENCRYPTION_KEY_V1}

llm:
  # anthropic | openai | local. local 은 OpenAI 호환 엔드포인트(ollama·vLLM·LM Studio).
  defaultProvider: anthropic
  timeoutSec: 30
  # 필터 JSON 만 받으므로 크게 잡을 이유가 없다. 넘치면 잘린 JSON 이라 호출이 실패한다.
  maxTokens: 2048
  # 프롬프트 파일 자리. 상대경로면 cwd → 워크스페이스 루트 순으로 찾는다.
  promptDir: data/healthcare/svc-prompts
  # 질문 끝의 `/test` 를 답변 모드로 받는다. **로그인이 붙기 전까지의 임시 수단**이라
  # 켜져 있으면 누구나 유료로 팔 답변을 공짜로 받는다 — 운영은 반드시 꺼 둔다.
  allowTestCommand: true
  # 응답에 원시 사용량(모델 이름·토큰 내역)을 실는다. **확인용**이다.
  # 사용자에게 파는 단위는 환산 크레딧 하나뿐이고, 어느 모델로 몇 토큰 썼는지가 드러나면
  # 요금이 역산된다 — 화면에서 감추는 것으로는 안 감춰지므로(응답 JSON) 여기서 끊는다.
  exposeDebugUsage: true
  # 답변 서명 키(HMAC-SHA256). **비어 있으면 답변을 문맥으로 이어받지 않는다.**
  # 화면이 돌려보내는 직전 답변은 "우리가 이렇게 답했다" 는 주장이라, 서명이 없으면
  # 아무 문장이나 심어 모델을 유도할 수 있다. 없으면 서명도 안 붙이고 받지도 않는다.
  answerSigningKey:
  # 업체 이름으로 둔다(모델 이름 claude 가 아니라). openai 와 같은 층위여야 읽을 때
  # 헷갈리지 않고, 한 업체가 모델을 여럿 내도 이 키는 그대로다.
  anthropic:
    apiKey: ${ANTHROPIC_API_KEY}
    # 구독 토큰. **로컬 전용** — 개인 구독이라 사용자 트래픽을 태우면 안 된다.
    #   claude setup-token 생성
    # 키와 토큰이 둘 다 있으면 키가 이긴다.
    authToken: ${ANTHROPIC_AUTH_TOKEN}
    defaultModel: ${ANTHROPIC_DEFAULT_MODEL:claude-haiku-4-5}
    # 아직 못 고르는 모델. 화면에 자물쇠와 함께 보인다 — "곧 열린다" 를 미리 알리는 목록이고,
    # 골라도 요청에는 안 실린다. 유료가 열리면 하나씩 defaultModel 쪽으로 옮겨 온다.
    lockedModels: [claude-opus-5]
  openai:
    apiKey: ${OPENAI_API_KEY}
    # 모델 이름은 계정마다 다르다. 기본값을 박아두지 않는다.
    defaultModel: ${OPENAI_DEFAULT_MODEL}
