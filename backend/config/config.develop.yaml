# hansapp develop 환경 설정.
#
# yaml = 구조·기본값의 단일 원천. `${VAR}` 자리표시자는 .env(→process.env) 값으로 치환된다.
# `${VAR:-기본값}` 은 env 가 미설정/빈값이면 기본값을 쓴다. **비밀값은 여기 박지 않고 env 로만 주입.**
# (미설정과 빈값은 동일 취급 — `${VAR}` 는 둘 다 빈 문자열로 치환된다.)

# ── DB (Prisma) ───────────────────────────────────────────────────────────────
# 실제 연결값은 .env. **주의: Prisma migrate 는 yaml 이 아니라 스키마의 env("...") 로 env 를 직접 읽는다**
# (별개 CLI 라 앱/ConfigSource 를 안 탐). 그래서 여기 이름을 바꾸면 prisma 스키마의 env() 도 같이 바꿔야 한다.
database:
  # 메인 DB 연결 문자열(시크릿).
  url: ${DATABASE_URL}
  # 로그 DB. 보존주기·관리 주기가 달라 메인과 분리돼 있다.
  logUrl: ${DATABASE_LOG_URL}
  # prisma migrate dev 전용 shadow DB. 마이그레이션 생성 시 Prisma 가 통째로 비운다(실데이터 금지).
  shadowUrl: ${DATABASE_SHADOW_URL}

# 캐시·세션·rate limit 저장소(시크릿 포함 연결 문자열).
redis:
  url: ${REDIS_URL}

# 검색 엔진 연결(시크릿 포함).
elasticsearch:
  url: ${ELASTICSEARCH_URL}

# API 접근(서비스키·클라이언트) 2단 캐시 TTL. 인증마다 DB 를 때리지 않으려는 것.
# 메모리 → 공유(Redis) → DB. TTL 을 짧게 둬 무효화-조회 경쟁이 나도 이 안에 자가 치유되게 한다.
cache:
  # 프로세스 메모리 캐시 최대 엔트리 수.
  memoryMaxEntries: 10000
  # 프로세스 메모리 캐시 TTL(초, 5분).
  memoryTtlSec: 300
  # 공유 캐시(Redis) TTL(초, 10분).
  sharedTtlSec: 600

auth:
  # 서비스 루트 도메인(앞 점 없이). **SSO 쿠키 Domain + 1st-party 판단이 여기서 파생된다.**
  # *.plzhans.com 을 자사로 인정하고, hans-auth 로그인을 콘솔이 리다이렉트 없이 쿠키로 인지하게 한다.
  # **로컬 API(127.0.0.1)에선 설정 금지**(IP 는 쿠키 Domain 불가 → 미설정 시 host-only + 루프백 폴백).
  rootDomain: ${AUTH_ROOT_DOMAIN:-plzhans.com}
  # bcrypt 비용 계수. 비밀번호 해싱을 의도적으로 느리게 해 brute-force 를 막는다.
  # 1 늘 때마다 연산량(=CPU)이 2배. 10=일반 기본, 12=더 안전. 저사양 서버면 10 권장.
  bcryptRounds: ${AUTH_BCRYPT_ROUNDS:-10}
  # OAuth2 authorization_endpoint = **프론트(hans-auth 로그인 UI)의 로그인 URL**.
  # 백엔드가 "남(프론트)의 주소"라 스스로 못 알아 설정으로 주입. discovery(.well-known)에 실려
  # 외부 클라(medifinder)가 "로그인하러 어디로 보낼지" 참조한다. 미설정이면 discovery 에서 뺀다(optional).
  # 예: https://auth.plzhans.com/login
  authorizeUrl: ${AUTH_AUTHORIZE_URL}
  # 탈퇴 후 재가입 제한(쿨다운) 보존일. 이 기간엔 같은 이메일 재가입을 막는다.
  withdrawalRetentionDays: 30
  jwt:
    # access token 발급자(iss) 클레임. 미설정이면 iss 를 넣지 않는다.
    issuer: http://develop.plzhans.com
    # 받아들일 iss 허용목록(다중 발급처). 로컬(127.0.0.1)이 dev DB 로 발급한 토큰도 dev 서버가 수용하게.
    allowedIssuers:
      - http://develop.plzhans.com
      - http://127.0.0.1:3000
    # 대칭 서명 비밀키(시크릿). 소셜 state/티켓·OTP pepper·토큰 HMAC 사전검증에 쓴다.
    secret: ${AUTH_JWT_SECRET}
    # access token 비대칭(ES256) 서명 키 디렉터리. 키가 있으면 ES256, 없으면 HS256(secret) 폴백.
    keyDir: ${AUTH_JWT_KEY_DIR}
    # access token 만료(짧게). 만료되면 refresh 로 재발급. 1h, 7d 등. 미설정이면 무제한.
    accessTokenExpiresIn: 1h
    # refresh token 만료(길게). 이 기간엔 재로그인 없이 세션이 유지된다.
    refreshTokenExpiresIn: 7d
    # 인가코드(소셜/OAuth) 만료. 1회용이라 아주 짧게.
    authCodeExpiresIn: 5m
  otp:
    # 이메일 인증코드 자릿수.
    codeLength: ${AUTH_OTP_CODE_LENGTH:-6}
    # 코드 유효시간(초, 10분).
    ttlSec: ${AUTH_OTP_TTL_SEC:-600}
    # 코드 검증 최대 시도 횟수(초과 시 무효화 — brute-force 방지).
    maxAttempts: ${AUTH_OTP_MAX_ATTEMPTS:-5}
    # 재발송 쿨다운(초). 연타 발송 방지.
    resendCooldownSec: ${AUTH_OTP_RESEND_COOLDOWN_SEC:-60}
    # 시간당 최대 발송 수(스팸·발송비용 방지).
    maxSendsPerHour: ${AUTH_OTP_MAX_SENDS_PER_HOUR:-5}
    # 코드 해시용 pepper(시크릿). DB 엔 코드 원문이 아니라 해시만 저장한다.
    hashSecret: ${AUTH_JWT_SECRET}

api-server:
  # 앱 이름. 로그·에러 보고 등에 쓰인다.
  name: hansapp-api
  web:
    # HTTP 리슨 포트. 컨테이너가 PORT 로 덮을 수 있다.
    port: 3000
    # 대외적으로 표현하는 서비스 공개 URL. 메일 템플릿({{appName}}/{{appUrl}}) 등이 참조한다.
    publicUrl: http://127.0.0.1:5273
  proxy:
    # Express 'trust proxy'. 프록시(nginx/LB/CDN) 뒤에서 진짜 클라 IP 를 인식하게 한다(rate limit 정확도).
    # 값: 홉 수(1) / 신뢰 IP·CIDR(콤마) / true|false. 위조 XFF 로 IP 한도 우회를 막으려 명시로만 켠다.
    trust: 1
    # rate limit·로그가 쓸 "진짜 클라 IP" 를 뽑을 헤더. 미설정이면 req.ip 폴백.
    # Cloudflare 뒤라면 cf-connecting-ip. (개발은 프록시가 없어 사실상 미사용.)
    clientIpHeader: cf-connecting-ip
  # 에러 추적(Sentry). **DSN 은 비밀이 아니다** — 이벤트 "전송 전용" 공개 엔드포인트라
  # 프론트 번들에도 그대로 박히는 값이고, 이걸로는 아무것도 읽지 못한다. 그래서 env 로 빼지 않고
  # 여기 리터럴로 고정한다(환경별 파일이라 환경마다 다른 프로젝트를 붙일 수도 있다).
  # environment(local|develop|production)·release(버전+커밋 sha)는 코드가 부팅 때 붙인다 → instrument.ts.
  # **dsn 이 비면 Sentry 를 아예 켜지 않는다**(서버는 그대로 뜬다).
  sentry:
    dsn: https://30dcd86a5a79770494c2cdb8db9e3cdb@o4507886343159808.ingest.de.sentry.io/4511811369566288
    # 성능 트레이스 표본 비율(0=끔, 1=전부). 개발은 트래픽이 적어 전부 본다.
    tracesSampleRate: 1.0

search:
  # Elasticsearch 정본 스키마 JSON 디렉터리(비밀 아님). 비우면 패키지 동봉본을 쓴다.
  # 운영에서 리빌드 없이 스키마만 고쳐 재적용할 때 배포 경로의 편집 가능한 자리를 가리킨다.
  schemaDir: config/schema
  # 색인 벌크 배치 크기(한 번에 밀어넣는 문서 수).
  batchSize: 1000

mail:
  # 보내는 사람(RFC 5322).
  from: HansApp <no-reply@plzhans.com>
  # 발송 방식. smtp.
  provider: smtp
  smtp:
    # host 가 있어야 실제 발송. 없으면 콘솔 로깅으로 대체(로컬 개발).
    host: ${MAIL_SMTP_HOST}
    # 587=STARTTLS(secure=false), 465=암묵적 TLS(secure=true).
    port: ${MAIL_SMTP_PORT:-587}
    secure: ${MAIL_SMTP_SECURE:-false}
    user: ${MAIL_SMTP_USER}
    password: ${MAIL_SMTP_PASSWORD}

# ── 외부 플랫폼 provider (OAuth) ────────────────────────────────────────────────
# google/naver/kakao/line 플랫폼 연동 자격증명. **소셜 "로그인" 전용이 아니라** 그 플랫폼 API 를
# 쓰기 위한 provider 다(로그인은 그 용도 중 하나). clientId/secret 이 둘 다 있어야 그 provider 가
# 활성 — 하나라도 없으면 그 provider 만 비활성(서버는 정상).
google:
  clientId: ${GOOGLE_CLIENT_ID}
  clientSecret: ${GOOGLE_CLIENT_SECRET}

naver:
  clientId: ${NAVER_CLIENT_ID}
  clientSecret: ${NAVER_CLIENT_SECRET}

kakao:
  # 카카오는 REST API 키를 clientId 로 쓴다(secret 은 콘솔에서 켰을 때만 선택적으로).
  clientId: ${KAKAO_CLIENT_ID}
  clientSecret: ${KAKAO_CLIENT_SECRET}

line:
  clientId: ${LINE_CLIENT_ID}
  clientSecret: ${LINE_CLIENT_SECRET}

# 공공데이터 포털(data.go.kr / odcloud). NTS 사업자등록 API 도 이 키를 공유한다.
krdata:
  # 서비스키(시크릿).
  serviceKey: ${KRDATA_SERVICE_KEY}
  # 호출 실패 시 최대 재시도 횟수.
  maxRetry: 3
  # 응답 읽기 타임아웃(ms).
  readTimeoutMs: 60000
  # HIRA(심평원) 상세 API 버전. 미설정이면 기본 버전을 쓴다.
  hiraDetailVersion: ${KRDATA_HIRA_DETAIL_VERSION}

# 도로명주소(juso.go.kr).
juso:
  # confmKey(시크릿).
  serviceKey: ${KRGO_JUSO_SERVICE_KEY}
  maxRetry: 3
  readTimeoutMs: 30000

# 배치 잡. **`batch:` 를 두 번 쓰면 안 된다** — YAML 중복 키는 에러가 아니라 뒤엣것이 앞엣것을
# 통째로 덮는다(cron 이 조용히 사라진다). 배치 설정은 이 블록 하나에 모은다.
batch:
  # 앱 이름. 로그·에러 보고 등에 쓰인다.
  name: hansapp-batch
  # 실행 스케줄(cron). 기본 매일 04:00.
  cron: ${BATCH_CRON:-0 4 * * *}
  # 실행당 최대 외부 API 호출 수(0=무제한). 비용·레이트 보호용.
  maxCallsPerRun: ${BATCH_MAX_CALLS_PER_RUN:-0}
  # 에러 추적(Sentry). **api-server 와 별도 프로젝트다**(DSN 이 다르다) — 이슈 스트림과 알림 규칙을
  # 나누려는 것이다. 배치는 "한 번 실패해도 즉시 알림", API 는 "임계치 초과 시 알림" 으로 성격이 다르다.
  # DSN 은 비밀이 아니다(전송 전용 공개값 — api-server.sentry 주석 참고). 비우면 Sentry 를 켜지 않는다.
  sentry:
    dsn: https://a5e2142ef80fdfd565e7a89133fe3347@o4507886343159808.ingest.de.sentry.io/4511811388244048
    # 성능 트레이스 표본 비율(0=끔, 1=전부). 개발은 트래픽이 적어 전부 본다.
    tracesSampleRate: 1.0
