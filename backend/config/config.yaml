# hansapp 설정
#
# 주석 처리된 줄은 기본값이 코드(packages/hansapp-common/src/config-defaults.ts)에 있는
# 항목이다. 적힌 값이 그 기본값이고, 살려 적으면 덮는다.
#
# 읽는 순서 — 뒤가 이긴다.
#   config/config.yaml → config/config.<환경>.yaml → config/config.<환경>.local.yaml → 환경변수
#
# 환경변수 이름은 경로를 대문자로 편 것이다(auth.jwt.secret → AUTH_JWT_SECRET).
# 리스트는 콤마로 준다. 두 경로가 같은 이름으로 접히면 부팅을 거부한다.
# 리스트 값은 인덱스별로 병합되므로 이 파일에서는 항상 빈 리스트로 둔다.
#
# 값 없이 키만 적은 줄은 선언이다 — 값은 환경 파일이나 .env 가 준다. 비밀값은 .env 에만 둔다.

# ── DB (Prisma) ───────────────────────────────────────────────────────────────
# Prisma migrate 는 이 파일이 아니라 스키마의 env("...") 로 환경변수를 직접 읽는다.
# 여기 키 이름을 바꾸면 prisma 스키마의 env() 도 같이 바꿔야 한다.
database:
  # 메인 DB 연결 문자열(시크릿).
  url:
  # 로그 DB 연결 문자열(시크릿).
  logUrl:
  # prisma migrate dev 전용 shadow DB. 마이그레이션 생성 시 Prisma 가 통째로 비운다(실데이터 금지).
  shadowUrl:

# 캐시·세션·rate limit 저장소(시크릿 포함 연결 문자열).
redis:
  url:

elasticsearch:
  # 검색 엔진 연결(시크릿 포함).
  url:
  # 인덱스 이름 접두사. 미설정이면 환경 이름을 쓴다(develop → develop-healthcare_hospital).
  indexPrefix:

# 서버 기동·종료 슬랙 알림. 셋 다 비면 알림만 꺼지고 서버는 정상으로 뜬다.
# botToken 이 있으면 chat.postMessage 로 보내고 종료 알림이 시작 알림의 스레드에 붙는다.
# webhookUrl 은 토큰이 없을 때의 폴백이고, 이때는 시작·종료가 별개 메시지가 된다.
slack:
  # 봇 토큰(시크릿, xoxb-). 슬랙 앱 OAuth & Permissions 에서 chat:write 스코프로 발급.
  botToken:
  # 보낼 채널. C 로 시작하는 id 를 권한다. botToken 을 쓸 때만 유효하다.
  channel:
  # Incoming Webhook URL(시크릿).
  webhookUrl:
  # 기동 알림을 붙일 슬랙 스레드의 ts. 배포가 docker compose up 할 때만 넣는다.
  deployThreadTimestamp:

# API 접근(서비스키·클라이언트) 2단 캐시 TTL. 메모리 → 공유(Redis) → DB.
#cache:
#  # 프로세스 메모리 캐시 최대 엔트리 수. default: 10000
#  memoryMaxEntries: 10000
#  # 프로세스 메모리 캐시 TTL(초). default: 300
#  memoryTtlSec: 300
#  # 공유 캐시(Redis) TTL(초). default: 600
#  sharedTtlSec: 600

# 오류 추적(Sentry) 공통 설정. 앱별 enabled·dsn·tracesSampleRate 는 apps-*.sentry 에 있다.
sentry:
  # 추적 헤더(sentry-trace·baggage)를 붙일 호스트. 하위 도메인 포함.
  # 여기 없는 주소에는 붙지 않는다. 비우면 어디에도 붙이지 않는다.
  tracePropagationTargets:
    - localhost
    - 127.0.0.1
    - plzhans.com

auth:
  # 서비스 루트 도메인(앞 점 없이). SSO 쿠키 Domain 과 1st-party 판단이 여기서 파생된다.
  # IP 로 뜨는 환경(127.0.0.1)에는 설정할 수 없다 — 비우면 host-only 쿠키로 폴백한다.
  rootDomain: plzhans.com
  # 소셜 로그인 흐름(state·흐름 쿠키)의 유효시간(초). default: 600
  #socialFlowTtlSec: 600
  # 쿠키에 Secure 를 붙일지. default: true
  # http 로 뜨는 환경은 false 로 둔다 — true 면 브라우저가 쿠키를 버린다.
  #cookieSecure: true
  # 쿠키 이름 접두사. 환경마다 달라야 한다. 미설정이면 환경 이름에서 만든다(production 은 없음).
  cookiePrefix:
  # bcrypt 비용 계수. 1 늘 때마다 연산량이 2배. default: 10
  #bcryptRounds: 10
  # 인증웹(fe/hans-auth) 외부 주소. 라우터 프리픽스까지 포함한다.
  # 로그인 착지점(/me·/callback)과 discovery 의 authorization_endpoint(/login)가 여기서 파생된다.
  # 미설정이면 discovery 에서 authorization_endpoint 를 뺀다.
  externalUrl:
  # 탈퇴 후 같은 이메일 재가입을 막는 기간(일). default: 30
  #withdrawalRetentionDays: 30
  # 한 사용자의 동시 세션 수. 넘치면 오래된 것부터 지운다. 0 이하면 무제한. default: 10
  #maxSessionsPerUser: 10
  jwt:
    # access token 의 iss 클레임. 미설정이면 iss 를 넣지 않는다.
    issuer:
    # 받아들일 iss 목록. 자기 issuer 는 코드가 자동 포함한다.
    allowedIssuers: []
    # 대칭 서명 비밀키(시크릿). 소셜 state/티켓·OTP pepper·토큰 HMAC 에 쓴다.
    secret:
    # access token 비대칭(ES256) 서명 키 디렉터리. 키가 있으면 ES256, 없으면 HS256(secret).
    keyDir:
    # 만료. 기간 문자열(30s·5m·1h·7d).
    #accessTokenExpiresIn: 1h
    #refreshTokenExpiresIn: 7d
    # 소셜·OAuth 인가코드 만료.
    #authCodeExpiresIn: 5m
  otp:
    # 이메일 인증코드 자릿수. default: 6
    #codeLength: 6
    # 코드 유효시간(초). default: 600
    #ttlSec: 600
    # 코드 검증 최대 시도 횟수. 넘으면 무효화. default: 5
    #maxAttempts: 5
    # 재발송 쿨다운(초). default: 60
    #resendCooldownSec: 60
    # 시간당 최대 발송 수. default: 5
    #maxSendsPerHour: 5
  #consent:
  #  # 지금 유효한 약관·방침의 판(시행일). 요청이 보낸 판과 다르면 가입을 거절한다.
  #  # frontend/legal 의 각 JSON `version` 과 같아야 한다.
  #  termsVersion: '2026-08-06'
  #  privacyVersion: '2026-08-06'

apps-api:
  # 앱 이름. 로그·에러 보고·메일 템플릿에 쓰인다. default: HansApp
  name: hansapp-api
  # 이 서비스의 외부 주소(콘솔웹 hansapp-web). 메일 템플릿의 링크 base.
  externalUrl:
  web:
    # HTTP 리슨 포트. default: 3000
    #port: 3000
    # 서버가 직접 끝내는 TLS. 미설정이면 HTTP 로 뜬다.
    # 둘 다 있으면 HTTPS, 둘 다 비면 HTTP, 한쪽만 있으면 부팅을 거부한다.
    # 경로는 cwd 기준(컨테이너는 /app).
    # 발급: backend/ssl-issue.sh <환경> <호스트명>
    #sslCertificate: config/<환경>/ssl/fullchain.pem
    #sslCertificateKey: config/<환경>/ssl/privkey.pem
  # 프록시(CDN/LB) 뒤에서 진짜 클라 IP 를 인식하는 설정. 미설정이면 쓰지 않는다.
  #proxy:
  #  # Express 'trust proxy'. 홉 수(1) / 신뢰 IP·CIDR(콤마) / true|false.
  #  # 실제 홉 수보다 크면 위조 XFF 로 IP 한도를 우회할 수 있다.
  #  trust: 1
  #  # rate limit·로그가 쓸 클라 IP 를 뽑을 헤더. 미설정이면 req.ip.
  #  clientIpHeader: cf-connecting-ip
  # API 문서(/docs, /openapi.json) 노출. 켜면 잠금 없이 누구나 본다 — 운영에서는 켜지 않는다.
  #swagger:
  #  # default: false
  #  enabled: false
  # 에러 추적(Sentry). dsn 이 비면 켜지 않는다. environment·release 는 코드가 부팅 때 붙인다.
  sentry:
    # default: false
    #enabled: false
    # 전송 전용 공개 엔드포인트라 비밀이 아니다.
    dsn: https://30dcd86a5a79770494c2cdb8db9e3cdb@o4507886343159808.ingest.de.sentry.io/4511811369566288
    # 성능 트레이스 표본 비율. 0=끔, 1=전부. default: 0.1
    #tracesSampleRate: 0.1

# 관리자 인증. 공개 API(auth.*)와 계정·세션·시크릿이 갈라져 있다.
# admin.jwt.secret 은 auth.jwt.secret 과 달라야 한다 — 같으면 부팅을 거부한다.
admin:
  jwt:
    # 관리자 access token 의 iss. 미설정이면 iss 를 넣지 않는다.
    #
    # **배치도 이 값을 읽는다.** 여기가 곧 공개키(JWKS) 주소라, 배치가 "지금 실행" 요청을
    # 검증할 때 `<issuer>/.well-known/jwks.json` 을 받아 오고 토큰의 iss 도 이 값으로 대조한다.
    # 비어 있으면 그 기능만 꺼진다(로그인은 그대로 된다).
    issuer:
    # 받아들일 iss 목록. 자기 issuer 는 코드가 자동 포함한다.
    # 로컬이 dev DB 에 붙어 세션 표를 공유할 때처럼 발급처가 여럿일 때 적는다.
    allowedIssuers: []
    # 관리자 전용 서명 비밀키(시크릿). keyDir 이 없을 때 이 키로 HS256 서명한다.
    secret:
    # 관리자 토큰 비대칭(ES256) 서명 키 디렉터리. 키가 있으면 ES256, 없으면 HS256(secret).
    # 규칙은 auth.jwt.keyDir 과 같다.
    #
    # **배치의 "지금 실행" 은 이게 있어야 된다.** 배치는 여기 공개키(JWKS)로 요청을 검증하는데
    # HS256 이면 나눠 줄 공개키가 없다. 로그인은 어느 쪽이든 그대로 돈다.
    # 발급: pnpm hansapp-cli jwt gen --app admin  → config/admin/<환경>/jwt
    # **공용 번들 밖이라 배포가 명시해야 서버에 간다**(ci-deploy.sh 의 DEPLOY_ADMIN_SECRETS).
    keyDir:
    #accessTokenExpiresIn: 1h
    #refreshTokenExpiresIn: 8h
  # bcrypt 비용 계수. default: 10
  #bcryptRounds: 10
  # 한 관리자의 동시 세션 수. default: 5
  #maxSessionsPerAdmin: 5
  # 첫 관리자 계정 자동 생성. 계정이 하나도 없을 때만 만들고, 그 계정은 첫 로그인에서
  # 비밀번호를 바꿔야 한다. production 에서는 켜도 코드가 거부한다.
  # 계정 정보라 값은 .env 에서 준다.
  #   ADMIN_BOOTSTRAP_ENABLED    default: false
  #   ADMIN_BOOTSTRAP_EMAIL
  #   ADMIN_BOOTSTRAP_NAME       default: 관리자
  #   ADMIN_BOOTSTRAP_PASSWORD   비우면 난수를 만들어 부팅 로그에 한 번 찍는다.
  #                              놓쳤으면 `hansapp-cli admin password-reset <email>`
  #bootstrap:
  #  enabled: false

apps-admin-api:
  # 앱 이름. default: hansapp-admin-api
  #name: hansapp-admin-api
  # 관리자 콘솔의 외부 주소.
  externalUrl:
  web:
    # HTTP 리슨 포트. default: 3001
    #port: 3001
    # 규칙은 apps-api.web 과 같다. 미설정이면 HTTP.
    # 발급: backend/ssl-issue.sh <환경> admin-<호스트명>
    #sslCertificate: config/<환경>/ssl/admin-fullchain.pem
    #sslCertificateKey: config/<환경>/ssl/admin-privkey.pem
  # 규칙은 apps-api.proxy 와 같다. 미설정이면 쓰지 않는다.
  #proxy:
  #  trust: 1
  #  clientIpHeader: cf-connecting-ip
  # 허용할 오리진. 비우면 CORS 를 켜지 않는다.
  # 관리자 SPA 를 별도 dev server 로 띄우는 환경만 적는다.
  cors:
    origins: []
  # 관리자 API 문서. IP 제한 장치가 없다.
  #swagger:
  #  # default: false
  #  enabled: false
  sentry:
    # default: false
    #enabled: false
    # 공개 API 와 다른 프로젝트를 쓴다. 전송 전용 공개 엔드포인트라 비밀이 아니다.
    dsn: https://d955366296cc14900ce2691aa616f4e6@o4507886343159808.ingest.de.sentry.io/4511914842194000
    # default: 0.1
    #tracesSampleRate: 0.1

search:
  # Elasticsearch 정본 스키마 JSON 디렉터리. 비우면 @hansapp/search 동봉본을 쓴다.
  # 경로는 cwd 기준(컨테이너는 /app).
  schemaDir: ''
  # 색인 벌크 배치 크기(한 번에 밀어넣는 문서 수). default: 1000
  #batchSize: 1000

# 공공데이터 포털(data.go.kr). NTS 사업자등록도 이 키를 공유한다.
#krdata:
#  # 호출 실패 시 최대 재시도 횟수. default: 3
#  maxRetry: 3
#  # 응답 읽기 타임아웃(ms). default: 60000
#  readTimeoutMs: 60000

# 도로명주소(juso.go.kr).
#juso:
#  # default: 3
#  maxRetry: 3
#  # default: 30000
#  readTimeoutMs: 30000

# 도메인 이벤트 큐.
#events:
#  # 동시 소비 수. default: 5
#  concurrency: 5

# 배치 잡. `apps-batch:` 를 두 번 쓰면 뒤엣것이 앞엣것을 통째로 덮는다.
apps-batch:
  # 앱 이름. default: hansapp-batch
  #name: hansapp-batch
  # 앞단 nginx 를 지나 이 프로세스에 닿는 주소.
  #
  # **관리자 API 가 "지금 실행" 을 여기로 보낸다.** 부르는 쪽이 아니라 여기 적는 것은 주소의
  # 주인이 배치이기 때문이다 — 사본이 둘이면 옮길 때 한쪽만 고쳐져 조용히 못 붙는다.
  # 비어 있으면 콘솔의 수동 실행이 막힌다(크론은 그대로 돈다).
  externalUrl:
  # 상주 모드가 여는 포트. 헬스체크와 콘솔의 "지금 실행" 을 여기서 받는다.
  # 이미 떠 있으면 부팅이 실패한다 — 한 컴퓨터에 하나만 띄우는 가드를 겸한다.
  #web:
  #  # default: 3002
  #  port: 3002
  #  # 어느 주소에 붙을까. default: 127.0.0.1
  #  # **컨테이너는 이미지가 0.0.0.0 으로 정해 둔다**(hansapp-batch.Dockerfile) — 도커가 발행한
  #  # 포트로 넘기려면 루프백이면 안 된다. 여기서 바꿀 일은 거의 없다.
  #  bindAddress: 127.0.0.1
  # 크론식을 해석할 타임존. default: Asia/Seoul
  #timeZone: Asia/Seoul
  # 실행당 최대 외부 API 호출 수. 0=무제한. default: 0
  #maxCallsPerRun: 0
  # 잡별 실행 주기(cron). 잡마다 따로 둔다 — 원본이 다르면 갱신주기도 한도도 따로 논다.
  #jobs:
  #  # 법정동코드 적재(지역 정본). default: 0 3 * * *
  #  mois:
  #    cron: 0 3 * * *
  #  # 심평원 동기화. default: 0 4 * * *
  #  hira:
  #    cron: 0 4 * * *
  #  # 국립중앙의료원 동기화. default: 0 5 * * *
  #  nmc:
  #    cron: 0 5 * * *
  #  # 통합 병원 생성(외부 API 안 부름). default: 0 6 * * *
  #  healthcare:
  #    cron: 0 6 * * *
  #  # 검색 색인 반영(전량). default: 30 6 * * *
  #  es-index:
  #    cron: 30 6 * * *
  #  # 인증 부산물 정리. default: 0 7 * * *
  #  auth-cleanup:
  #    cron: 0 7 * * *
  sentry:
    # default: false
    #enabled: false
    # apps-api 와 다른 프로젝트를 쓴다.
    dsn: https://a5e2142ef80fdfd565e7a89133fe3347@o4507886343159808.ingest.de.sentry.io/4511811388244048
    # default: 0
    #tracesSampleRate: 0

# 앱이 등록한 외부 자격증명을 DB 에 잠글 때 쓰는 마스터 키. 32바이트 난수를 base64 로 넣는다.
#   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
#
# 교체는 v2 를 더하는 것이고 v1 은 지우지 않는다 — v1 로 잠긴 값은 v1 로만 열린다.
# 비어 있으면 키 등록 기능만 꺼진다(서버는 정상 기동).
appSecretEncryption:
  v1: ${APP_SECRET_ENCRYPTION_KEY_V1}

llm:
