# hansapi 앱 설정 (비밀 아님, production 환경). 커밋된다.
# 자세한 규칙은 config/develop.yaml 주석 참고.

# HTTP 리슨 포트. 컨테이너가 PORT 로 덮을 수 있다.
port: 3000

# 운영은 프록시(nginx/LB) 뒤다. 앞단 프록시 홉 수에 맞춘다.
# 현재는 배포 토폴로지 확정 전이라 환경변수(TRUST_PROXY)로 주입해 쓰던 동작을 유지한다.
# 토폴로지가 확정되면 아래 값을 켜서 여기서 관리한다.
# trustProxy: 1

# rate limit·로그가 쓸 "진짜 클라 IP" 헤더. 미설정이면 req.ip 폴백.
# 앞단이 Cloudflare 면 cf-connecting-ip. 현재는 미설정(기존 동작 유지) — 토폴로지 확정 시 켠다.
# clientIpHeader: cf-connecting-ip
