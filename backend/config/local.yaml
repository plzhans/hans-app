# hansapi 앱 설정 (비밀 아님, local 환경). 커밋된다.
# 자세한 규칙은 config/develop.yaml 주석 참고.

# HTTP 리슨 포트. 컨테이너가 PORT 로 덮을 수 있다.
port: 3000

# local 은 프록시 없음 → trust proxy 끔.
# trustProxy: 1

# rate limit·로그가 쓸 "진짜 클라 IP" 헤더. 미설정이면 req.ip 폴백. local 은 미설정.
# clientIpHeader: cf-connecting-ip

# Elasticsearch 정본 스키마 JSON 디렉터리(비밀 아님). 비우면 패키지 동봉본을 쓴다.
# 운영에서 리빌드 없이 스키마만 고쳐 재적용할 때 배포 경로의 편집 가능한 자리를 가리킨다.
# 접속 URL(ELASTICSEARCH_URL)은 시크릿이라 .env 로 주입한다.
# elasticsearchSchemaDir: config/schema
