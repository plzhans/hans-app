# develop-api.plzhans.com http

# 파일 권한주기
# chown -R ubuntu:www-data /home/ubuntu/app/www/acme
# chmod -R 755 /home/ubuntu/app/www/acme

# HTTP: ACME 챌린지만 받고 나머지는 전부 HTTPS 로 넘긴다.
server {
    listen 80;
    listen [::]:80;
    server_name api.plzhans.com;

    # acme.sh webroot 모드용. 위 --issue -w 경로와 반드시 일치시킨다.
    location /.well-known/acme-challenge/ {
        root /home/ubuntu/app/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
