# /etc/nginx/sites-enabled/ 에 심볼릭 링크. (또는 conf.d/ 에 직접 넣는다)
# 이 파일은 http {} 안으로 include 된다 — 아래 map 이 http 컨텍스트에 들어간다.

# ── 기본 서버는 여기서 정의하지 않는다 (참고용) ──────────────────────────────
#
# **이름이 안 맞는 요청을 끊는 일은 서버 전체의 몫이라 이 파일이 가질 수 없다.**
# `default_server` 는 포트마다 하나뿐이고, Ubuntu 의 nginx 는 이미
# /etc/nginx/sites-enabled/default 가 그것을 들고 있다. 여기에 또 두면
# "a duplicate default server" 로 nginx 가 아예 안 뜬다.
#
# 그래서 그쪽에서 처리한다. 아래는 그때 쓸 모양을 남겨 둔 것이다.
#
# 없으면 첫 번째 server 블록이 기본이 되어, **공인 IP 로 직접 때리거나 아무 호스트명으로
# 와도 관리자 콘솔이 응답한다.**
# ─────────────────────────────────────────────────────────────────────────────
# server {
#     listen 80 default_server;
#     listen [::]:80 default_server;
#     server_name _;
#     # 444 는 nginx 전용 — 응답 없이 연결을 끊는다. 스캐너에게 아무것도 알려주지 않는다.
#     return 444;
# }

# server {
#     listen 443 ssl default_server;
#     listen [::]:443 ssl default_server;
#     server_name _;
#     # 인증서 없이 TLS 핸드셰이크 자체를 거절한다(nginx 1.19.4+).
#     # 이게 없으면 이 블록에도 ssl_certificate 를 줘야 하고, 그러면 우리 인증서가
#     # 아무 이름의 요청에나 제시된다.
#     ssl_reject_handshake on;
# }

# HTTP: HTTPS 로 보낸다. 관리자 콘솔은 평문으로 받을 이유가 없다.
server {
    listen 80;
    listen [::]:80;
    server_name admin.plzhans.com;
    return 301 https://$host$request_uri;
}

# HTTPS: 실제 리버스 프록시.
server {
    # http2 는 listen 파라미터로 붙인다. 별도 `http2 on;` directive 는 nginx 1.25.1+ 전용이라
    # 구버전에서 unknown directive 로 죽는다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.plzhans.com;

    # acme.sh --install-cert 로 여기에 심는다 (위 install-cert 경로와 일치).
    ssl_certificate     /home/ubuntu/app/ssl/plzhans.com/fullchain.pem;
    ssl_certificate_key /home/ubuntu/app/ssl/plzhans.com/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 업로드 크기 여유 (필요에 맞게 조정)
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 웹소켓/업그레이드 대응
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}