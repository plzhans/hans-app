# production 서버에서 backend 를 띄운다.
#
# **배포가 서버로 복사한다**(scripts/deploy/ci-deploy.sh). 서버에서 고치지 말 것 — 다음
# 배포가 덮어쓴다.
#
#   이미지 버전   같은 디렉터리의 .env 에 IMAGE_TAG 한 줄. 롤백은 그 값을 바꿔 다시 up
#   uid           같은 .env 의 APP_UID·APP_GID. 배포 계정 번호가 들어간다
#   시크릿        서버가 이미 갖고 있다. 레포에는 SOPS 로만 있다(.sops.yaml)
#
# 그래서 **이 파일은 인프라, .env 는 배포 상태**로 역할이 갈린다.

name: hansapp-production

# 세 서비스가 같은 설정을 쓴다. 다른 것은 이미지와 포트뿐이다.
x-common: &common
  restart: unless-stopped
  # **설정 yaml 은 두 장이다.** 공통값·설명이 든 config.yaml 위에 환경별 파일이 덮는다
  # (앱이 APP_ENV 를 보고 두 번째 파일 이름을 만든다 — .env.<환경> 안에 있다).
  #
  # 예전엔 환경별 파일을 config.yaml 이라는 이름으로 얹어 한 장만 줬다. 그 시절엔 파일이
  # 자기완결적이라 그래도 됐지만, 지금은 공통값이 config.yaml 에만 있어 그러면 다 사라진다.
  # 두 장을 이미지에 굽지 않고 배포가 나르는 것은 그대로다 — **기본값이 바뀌었다고 이미지를
  # 다시 말 이유는 없다.**
  volumes:
    - ./config/config.yaml:/app/config/config.yaml:ro
    - ./config/config.production.yaml:/app/config/config.production.yaml:ro
    - ./config/production:/app/config/secrets:ro
  # **env 는 마운트가 아니라 주입한다.** 도커가 호스트에서 읽어 환경변수로 넣는다.
  #
  # format: raw 를 쓰지 않는다 — 보간만 끄는 게 아니라 따옴표도 안 벗겨서 DATABASE_URL 이
  # '"mysql://…"' 가 되고 prisma 가 죽는다. 대신 배포가 나를 때 $ 를 $$ 로 바꾼다.
  env_file: ./config/.env.production
  # 마운트된 설정의 소유자(배포 계정)와 같은 번호로 돈다. 이미지도 같은 값으로 굽는다.
  user: '${APP_UID:-1001}:${APP_GID:-1001}'
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

services:
  api:
    <<: *common
    image: ghcr.io/plzhans/hans-app/hansapp-api:${IMAGE_TAG}
    container_name: hansapp-prod-api
    # **Cloudflare 가 이 컨테이너에 직접 붙는다.** 앞단이 없다 — 앱이 TLS 를 스스로 끝내고
    # (Origin CA) CF 가 Full (strict) 로 검증한다. nginx 는 admin 만 받는다.
    #
    # **develop 과 production 이 같은 서버에 뜬다.** 호스트 포트가 갈려야 둘 다 산다.
    # **443 은 nginx 가 가져간다**(admin 서빙). 그래서 api 는 production=7443, develop=8443 —
    # 뒤 세 자리를 맞춰 둬서 어느 환경 것인지가 앞자리 하나로 갈린다.
    #
    # ⚠️ **443 이 아니면 CF 원본 규칙이 있어야 한다.** 규칙이 없으면 CF 는 443 으로 붙고,
    # 거기엔 nginx 가 앉아 있어 api 요청이 엉뚱한 곳으로 간다(docs/cloudflare.md).
    #
    # **클라우드 방화벽(OCI 보안목록)에도 열어야 한다.** 서버 안에서는 리스닝인데 밖에서
    # 막혀 CF 가 522 를 뱉는 일이 흔하다. 가능하면 CF 대역만 허용한다.
    ports:
      - '7443:3000'
    # 이 컨테이너를 띄운 배포의 슬랙 스레드. 있으면 기동 알림이 그 스레드에 붙는다.
    # **x-common 이 아니라 여기에만 둔다** — batch·migrate 까지 답글을 달 이유가 없다.
    # 값은 배포가 `docker compose up` 할 때만 넘긴다(ci-deploy.sh).
    environment:
      SLACK_DEPLOY_THREAD_TIMESTAMP: ${SLACK_DEPLOY_THREAD_TIMESTAMP:-}
    depends_on:
      redis:
        condition: service_healthy

  batch:
    <<: *common
    image: ghcr.io/plzhans/hans-app/hansapp-batch:${IMAGE_TAG}
    container_name: hansapp-prod-batch
    depends_on:
      redis:
        condition: service_healthy

  # 관리자 콘솔. **API 와 SPA 가 한 이미지에 같이 있다** — 태그 하나가 둘의 버전이라
  # 롤백도 같이 돈다(backend/docker/hansapp-admin.Dockerfile).
  #
  # **앞단 nginx 가 TLS 와 IP 제한을 하고 통째로 프록시한다.** 그래서 이 컨테이너는 평문으로
  # 뜨고 인증서를 모른다 — api 와 다른 점이다(그쪽은 CF 가 직접 붙어 스스로 TLS 를 끝낸다).
  #
  # **127.0.0.1 에만 바인딩한다.** 밖에서 직접 닿으면 nginx 의 IP 제한을 지나치게 된다.
  # 클라우드 방화벽에도 이 포트를 열지 않는다.
  admin:
    <<: *common
    image: ghcr.io/plzhans/hans-app/hansapp-admin:${IMAGE_TAG}
    container_name: hansapp-prod-admin
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      redis:
        condition: service_healthy

  # 캐시(hospital:* · auth:*). 세션·토큰은 DB 에 있어 이 데이터는 잃어도 콜드 캐시로 끝난다.
  #
  # **x-common 을 안 쓴다.** 서드파티 이미지라 셋 다 사정이 다르다:
  #   user      이미지가 /data 를 자기 uid(redis)로 소유한다. 배포 계정 번호를 강제하면 못 쓴다
  #   env_file  앱 시크릿 전부를 캐시 컨테이너 환경에 넣지 않는다. 비밀번호만 따로 받는다
  #   volumes   붙일 앱 설정이 없다
  redis:
    image: redis:7.4-alpine
    container_name: hansapp-prod-redis
    restart: unless-stopped
    # 비밀번호 한 줄짜리 서비스 전용 env(ci-deploy.sh 가 놓는다).
    # 옆의 `.env` 는 compose 보간용(IMAGE_TAG·uid)이라 성격이 다르다 — 섞지 말 것.
    env_file: .env.redis
    # 공식 엔트리포인트는 root 로 받아 gosu 로 redis 에 넘기는데, 아래 셸이 필요해 그 경로를
    # 못 탄다. 처음부터 redis 로 돈다 — 새 네임드 볼륨은 이미지의 /data 소유권을 물려받는다.
    user: redis
    # **설정 파일 경로를 반드시 첫 인자로 넘긴다.** 없으면 redis-server 가 마운트된 파일을
    # 무시하고 내장 기본값(maxmemory 무제한 · appendonly no)으로 뜬다.
    #
    # 비밀번호는 커밋되는 conf 에 안 남긴다. `$$` 는 compose 보간을 피해 **컨테이너 안의 셸**이
    # 풀게 하는 것 — 평문이 이 파일에도 `docker inspect` 에도 안 남는다.
    entrypoint: ['sh', '-c']
    command:
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
    # 사람이 VPN 으로 붙는 창구. 앱은 안 쓴다 — compose 네트워크의 `redis:6379` 로 붙는다.
    #
    # **develop 과 production 이 같은 호스트에 뜬다.** 호스트 포트가 갈려야 둘 다 산다 —
    # production=6380, develop=6379. 컨테이너 안은 둘 다 6379 다.
    #
    # ⚠️ 바인드 주소가 없으므로 **0.0.0.0 에 열린다**(공인 NIC 포함). 막는 것은 **OCI
    # Security List 뿐**이다 — 호스트 ufw 는 도커가 iptables 를 직접 만져 우회한다.
    # 6379·6380 을 보안목록에서 절대 열지 말 것.
    ports:
      - '6380:6379'
    # **conf 는 config/ 가 아니라 redis/ 밑에 둔다.** config/ 는 배포가 0600·배포계정 소유로
    # 잠그는 자리라 uid 가 다른 이 컨테이너가 못 읽는다. 시크릿이 없어 0644 로 따로 놓는다.
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      # 컨테이너 내부 env 를 쓰려고 compose 보간을 피해 $$ 로 이스케이프한다.
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # 운영 도구(hansapp-cli). **서비스가 아니라 작업이다** — 한 번 돌고 죽는다.
  #
  #   docker compose run --rm hansapp-cli db deploy              스키마 반영
  #   docker compose run --rm hansapp-cli db seed                코드·지역 시드
  #   docker compose run --rm hansapp-cli healthcare names       병원 이름 재계산
  #   docker compose run --rm hansapp-cli es hospital reindex    무중단 재색인
  #
  # **이미지 이름을 그대로 서비스 이름으로 쓴다.** 예전엔 migrate 였는데, 실제로는
  # 마이그레이션 말고도 시드·재색인을 다 이 컨테이너로 돌리고 있어서 이름이 하는 일을
  # 좁게 말하고 있었다. 무엇이 뜨는지가 이름에 그대로 보이는 편이 낫다.
  #
  # profiles 에 넣어 `up` 이 이것까지 띄우지 않게 한다. 배포 스크립트가 배포 직전에
  # 부른다 — 컨테이너 교체와 스키마 반영은 실패했을 때 할 일이 달라서, 한 덩어리로
  # 묶으면 "어디까지 갔나" 가 흐려진다.
  hansapp-cli:
    <<: *common
    image: ghcr.io/plzhans/hans-app/hansapp-cli:${IMAGE_TAG}
    profiles: [cli]
    restart: 'no'
    # 비밀 에셋(jwt·TLS)은 앱의 것이라 붙이지 않는다. CLI 는 yaml 과 env 만 있으면 된다.
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./config/config.production.yaml:/app/config/config.production.yaml:ro

# 바인드가 아니라 네임드 볼륨이다 — 배포 디렉터리는 매 배포마다 갈아끼워지는 자리라
# 그 아래에 데이터를 두면 배포 절차와 수명이 얽힌다.
# 볼륨 이름에는 compose 프로젝트명이 붙어 develop 과 production 이 갈린다.
volumes:
  redis-data:
