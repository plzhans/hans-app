# Elasticsearch (develop 서버) — OCI ARM A1 · 2CPU · 12GB RAM 단일 노드.
#
# 이 폴더(elasticsearch/)는 self-contained 하다. 배포 시 이 폴더만 통째로 가져가면 된다.
# Dockerfile 도 같은 폴더에 있어 build context 가 "." 이다.
#
# ── 실행 전 준비 ──────────────────────────────────────────────
#   1) 같은 폴더에 .env 생성:  ELASTIC_PASSWORD=<원하는 비밀번호>
#   2) 호스트 커널 파라미터(엘라스틱서치 필수, 컨테이너에서 못 바꿈):
#        sudo sysctl -w vm.max_map_count=262144
#        # 영구화: echo 'vm.max_map_count=262144' | sudo tee /etc/sysctl.d/99-es.conf
#   3) docker compose up -d --build
# ─────────────────────────────────────────────────────────────

name: hansapp-search

services:
  elasticsearch:
    build:
      context: .
      args:
        ES_VERSION: '9.3.1'
    image: hansapp/elasticsearch:9.3.1
    container_name: hansapp-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      # 보안 on. develop 은 WireGuard 내부망이라 SSL 은 끈다(내부에서만 붙음).
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      # elastic 유저 초기 비밀번호 — .env 에서 주입(미설정 시 기동 거부).
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD 를 .env 에 설정하세요}
      # heap: 이 서버는 앱(pm2)도 같이 도므로 3g. 엘라스틱서치 전용 서버면 4g 까지 올려도 됨.
      #       Xms=Xmx 로 고정(리사이징 중 GC 튐 방지), RAM 의 50% 이하 유지.
      - ES_JAVA_OPTS=-Xms3g -Xmx3g
      # heap 이 스왑으로 밀려나 성능 급락하는 것 방지(아래 ulimits.memlock 과 한 쌍).
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # 인덱스 영속화 — 컨테이너 재생성 때 데이터 유지.
      - es-data:/usr/share/elasticsearch/data
    # **바인드 주소를 하드코딩하지 않는다.** 앱이 같은 호스트에 pm2 로 돌던 시절엔 루프백으로
    # 충분했지만, 지금은 앱이 다른 호스트(도커)에 있어 사설 NIC 로 받아야 붙는다.
    # 서버 사정으로 주소가 바뀔 수 있으니 compose 가 아니라 그 서버의 .env 가 정한다.
    #
    # 값은 **사설 NIC 주소**로 둔다(`ip -br addr`). 0.0.0.0 으로 열면 공인 경로까지 열려
    # 클라우드 방화벽에만 의존하게 된다.
    #
    # 기본값이 127.0.0.1 인 이유: 미설정 시 **닫히는 쪽으로 실패**해야 하기 때문이다.
    ports:
      - '${ELASTICSEARCH_BIND:-127.0.0.1}:${ELASTICSEARCH_PORT:-9200}:9200'
    healthcheck:
      # 컨테이너 내부 env(ELASTIC_PASSWORD)를 쓰기 위해 compose 보간을 피해 $$ 로 이스케이프.
      test:
        [
          'CMD-SHELL',
          'curl -sf -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  es-data:
