# Redis (production) — 앱 compose 의 redis 서비스가 마운트해 읽는다.
#
# **배포가 서버로 복사한다**(scripts/deploy/ci-deploy.sh). 서버에서 고치지 말 것 —
# 다음 배포가 덮어쓴다. compose 와 같은 취급이다.
#
# **시크릿 금지** — 이 파일은 커밋된다. 비밀번호는 compose 가 `--requirepass` 로 넘긴다
# (원본은 infra/production/.env.redis).

# Network
timeout 300
tcp-keepalive 60

# Memory
# **한 호스트에 두 인스턴스가 뜬다.** 합이 호스트 여유 메모리를 넘지 않게 나눈다.
# 프로세스가 갈려 있어 한쪽이 채워도 다른 쪽 키가 밀려나지 않는다 — 접두사만으로는
# 못 막던 부분이 여기서 갈린다.
#
# **maxmemory-policy 는 적지 않는다** — Redis 기본값 noeviction 을 그대로 쓴다.
# 큐(BullMQ)가 이 인스턴스를 같이 쓰므로, 가득 찼을 때 키를 버리는 대신 쓰기를 거부해야
# 한다. 버리는 정책을 적으면 작업이 실패도 없이 사라진다.
maxmemory 128mb

# Persistence (AOF)
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Persistence (RDB) — AOF 로 충분하고, 포크 저장이 겹칠 이유가 없다.
save ""

# Logging
loglevel notice
