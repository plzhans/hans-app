# Network
timeout 300
tcp-keepalive 60

# Memory
# **한 호스트에 두 인스턴스가 뜬다.** 합이 호스트 여유 메모리를 넘지 않게 나눈다.
# 프로세스가 갈려 있어 한쪽이 채워도 다른 쪽 키가 밀려나지 않는다 — 접두사만으로는
# 못 막던 부분이 여기서 갈린다.
maxmemory 384mb
maxmemory-policy volatile-lru

# Persistence (AOF)
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Persistence (RDB) - disable for local
save ""

# Logging
loglevel notice
