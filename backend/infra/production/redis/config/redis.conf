# Network
timeout 300
tcp-keepalive 60

# Memory
maxmemory 512mb
maxmemory-policy volatile-lru

# Persistence (AOF)
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Persistence (RDB) - disable for local
save ""

# Logging
loglevel notice
