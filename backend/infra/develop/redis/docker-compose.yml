# Redis (develop 서버) — OCI ARM A1 · 2CPU · 12GB RAM.
#
# 이 폴더(redis/)는 self-contained 하다. 배포 시 이 폴더만 통째로 가져가면 된다.
# Redis 는 얹을 플러그인이 없어 커스텀 이미지가 불필요 → Dockerfile 없이 공식 이미지 직접 참조.
# 운영 튜닝은 redis.conf(마운트), 비밀번호는 .env(--requirepass) 로 분리.
#
# ── 실행 전 준비 ──────────────────────────────────────────────
#   1) 같은 폴더에 .env 생성:  REDIS_PASSWORD=<원하는 비밀번호>
#   2) (권장) 호스트 커널 파라미터 — 백그라운드 저장 시 fork 실패/경고 방지:
#        sudo sysctl -w vm.overcommit_memory=1
#        # 영구화: echo 'vm.overcommit_memory=1' | sudo tee /etc/sysctl.d/99-redis.conf
#   3) docker compose up -d
# ─────────────────────────────────────────────────────────────

# **환경마다 이름이 달라야 한다.** develop 과 production 이 같은 호스트에 뜨는데
# compose 프로젝트명과 컨테이너명이 겹치면 나중에 뜬 쪽이 앞의 것을 덮어쓴다.
name: hansapp-redis-develop

services:
  redis:
    image: redis:7.4-alpine
    container_name: hansapp-redis-develop
    restart: unless-stopped
    # conf 파일 + 비밀번호(플래그) 병합. 비밀값은 conf 에 안 남기고 여기서 .env 주입.
    # **설정 파일 경로를 반드시 첫 인자로 넘긴다.** redis-server 는 경로 인자가 없으면
    # 마운트된 파일을 무시하고 내장 기본값(maxmemory 무제한 · appendonly no)으로 뜬다.
    # 비밀번호만 넘기던 시절엔 conf 가 통째로 죽은 설정이었다.
    command:
      [
        'redis-server',
        '/usr/local/etc/redis/redis.conf',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD 를 .env 에 설정하세요}',
      ]
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      # AOF/RDB 영속화 — 컨테이너 재생성 때 데이터 유지.
      - ./data:/data
    # **바인드 주소를 하드코딩하지 않는다.** 서버의 사설 IP 는 인프라 사정으로 바뀌고,
    # 환경마다 다른 호스트로 옮겨갈 수도 있다. compose 는 인프라 형태만 정의하고
    # 실제 주소는 서버의 .env 가 정한다(REDIS_PASSWORD 와 같은 자리).
    #
    # 값은 **사설 NIC 주소**로 둔다(예: 10.0.0.101). VPN 에서 열람하려면 루프백으론
    # 부족하지만, 0.0.0.0 으로 열면 공인 경로까지 같이 열려 클라우드 방화벽에만 의존하게 된다.
    # 사설 NIC 면 VPN(라우팅)도 앱 컨테이너도 닿고 공인 경로만 닫힌다.
    #
    # 기본값이 127.0.0.1 인 이유: 미설정 시 **닫히는 쪽으로 실패**해야 한다.
    # 기본을 0.0.0.0 으로 두면 .env 를 빠뜨린 서버가 조용히 외부에 열린다.
    ports:
      - '${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379'
    healthcheck:
      # 컨테이너 내부 env(REDIS_PASSWORD)를 쓰기 위해 compose 보간을 피해 $$ 로 이스케이프.
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
