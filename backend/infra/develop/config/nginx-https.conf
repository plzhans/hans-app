# develop-api.plzhans.com 리버스 프록시
#
#   develop-api.plzhans.com  →  http://127.0.0.1:3000  (pm2: develop-hansapi-server)
#
# 인증서는 이 파일이 발급하지 않는다. acme.sh 로 따로 발급·갱신한다.
# 예) acme.sh 를 webroot 모드로 발급하려면 아래 .well-known 위치를 그대로 쓴다:
#
#   acme.sh --issue -d develop-api.plzhans.com -w /var/www/acme
#   acme.sh --install-cert -d develop-api.plzhans.com \
#     --key-file       /etc/nginx/ssl/develop-api.plzhans.com/key.pem \
#     --fullchain-file /etc/nginx/ssl/develop-api.plzhans.com/fullchain.pem \
#     --reloadcmd      "nginx -s reload"
#
# 배치: /etc/nginx/sites-available/develop-api.plzhans.com 로 두고
#       /etc/nginx/sites-enabled/ 에 심볼릭 링크. (또는 conf.d/ 에 직접 넣는다)
#       이 파일은 http {} 안으로 include 된다 — 아래 map 이 http 컨텍스트에 들어간다.

# 웹소켓 업그레이드용. Upgrade 헤더가 있으면 Connection: upgrade, 없으면 닫는다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTPS: 실제 리버스 프록시.
server {
    # http2 는 listen 파라미터로 붙인다. 별도 `http2 on;` directive 는 nginx 1.25.1+ 전용이라
    # 구버전에서 unknown directive 로 죽는다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name develop-api.plzhans.com;

    # acme.sh --install-cert 로 여기에 심는다 (위 install-cert 경로와 일치).
    ssl_certificate     /home/ubuntu/app/ssl/develop-api.plzhans.com/fullchain.pem;
    ssl_certificate_key /home/ubuntu/app/ssl/develop-api.plzhans.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 업로드 크기 여유 (필요에 맞게 조정)
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 웹소켓/업그레이드 대응
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
