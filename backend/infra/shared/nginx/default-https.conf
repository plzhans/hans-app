# 이름이 안 맞는 HTTPS 요청(포트 443)을 받는 기본 서버.
#
# default-http.conf 와 짝이다. 포트마다 default_server 가 따로라 80 을 막아도 443 은
# 그대로 열려 있다 — 두 파일을 다 링크해야 양쪽이 덮인다.
#
# ⚠️ **서버당 한 번만 링크한다.** 두 번 걸면 `a duplicate default server` 로 nginx 가
#    아예 안 뜬다. Ubuntu 의 /etc/nginx/sites-enabled/default 가 443 도 들고 있다면
#    그것을 먼저 치운다.
#
#   sudo ln -sf ~/app/hansapp-<환경>/nginx/default-https.conf /etc/nginx/sites-enabled/000-default-https.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── 인증서를 제시할지, 핸드셰이크를 거절할지 ─────────────────────────────────
#
# **HTTPS 기본 서버는 인증서 없이 페이지를 줄 수 없다.** TLS 핸드셰이크가 먼저이기 때문에,
# 페이지를 보여주려면 어떤 인증서든 내밀어야 한다.
#
# 이 파일은 **와일드카드 인증서를 내밀고 페이지를 준다.** 그래서 갈린다:
#
#   foo.plzhans.com (인증서에 들어가는 이름)  → 경고 없이 아래 페이지가 보인다
#   공인 IP · 남의 도메인                      → 브라우저가 이름 불일치 경고를 먼저 띄운다
#                                                (경고를 넘겨야 페이지가 보인다)
#
# 아직 설정 안 한 서브도메인으로 들어온 사람에게 이유를 보여주는 것이 목적이라면 이대로 둔다.
#
# 반대로 **아무것도 안 보여주고 싶으면** 아래 ssl_certificate 세 줄과 location 을 지우고
# 이 한 줄만 남긴다(nginx 1.19.4+):
#
#   ssl_reject_handshake on;
#
# 그러면 TLS 협상 자체를 거절한다. 우리 인증서가 아무 이름의 요청에나 제시되지 않는다는
# 것이 이쪽의 이점이다.
# ─────────────────────────────────────────────────────────────────────────────

server {
    # **http2 를 켜지 않는다.** 404 한 장을 주는 자리라 얻을 게 없고, 새 nginx 에서는
    # `listen ... http2` 가 deprecated 경고를 찍는다(환경별 conf 는 실제 프록시라 켜 둔다).
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # 환경별 conf 와 같은 경로를 쓴다. **인증서를 옮기면 여기도 같이 고쳐야 한다.**
    ssl_certificate     /home/ubuntu/app/ssl/plzhans.com/fullchain.pem;
    ssl_certificate_key /home/ubuntu/app/ssl/plzhans.com/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 우리가 서비스하지 않는 이름이라 본문을 받을 이유가 없다. 큰 요청은 읽지도 않고 끊는다.
    client_max_body_size 1m;

    # HTTP 쪽과 같은 이유로 404 다(default-http.conf 주석 참고).
    location / {
        default_type text/html;
        # 작은따옴표 안이라 $ 는 nginx 변수가 된다 — 본문에 $ 와 ' 를 쓰지 않는다.
        return 404 '<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>설정되지 않은 주소</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f7f7f8;color:#3f3f46;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{max-width:30rem;padding:2rem;text-align:center}
  h1{margin:0 0 .5rem;font-size:1.25rem;color:#18181b}
  p{margin:0;color:#71717a;font-size:.9375rem}
</style>
<main>
  <h1>설정되지 않은 주소입니다</h1>
  <p>이 서버에 등록되지 않은 이름으로 접속했습니다.</p>
</main>
</html>
';
    }
}
