# 이름이 안 맞는 HTTP 요청(포트 80)을 받는 기본 서버.
#
# **없으면 첫 번째 server 블록이 기본이 된다.** 공인 IP 로 직접 때리거나 아무 호스트명으로
# 와도 관리자 콘솔이 응답한다 — 스캐너에게 무엇이 떠 있는지 알려주는 셈이다.
#
# **환경에 안 묶여서 shared 에 있다.** default_server 는 포트마다 하나뿐이라 develop 과
# production 이 한 서버에 떠 있어도 이 파일 하나면 된다.
#
# ⚠️ **서버당 한 번만 링크한다.** 두 번 걸면 `a duplicate default server` 로 nginx 가
#    아예 안 뜬다. Ubuntu 는 /etc/nginx/sites-enabled/default 가 이미 그것을 들고 있으므로
#    **그것을 먼저 치워야 한다.**
#
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo ln -sf ~/app/hansapp-<환경>/nginx/default-http.conf /etc/nginx/sites-enabled/000-default-http.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 이름을 000- 으로 시작하는 것은 읽는 사람을 위한 것이다(sites-enabled 는 알파벳 순으로
# include 된다). nginx 는 순서와 무관하게 default_server 를 찾는다.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ── ACME(HTTP-01) 를 쓴다면 이 블록을 살린다 ────────────────────────────
    #
    # 새 도메인의 인증서를 처음 받을 때, 그 도메인의 server 블록은 아직 없어서 챌린지가
    # **이 기본 서버로 떨어진다.** 아래가 없으면 404 를 돌려주고 발급이 실패한다.
    # (DNS-01 로 받는다면 필요 없다.)
    # ────────────────────────────────────────────────────────────────────────
    # location /.well-known/acme-challenge/ {
    #     root /var/www/html;
    # }

    # HTTPS 로 넘기지 않는다. 우리가 서비스하지 않는 이름이라 넘겨 봐야 갈 곳이 없다.
    #
    # **404 로 답한다.** 200 은 "이 호스트는 정상이다" 라는 뜻이 되어 검색엔진이 이 자리를
    # 실제 페이지로 색인한다. 200 이 필요하면 아래 숫자만 바꾼다.
    #
    # 아무 응답도 주고 싶지 않으면 대신 `return 444;` 를 쓴다 — nginx 전용으로,
    # 응답 없이 연결을 끊어 스캐너에게 서버가 있다는 것조차 알리지 않는다.
    # 지금은 사람이 잘못 들어왔을 때 흰 화면 대신 이유가 보이는 쪽을 택했다.
    location / {
        default_type text/html;
        # 작은따옴표 안이라 $ 는 nginx 변수가 된다 — 본문에 $ 와 ' 를 쓰지 않는다.
        return 404 '<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>설정되지 않은 주소</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f7f7f8;color:#3f3f46;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{max-width:30rem;padding:2rem;text-align:center}
  h1{margin:0 0 .5rem;font-size:1.25rem;color:#18181b}
  p{margin:0;color:#71717a;font-size:.9375rem}
</style>
<main>
  <h1>설정되지 않은 주소입니다</h1>
  <p>이 서버에 등록되지 않은 이름으로 접속했습니다.</p>
</main>
</html>
';
    }
}
