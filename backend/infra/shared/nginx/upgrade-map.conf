# 웹소켓 업그레이드용. Upgrade 헤더가 있으면 Connection: upgrade, 없으면 닫는다.
#
# **환경에 안 묶여서 shared 에 있다.** develop·production 이 쓸 내용이 똑같아서, 환경마다
# 한 벌씩 두면 한쪽만 고치는 날이 오고 그 차이가 서버에서만 드러난다.
#
# ⚠️ **서버당 한 번만 링크한다.** 두 환경이 한 서버에 떠 있어도 하나로 족하다 —
# `map` 은 http 컨텍스트의 **변수 선언**이라 두 번 걸면
# `duplicate "$connection_upgrade" variable` 로 nginx 가 아예 안 뜬다.
# (server 블록 안으로 옮기는 것으로도 안 풀린다. map 은 http 전용이다.)
#
#   sudo ln -sf ~/app/hansapp-<환경>/nginx/upgrade-map.conf /etc/nginx/conf.d/upgrade-map.conf
#
# conf.d/ 에 두는 이유는 sites-enabled/ 보다 먼저 include 되어, 이 변수를 쓰는 사이트
# 설정보다 앞서 선언되기 때문이다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
