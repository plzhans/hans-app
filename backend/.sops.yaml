creation_rules:
  # 로컬 배포 설정(local-deploy-<환경>.env): 개인키만.
  # local-deploy.sh 가 이 사람 머신에서만 읽는다 — 서버는 안 읽으므로 서버키가 필요없다.
  - path_regex: ^local-deploy-.*\.env$
    age: age1hay0wsyqfzuh72h0yvwn64lpxrcpyxsz005lvu08jpwez9v8hvfsh92s26

  # develop 평면 env(config/.env.develop*): 개인키 + develop 서버키.
  # env 파일은 config/ 바로 밑에 평면으로 두므로 파일명으로 키를 고른다(디렉터리 아님).
  - path_regex: ^config/\.env\.develop
    age: >-
      age1zg5n5zp069lamnw2kxk3nw58h4l68tp9wx9tld962sq6gg9en58spmmm54,
      age1hay0wsyqfzuh72h0yvwn64lpxrcpyxsz005lvu08jpwez9v8hvfsh92s26

  # production 평면 env(config/.env.production*): 개인키 + production 서버키.
  - path_regex: ^config/\.env\.production
    age: >-
      age1zg5n5zp069lamnw2kxk3nw58h4l68tp9wx9tld962sq6gg9en58spmmm54,
      age1hay0wsyqfzuh72h0yvwn64lpxrcpyxsz005lvu08jpwez9v8hvfsh92s26

  # develop 에셋 디렉터리(config/develop/ : jwt 키 등): 개인키 + develop 서버키.
  - path_regex: ^config/develop/.*$
    age: >-
      age1zg5n5zp069lamnw2kxk3nw58h4l68tp9wx9tld962sq6gg9en58spmmm54,
      age1hay0wsyqfzuh72h0yvwn64lpxrcpyxsz005lvu08jpwez9v8hvfsh92s26

  # production 에셋 디렉터리(config/production/): 개인키 + production 서버키.
  - path_regex: ^config/production/.*$
    age: >-
      age1zg5n5zp069lamnw2kxk3nw58h4l68tp9wx9tld962sq6gg9en58spmmm54,
      age1hay0wsyqfzuh72h0yvwn64lpxrcpyxsz005lvu08jpwez9v8hvfsh92s26

  # config 아래의 나머지(공통 .env, local 환경 .env.local, config/local/ 등): 개인키만.
  - path_regex: ^config/.*$
    age: age1hay0wsyqfzuh72h0yvwn64lpxrcpyxsz005lvu08jpwez9v8hvfsh92s26

  # ── infra/<환경>/.env.<서비스> ────────────────────────────────────────────────
  # compose 옆에 두는 **서비스별 env**(지금은 .env.redis 하나). 시크릿이 config/ 밖에
  # 나가는 유일한 자리로, 배포가 compose·redis.conf 와 한 덩어리로 나르는 것들이다.
  #
  # **`.env` 로 시작하는 파일만 잡는다.** 이 디렉터리에는 커밋되는 평문(docker-compose.yml ·
  # redis.conf)이 같이 있어, 넓게 걸면 그것들까지 대상으로 오해하기 쉽다.
  - path_regex: ^infra/develop/\.env
    age: >-
      age1zg5n5zp069lamnw2kxk3nw58h4l68tp9wx9tld962sq6gg9en58spmmm54,
      age1hay0wsyqfzuh72h0yvwn64lpxrcpyxsz005lvu08jpwez9v8hvfsh92s26

  - path_regex: ^infra/production/\.env
    age: >-
      age1zg5n5zp069lamnw2kxk3nw58h4l68tp9wx9tld962sq6gg9en58spmmm54,
      age1hay0wsyqfzuh72h0yvwn64lpxrcpyxsz005lvu08jpwez9v8hvfsh92s26
