name: frontend deploy hansapi-docs

# 문서 사이트를 GitHub Pages 에 배포한다.
# 이 워크플로우도 **배포 방법을 모른다.** scripts/ci/deploy-docs.sh 를 호출만 한다.
#
#   production 브랜치 → production 환경 → docs.plzhans.com/
#   main 브랜치       → develop 환경    → docs.plzhans.com/develop/
#
# 두 환경이 같은 Pages 사이트를 나눠 쓴다. 각 배포는 자기 경로만 교체하므로
# 한쪽을 배포해도 다른 쪽이 지워지지 않는다(deploy-docs.sh 참고).
#
# hans-api 가 private 이라 여기에 Pages 를 붙일 수 없다(Free 플랜 제약).
# 그래서 빌드된 정적 사이트만 public 문서 레포로 밀고, Pages 는 그쪽에 붙어 있다.

on:
  push:
    branches: [main, production]
    paths:
      - 'frontend/hansapi-docs/**'
      - 'docs/openapi/**'
      - 'scripts/ci/build-frontend.sh'
      - 'scripts/ci/deploy-docs.sh'
      - '.github/workflows/fe-deploy-hansapi-docs.yml'
  # 손으로 돌릴 때만 환경을 고를 수 있다. **자동 배포(push)는 여전히 브랜치가 환경을 정한다.**
  #
  # 열어둔 이유는 하나다 — production 브랜치가 생기기 전까지 루트가 비어 있거나 낡은 채로
  # 남는데, 그동안 main 의 문서를 임시로 루트에 올려둘 방법이 필요하다.
  #
  # 대신 이 문은 손으로만 열린다. push 트리거까지 환경을 고를 수 있게 하면
  # "운영 문서가 어느 브랜치에서 나왔는지" 를 아무도 확신할 수 없게 된다.
  # (배포 커밋 메시지에 hans-api@<sha> 가 남으므로, 임시로 올려도 출처는 추적된다)
  workflow_dispatch:
    inputs:
      environment:
        description: '배포할 환경 (auto = 브랜치에 따름)'
        type: choice
        options: [auto, develop, production]
        default: auto
      force:
        description: '내용이 같아도 강제로 배포한다 (gh-pages 를 손으로 건드려 망가뜨렸을 때)'
        type: boolean
        default: false

# 같은 브랜치의 배포가 겹치면 나중 것만 살린다. 앞의 것이 뒤엣것을 덮어쓰면 안 된다.
concurrency:
  group: fe-deploy-hansapi-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/plzhans/hans-api/node-builder:node24

    # 기본은 브랜치가 곧 환경이다. 수동 실행에서 명시하면 그게 이긴다.
    # Variables(OPENAPI_SERVERS, DOCS_PATH)는 이 environment 에 걸려 있다.
    environment: ${{ (inputs.environment != null && inputs.environment != 'auto') && inputs.environment || (github.ref_name == 'production' && 'production' || 'develop') }}

    # 설정은 전부 GitHub Variables 다. 레포 이름·도메인·배포 경로가 바뀌어도 코드를 고치지 않는다.
    env:
      APP_ENV: ${{ (inputs.environment != null && inputs.environment != 'auto') && inputs.environment || (github.ref_name == 'production' && 'production' || 'develop') }}
      # 내용이 같아도 배포한다. deploy-docs.sh 가 이 값을 본다.
      DOCS_FORCE: ${{ inputs.force }}

      # --- 레포 레벨 (환경 무관) ---
      # 브랜치(gh-pages)는 변수가 아니다. 문서 전용 레포의 문서 전용 브랜치라 바뀔 일이 없어
      # deploy-docs.sh 에 박혀 있다.
      DOCS_REPO: ${{ vars.DOCS_REPO }}
      DOCS_DOMAIN: ${{ vars.DOCS_DOMAIN }}

      # --- 환경 레벨 ---
      # production 이 아닌 환경이 사이트의 어느 경로를 차지하는지. 예: /develop
      # production 은 항상 루트이고 코드로 고정돼 있어 이 변수를 쓰지 않는다.
      # 환경을 늘리려면(예: /staging) Environment 를 만들고 이 값만 넣으면 된다.
      DOCS_PATH: ${{ vars.DOCS_PATH }}
      # 스펙의 servers 를 환경에 맞게 갈아끼운다. 형식: "url|설명;url2|설명2"
      # 이게 비면 커밋된 스펙(개발 기준)의 servers 가 그대로 나간다 — 스크립트가 경고한다.
      OPENAPI_SERVERS: ${{ vars.OPENAPI_SERVERS }}

      # 문서 레포에만 쓰기 권한이 있는 배포 키. GITHUB_TOKEN 은 다른 레포에 못 쓴다.
      DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-docs-${{ hashFiles('frontend/hansapi-docs/pnpm-lock.yaml') }}
          restore-keys: pnpm-docs-

      - run: ./scripts/ci/deploy-docs.sh "$APP_ENV"
