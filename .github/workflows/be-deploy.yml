# backend 를 서버에 반영한다. **이미지를 굽지 않는다.**
#
# 굽는 것은 be-image.yml 이다. 여기는 이미 레지스트리에 있는 태그를 서버가 당기게 할 뿐이라,
# 롤백이 재빌드 없이 태그 지정만으로 끝난다.
#
# **이 파일에는 배포 로직이 없다.** 환경변수를 선언하고 backend/ci-deploy.sh 를 부르는 게
# 전부다. 로컬에서 같은 배포를 돌리려면 backend/deploy.sh 를 쓴다 — 같은 스크립트를 지나간다.
name: be · deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '배포 환경'
        type: choice
        options: [develop, production]
        default: develop
      skip_migrate:
        description: '마이그레이션 건너뛰기 (이미 돌렸거나 스키마 변경이 없을 때)'
        type: boolean
        default: false
      image_tag:
        # **기본값을 채워 둔다.** 폼을 열면 'develop' 이 이미 들어가 있어 그냥 Run 만
        # 누르면 develop 최신이 나간다. 오랜만에 와서 "뭘 적어야 하지" 로 막히지 않게.
        #
        # production 은 이 값을 지우고 버전을 적는다. 그쪽은 무엇을 올리는지 명시하는 편이
        # 맞다 — 기본값으로 올라가면 무엇이 떠 있는지 아무도 답할 수 없게 된다.
        description: '띄울 이미지 태그 — develop | v0.5.0 | develop-<sha>'
        type: string
        default: develop
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      skip_migrate:
        type: boolean
        default: false

# **동시 실행을 반드시 막는다.**
#
# WireGuard 피어는 같은 키로 두 곳에서 붙을 수 없다. 두 배포가 겹치면 먼저 붙은 쪽의
# 연결이 끊겨 **배포가 반쯤 진행된 채로 죽는다** — compose 는 갱신됐는데 up 은 안 된
# 상태가 남을 수 있다.
#
# 환경으로 그룹을 나누지 않는다. develop 과 production 이 같은 피어를 쓰기 때문이다.
# cancel-in-progress 도 쓰지 않는다 — 진행 중인 배포를 중간에 끊는 것이 더 나쁘다.
concurrency:
  # **환경별로 나눈다.** WireGuard 피어가 환경마다 갈리면 develop 배포가 production 을
  # 막지 않는다. 같은 환경 안에서는 여전히 하나씩 도는데, 마이그레이션과 배포가 겹치면
  # 안 되므로 그게 맞는 동작이다.
  group: be-server-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 스키마를 먼저 반영한다. **실패하면 배포하지 않는다.**
  #
  # 옛 스키마 위에 새 코드를 올리면 서버가 뜨지도 못한다. 반쯤 간 상태를 만들 이유가
  # 없으므로 여기서 멈춘다. migrate deploy 는 적용할 게 없으면 통과하므로(멱등)
  # 스키마 변경이 없는 배포에서도 그냥 지나간다.
  # ───────────────────────────────────────────────────────────────────────────
  migrate:
    if: ${{ !inputs.skip_migrate }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    container:
      image: ghcr.io/${{ github.repository }}/node-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add NET_ADMIN --device /dev/net/tun
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: 마이그레이션
        run: ./backend/ci-migrate.sh
        env:
          APP_ENV: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          BE_HANSAPP_DEPLOY_SSH_HOST: ${{ vars.BE_HANSAPP_DEPLOY_SSH_HOST }}
          BE_HANSAPP_DEPLOY_PATH: ${{ vars.BE_HANSAPP_DEPLOY_PATH }}
          BE_HANSAPP_DEPLOY_SSH_KEY_FILE: ${{ secrets.BE_HANSAPP_DEPLOY_SSH_KEY_FILE }}
          BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ vars.BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE }}
          BE_WIREGUARD_PEER_CONF_FILE: ${{ secrets.BE_WIREGUARD_PEER_CONF_FILE }}
          AGE_SECRET_KEY_FILE: ${{ secrets.AGE_SECRET_KEY_FILE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

  deploy:
    needs: migrate
    # migrate 를 건너뛰었으면 needs 가 skipped 라 기본 조건으로는 deploy 도 안 돈다.
    # always() 로 그 사슬을 끊고, 실패했을 때만 멈춘다.
    if: ${{ always() && needs.migrate.result != 'failure' && needs.migrate.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    # wg-quick 은 커널 모듈이 있든(NET_ADMIN) 없든(TUN) 둘 다 필요하다.
    # node-builder 이미지에 wireguard-tools·wireguard-go·openssh-client 가 들어 있고,
    # WG_QUICK_USERSPACE_IMPLEMENTATION=wireguard-go 가 기본값이라 커널 모듈이 없어도 붙는다.
    container:
      image: ghcr.io/${{ github.repository }}/node-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add NET_ADMIN --device /dev/net/tun

    permissions:
      contents: read
      packages: read # node-builder 이미지를 GHCR 에서 받는다

    steps:
      - uses: actions/checkout@v4

      # ▼ 여기가 이 워크플로가 하는 일의 전부다 — 변수를 선언하고 스크립트를 부른다.
      - name: 배포
        run: ./backend/ci-deploy.sh
        env:
          APP_ENV: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          # 서버 접속 정보. 주소·경로는 비밀이 아니라 Variable 이다.
          BE_HANSAPP_DEPLOY_SSH_HOST: ${{ vars.BE_HANSAPP_DEPLOY_SSH_HOST }}
          BE_HANSAPP_DEPLOY_PATH: ${{ vars.BE_HANSAPP_DEPLOY_PATH }}
          BE_HANSAPP_DEPLOY_SSH_KEY_FILE: ${{ secrets.BE_HANSAPP_DEPLOY_SSH_KEY_FILE }}
          BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ vars.BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE }}
          # **로컬에는 없고 CI 에만 있는 값이다.** 로컬은 VPN 이 이미 붙어 있어서
          # backend/deploy.sh 가 이 변수를 비운다. ci-deploy.sh 는 비어 있으면 연결을
          # 건드리지 않으므로, 스크립트가 자기가 어디서 도는지 몰라도 된다.
          BE_WIREGUARD_PEER_CONF_FILE: ${{ secrets.BE_WIREGUARD_PEER_CONF_FILE }}
          # 시크릿 복호화용. 로컬은 개발자 키가 기본 경로에 있어 비우지만, CI 는 매번
          # 새 러너라 여기서 받아야 한다. node-builder 이미지에 sops 가 들어 있다.
          AGE_SECRET_KEY_FILE: ${{ secrets.AGE_SECRET_KEY_FILE }}
          # 서버가 private 이미지를 받으려면 GHCR 인증이 필요하다. **잡이 끝나면 만료되는
          # 임시 토큰**이라 서버에 영구 자격증명을 심지 않아도 된다 — ci-deploy.sh 가
          # 배포 직전에 로그인하고 끝나면 지운다.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
