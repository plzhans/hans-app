# develop 서버에 배포한다. **환경이 고정이라 고를 수 없다.**
#
# 환경을 드롭다운으로 두면 잘못 골랐을 때 운영이 나간다. 진입점을 갈라 두면 그 실수가
# 성립하지 않는다 — Actions 목록에서 이름만 보고 누르면 된다.
#
# 로직은 be-deploy.yml 이 갖는다. 여기는 "develop 이다" 만 말한다.
name: be · deploy → develop

on:
  workflow_dispatch:
    inputs:
      image_tag:
        # 비워 두면 develop(그 환경의 최신). 릴리스 후보를 미리 확인할 때만 v0.6.2 처럼 적는다.
        description: '띄울 이미지 태그'
        type: string
        default: develop
        required: true
      skip_migrate:
        description: '마이그레이션 건너뛰기 (스키마 변경이 없는 게 확실할 때)'
        type: boolean
        default: false

jobs:
  deploy:
    uses: ./.github/workflows/be-deploy.yml
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      environment: develop
      image_tag: ${{ inputs.image_tag }}
      skip_migrate: ${{ inputs.skip_migrate }}
