# develop 서버에 배포한다. **환경이 파일에 박혀 있어 고를 수 없다.**
#
# production 과 진입점을 나눈 이유는 실수를 설계로 막기 위해서다. 하나의 폼에서 드롭다운으로
# 갈리면 잘못 고른 순간 운영이 나가는데, 그것을 주의로 막을 수는 없다.
#
# [무엇을 배포할지는 ref 가 정한다]
#
#   Use workflow from:  main                      ← 최신 develop 이미지 (평소)
#                       staging                    ← 릴리스 후보를 미리 확인
#                       release-backend/v0.7.2     ← 특정 버전
#
# **입력칸이 없다.** 고른 ref 가 곧 대상이다 — 브랜치면 그 환경의 움직이는 태그(develop),
# 릴리스 태그면 그 커밋의 manifest 가 가진 버전을 쓴다.
#
# production 과 다른 점은 **브랜치를 허용한다**는 것뿐이다. develop 은 main 최신을 굴리는
# 것이 주 용도이므로 태그로만 제한하면 오히려 불편하다.
#
# [이 파일에는 배포 로직이 없다]
# 환경변수를 선언하고 scripts/deploy/ci-*.sh 를 부르는 게 전부다. production 파일과 겹치는
# 부분이 있지만 그건 껍데기고, 실제 절차는 스크립트 한 벌이 갖는다.
name: be - deploy - develop

on:
  workflow_dispatch:
    inputs:
      skip_migrate:
        description: '마이그레이션 건너뛰기 (스키마 변경이 없는 게 확실할 때)'
        type: boolean
        default: false
  # be.yml 이 #deploy 커밋에서 부른다.
  workflow_call:
    inputs:
      skip_migrate:
        type: boolean
        default: false


# **동시 실행을 막는다.**
#
# WireGuard 피어는 같은 키로 두 곳에서 붙을 수 없다. 두 배포가 겹치면 먼저 붙은 쪽의
# 연결이 끊겨 배포가 반쯤 진행된 채로 죽는다 — compose 는 갱신됐는데 up 은 안 된 상태가
# 남을 수 있다. cancel-in-progress 도 쓰지 않는다. 진행 중인 배포를 끊는 쪽이 더 나쁘다.
#
# 마이그레이션과 배포가 같은 그룹을 쓴다. 같은 환경에서 둘이 겹치면 안 되기 때문이다.
concurrency:
  group: be-server-develop
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 고른 ref 가 무엇을 뜻하는지 확정한다.
  #
  #   브랜치      develop      그 환경의 최신. 평소 배포
  #   릴리스 태그  v0.7.2       그 커밋의 manifest 가 답을 갖고 있다
  #
  # 릴리스 후보를 develop 에 먼저 올려보는 것이 검증의 요점이라 태그도 받는다 —
  # 같은 이미지가 develop 설정을 입고 뜨므로, 여기서 정상이면 production 도 정상이다.
  # ───────────────────────────────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        name: 배포 대상 확정
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              # 릴리스 태그. 그 커밋의 manifest 가 버전을 갖고 있다.
              semver="$(jq -r '.backend' .release-please-manifest.json)"
              [ -n "$semver" ] && [ "$semver" != 'null' ] \
                || { echo '❌ manifest 에서 backend 버전을 못 읽었다.' >&2; exit 1; }
              version="v$semver"
              ;;
            *)
              # 브랜치. develop 은 움직이는 태그라 늘 최신을 가리킨다.
              version='develop'
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "  $GITHUB_REF_NAME → $version"

  # ───────────────────────────────────────────────────────────────────────────
  # 스키마를 먼저 반영한다. **실패하면 배포하지 않는다.**
  #
  # 옛 스키마 위에 새 코드를 올리면 서버가 뜨지도 못한다. 반쯤 간 상태를 만들 이유가
  # 없으므로 여기서 멈춘다. migrate deploy 는 적용할 게 없으면 통과하므로(멱등)
  # 스키마 변경이 없는 배포에서도 그냥 지나간다.
  #
  # 필요한 것(compose·env)은 스스로 올린다. 배포가 날라 주기를 기다리면 첫 배포에서
  # 순서가 꼬인다 — 마이그레이션이 먼저 도는데 그 파일을 만드는 것이 배포이기 때문이다.
  # ───────────────────────────────────────────────────────────────────────────
  migrate:
    needs: plan
    if: ${{ !inputs.skip_migrate }}
    runs-on: ubuntu-latest
    environment: develop
    container:
      image: ghcr.io/${{ github.repository }}/node-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # wg-quick 은 커널 모듈이 있든(NET_ADMIN) 없든(TUN) 둘 다 필요하다.
      options: --cap-add NET_ADMIN --device /dev/net/tun
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: 마이그레이션
        run: ./scripts/deploy/ci-migrate.sh
        env:
          APP_ENV: develop
          IMAGE_TAG: ${{ needs.plan.outputs.version }}
          BE_HANSAPP_DEPLOY_SSH_HOST: ${{ vars.BE_HANSAPP_DEPLOY_SSH_HOST }}
          BE_HANSAPP_DEPLOY_PATH: ${{ vars.BE_HANSAPP_DEPLOY_PATH }}
          BE_HANSAPP_DEPLOY_SSH_KEY_FILE: ${{ secrets.BE_HANSAPP_DEPLOY_SSH_KEY_FILE }}
          BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ vars.BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE }}
          BE_WIREGUARD_PEER_CONF_FILE: ${{ secrets.BE_WIREGUARD_PEER_CONF_FILE }}
          AGE_SECRET_KEY_FILE: ${{ secrets.AGE_SECRET_KEY_FILE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

  deploy:
    needs: [plan, migrate]
    # migrate 를 건너뛰었으면 needs 가 skipped 라 기본 조건으로는 deploy 도 안 돈다.
    # always() 로 그 사슬을 끊고, 실패했을 때만 멈춘다.
    if: ${{ always() && needs.plan.result == 'success'
          && needs.migrate.result != 'failure' && needs.migrate.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment: develop
    container:
      image: ghcr.io/${{ github.repository }}/node-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add NET_ADMIN --device /dev/net/tun
    permissions:
      contents: read
      packages: read # node-builder 이미지를 GHCR 에서 받는다
    steps:
      - uses: actions/checkout@v4
      - name: 배포
        run: ./scripts/deploy/ci-deploy.sh
        env:
          APP_ENV: develop
          IMAGE_TAG: ${{ needs.plan.outputs.version }}
          BE_HANSAPP_DEPLOY_SSH_HOST: ${{ vars.BE_HANSAPP_DEPLOY_SSH_HOST }}
          BE_HANSAPP_DEPLOY_PATH: ${{ vars.BE_HANSAPP_DEPLOY_PATH }}
          BE_HANSAPP_DEPLOY_SSH_KEY_FILE: ${{ secrets.BE_HANSAPP_DEPLOY_SSH_KEY_FILE }}
          BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ vars.BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE }}
          BE_WIREGUARD_PEER_CONF_FILE: ${{ secrets.BE_WIREGUARD_PEER_CONF_FILE }}
          AGE_SECRET_KEY_FILE: ${{ secrets.AGE_SECRET_KEY_FILE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
