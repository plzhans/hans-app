# backend 를 develop 서버에 배포한다. **이미지를 굽지 않는다.**
#
#   workflow_call      main.yml 이 이미지를 구운 뒤 부른다
#   workflow_dispatch  단독 실행 — 서버에 이미 있는 :develop 을 새 설정으로 재기동
#
# **어디서 부르든 같은 동작이다.** develop 은 움직이는 태그(:develop) 하나만 쓰기 때문에
# "방금 구운 것" 과 "서버가 이미 가진 것" 이 같은 이름이다. 그래서 단독 실행이 곧
# **설정만 배포**가 된다 — 설정은 이미지에 안 들어가고 compose 가 마운트하기 때문이다.
#
# [단계]
#   wireguard      터널을 올린다. 인프라지 배포 절차가 아니다
#   ssh-connect    키·known_hosts → ssh_config 한 장. 이후 전부 -F 로 그것만 본다
#   config-bundle  sops 복호화 → 번들. **서버를 건드리지 않는다**
#   config-upload  번들 전송 · 원자적 교체 · .env 생성
#   image-pull     서버가 GHCR 에서 당긴다. 앱은 아직 살아 있다
#   app-stop   ┐
#   db-migrate │  다운타임 — 옛 코드가 새 스키마 위에서 도는 창을 없앤다
#   app-start  ┘  **실패해도 띄운다.** 공용 서버를 내려간 채로 두지 않는다
#   cleanup        평문·키 삭제, 터널 해제
#
# **이 파일에는 배포 로직이 없다.** 환경변수를 선언하고 scripts/deploy/stage/*.sh 를
# 순서대로 부르는 게 전부다. 로컬에서 같은 배포를 돌리려면 scripts/deploy/deploy-develop.sh
# 를 쓴다 — 같은 스크립트를 같은 순서로 지나간다.
#
# [잡을 쪼개지 않는 이유]
# 단계마다 잡을 나누면 WireGuard 를 매번 다시 붙어야 하고(핸드셰이크 15초 + 컨테이너 pull),
# 무엇보다 **복호화된 시크릿을 잡 사이로 넘길 방법이 없다** — 아티팩트는 레포 읽기 권한만
# 있으면 받아진다. 그래서 한 잡 안에서 스텝으로 나누고, 각 스크립트가 ::group:: 을 연다.
name: be - deploy - develop

on:
  workflow_call:
    inputs:
      skip_migrate:
        description: '스키마 반영을 건너뛴다'
        type: boolean
        default: false
      config_only:
        description: '설정만 배포한다 (이미지·스키마 건너뜀)'
        type: boolean
        default: false
      slack_thread:
        description: '배포 스레드의 ts. 비면 알림이 조용히 넘어간다'
        type: string
        default: ''
      slack_channel:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      skip_migrate:
        description: '스키마 반영을 건너뛴다'
        type: boolean
        default: true
      config_only:
        description: '설정만 배포한다 (이미지·스키마 건너뜀)'
        type: boolean
        default: true

# **동시 실행을 막는다.**
#
# WireGuard 피어는 같은 키로 두 곳에서 붙을 수 없다. 두 배포가 겹치면 먼저 붙은 쪽의
# 연결이 끊겨 배포가 반쯤 진행된 채로 죽는다. cancel-in-progress 도 쓰지 않는다 —
# 진행 중인 배포를 끊는 쪽이 더 나쁘다.
concurrency:
  group: be-server-develop
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # **관문.** 하는 일이 없다 — 존재하는 것이 일이다.
  #
  # environment 의 보호 규칙(승인자)이 여기 걸린다. 이 잡이 통과해야 아래가 돈다.
  #
  # **아래 deploy 잡에 걸지 않는 이유.** 잡은 environment 를 하나만 가질 수 있는데,
  # deploy 는 SSH 키·age 키가 있는 `develop` 을 써야 한다. 관문을 거기 걸면 시크릿을
  # `develop-deploy` 로 복제해야 하고, 그러면 두 벌이 어긋날 자리가 생긴다.
  #
  # 시크릿이 없는 빈 환경을 따로 두면 관문만 옮겨진다. main.yml 도 같은 이름을 쓰므로,
  # 거기서 승인하면 이 잡은 이미 승인된 상태로 통과한다 — **클릭은 한 번이다.**
  gate:
    runs-on: ubuntu-latest
    environment: develop-deploy
    steps:
      - run: echo "승인됨 — develop 서버에 반영한다"

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    # 시크릿이 여기 있다. 관문은 위 잡이 이미 지났다.
    environment: develop
    permissions:
      contents: read
      packages: read # node-builder 이미지를 GHCR 에서 받는다
    container:
      image: ghcr.io/${{ github.repository }}/node-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # wg-quick 은 커널 모듈이 있든(NET_ADMIN) 없든(TUN) 둘 다 필요하다.
      options: --cap-add NET_ADMIN --device /dev/net/tun

    # 모든 스텝이 같은 값을 본다. 로컬은 scripts/deploy/deploy-develop.sh 가 **같은
    # 이름으로** 채운다 — 그래서 스크립트는 자기가 어디서 도는지 몰라도 된다.
    env:
      APP_ENV: develop
      # develop 은 움직이는 태그 하나만 쓴다. 무엇이 떠 있는지는 태그가 아니라 앱이
      # 답한다(dist/build-info.json 의 sha).
      IMAGE_TAG: develop
      BE_HANSAPP_DEPLOY_SSH_HOST: ${{ vars.BE_HANSAPP_DEPLOY_SSH_HOST }}
      BE_HANSAPP_DEPLOY_PATH: ${{ vars.BE_HANSAPP_DEPLOY_PATH }}
      BE_HANSAPP_DEPLOY_SSH_KEY_FILE: ${{ secrets.BE_HANSAPP_DEPLOY_SSH_KEY_FILE }}
      BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ vars.BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE }}
      BE_WIREGUARD_PEER_CONF_FILE: ${{ secrets.BE_WIREGUARD_PEER_CONF_FILE }}
      AGE_SECRET_KEY_FILE: ${{ secrets.AGE_SECRET_KEY_FILE }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}
      # 실패한 단계가 스스로 스레드에 남긴다. 비어 있으면 조용히 넘어간다.
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL: ${{ inputs.slack_channel }}
      SLACK_DEPLOY_THREAD_TIMESTAMP: ${{ inputs.slack_thread }}

    steps:
      - uses: actions/checkout@v7

      # ── 인프라 ────────────────────────────────────────────────────────────
      - name: wireguard
        run: ./scripts/deploy/wireguard.sh up

      # ── 준비 ──────────────────────────────────────────────────────────────
      - name: ssh-connect
        run: ./scripts/deploy/stage/ssh-connect.sh

      - name: config-bundle
        run: ./scripts/deploy/stage/config-bundle.sh

      # ── 배포 ──────────────────────────────────────────────────────────────
      - name: config-upload
        id: upload
        run: ./scripts/deploy/stage/config-upload.sh

      # 앱이 아직 살아 있는 동안 받는다. 다운타임이 전송 시간만큼 짧아진다.
      - name: docker-image-pull
        if: ${{ !inputs.config_only }}
        run: ./scripts/deploy/stage/docker-image-pull.sh

      - name: app-stop
        if: ${{ !inputs.config_only }}
        run: ./scripts/deploy/stage/app-stop.sh

      # **실패해도 계속 간다.** 여기서 멈추면 앱이 내려간 채로 남는다 — 아래 app-start 가
      # 반드시 돌아야 하므로 실패를 기록만 하고 넘어간다. 판정은 마지막 스텝이 한다.
      - name: db-migrate
        id: migrate
        if: ${{ !inputs.config_only && !inputs.skip_migrate }}
        continue-on-error: true
        run: ./scripts/deploy/stage/db-migrate.sh

      # **config-upload 가 됐으면 무조건 띄운다.** develop 은 공용 서버라 내려간 채로
      # 두면 다른 사람들이 전부 막힌다. 마이그레이션이 깨졌어도 일단 살려 둔다.
      - name: app-start
        if: ${{ always() && steps.upload.outcome == 'success' }}
        run: ./scripts/deploy/stage/app-start.sh

      # ── 정리 ──────────────────────────────────────────────────────────────
      # 앞이 어떻게 끝났든 평문과 키는 지워야 한다.
      - name: cleanup
        if: always()
        run: ./scripts/deploy/stage/secret-cleanup.sh

      - name: wireguard down
        if: always()
        run: ./scripts/deploy/wireguard.sh down

      # 마이그레이션을 continue-on-error 로 넘겼으므로 **여기서 잡을 실패시킨다.**
      # 안 그러면 스키마가 안 맞는데 초록으로 끝난다.
      - name: 마이그레이션 결과 판정
        if: ${{ steps.migrate.outcome == 'failure' }}
        run: |
          echo "❌ 마이그레이션이 실패했다. 앱은 다시 띄웠지만 **새 코드가 옛 스키마 위에** 있다." >&2
          echo "   위 db-migrate 스텝의 prisma 출력을 확인할 것." >&2
          exit 1
