name: build frontend

# 이 워크플로우도 **빌드 방법을 모른다.** scripts/ci/build-frontend.sh 를 호출만 한다.
# 로컬에서 같은 것을 돌리려면: make ci-build-front APP=medifinder-web ENV=develop
#
# medifinder-web 의 .env.<환경> 은 레포에 커밋돼 있다(값이 전부 클라이언트 번들에 노출되는
# 공개 상수라 숨길 이유가 없다). 그래서 워크플로우가 .env 를 따로 만들지 않는다.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docs/openapi/**'
      - 'scripts/ci/build-frontend.sh'
      - '.github/workflows/build-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'docs/openapi/**'
      - 'scripts/ci/build-frontend.sh'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'medifinder-web 을 어느 환경으로 빌드할지'
        type: choice
        options: [develop, staging, production]
        default: develop

jobs:
  # 프론트가 여러 개 생길 예정이라, 프로젝트마다 잡 하나다.
  # 잡을 추가할 때 바꾸는 건 두 줄뿐이다 — PROJECT, 캐시 키.
  medifinder-web:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/plzhans/hans-api/node-builder:node24

    env:
      APP_ENV: ${{ inputs.environment || 'develop' }}
      # frontend/ 아래의 디렉터리 이름 그대로. 프로젝트 이름이 또 바뀌면 여기만 고친다.
      PROJECT: medifinder-web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-medifinder-web-${{ hashFiles('frontend/medifinder-web/pnpm-lock.yaml') }}
          restore-keys: pnpm-medifinder-web-

      # 커밋된 .env.<환경> 을 그대로 쓴다(값이 전부 공개 상수라 레포에 둔다). 필수 키가 비어
      # 있으면 build-frontend.sh 가 검사해 크게 실패시킨다 — 빈 값이 조용히 번들에 박히는 걸 막는다.
      - run: ./scripts/ci/build-frontend.sh "$PROJECT" "$APP_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT }}-${{ env.APP_ENV }}
          path: frontend/medifinder-web/dist
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/plzhans/hans-api/node-builder:node24

    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-docs-${{ hashFiles('frontend/hansapi-docs/pnpm-lock.yaml') }}
          restore-keys: pnpm-docs-

      # 여기는 **빌드가 되는지만** 본다. 실제 배포는 deploy-docs.yml 이 한다.
      # 그래서 환경은 develop 으로 고정한다(servers·base 는 배포 워크플로우가 환경별로 넘긴다).
      #
      # 레포에 커밋된 docs/openapi/openapi_hansapi.json 을 그대로 쓴다. DB 가 필요 없다.
      # (스펙 재생성은 앱을 부팅해 DB 에 붙어야 하므로 CI 에서 하지 않는다)
      - run: ./scripts/ci/build-frontend.sh hansapi-docs develop

      - uses: actions/upload-artifact@v4
        with:
          name: hansapi-docs
          path: frontend/hansapi-docs/.vitepress/dist
          retention-days: 7
