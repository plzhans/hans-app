name: build frontend

# 이 워크플로우도 **빌드 방법을 모른다.** scripts/ci/build-frontend.sh 를 호출만 한다.
# 로컬에서 같은 것을 돌리려면: make ci-build-web ENV=develop / make ci-build-docs
#
# 워크플로우가 하는 일은 딱 하나 더 있다 — 레포에 없는 .env 를 만들어 주는 것이다.
# clinicfinder-web 의 .env.<환경> 은 gitignore 라 CI 에는 존재하지 않는다.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docs/openapi/**'
      - 'scripts/ci/build-frontend.sh'
      - '.github/workflows/build-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'docs/openapi/**'
      - 'scripts/ci/build-frontend.sh'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'clinicfinder-web 을 어느 환경으로 빌드할지'
        type: choice
        options: [develop, staging, production]
        default: develop

jobs:
  # 프론트가 여러 개 생길 예정이라, 프로젝트마다 잡 하나다.
  # 잡을 추가할 때 바꾸는 건 세 줄뿐이다 — PROJECT, VAR_PREFIX, 캐시 키.
  medifinder-web:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/plzhans/hans-api/node-builder:node24

    # 환경별로 값이 다르다. Variables/Secrets 는 이 environment 에 걸어 둔다.
    # (레포 → Settings → Environments → develop/staging/production)
    environment: ${{ inputs.environment || 'develop' }}

    env:
      APP_ENV: ${{ inputs.environment || 'develop' }}
      # frontend/ 아래의 디렉터리 이름 그대로. 이름이 바뀌면(→ medifinder-web) 여기만 고친다.
      PROJECT: clinicfinder-web
      # 이 프로젝트의 변수 접두사. 프론트가 여러 개면 environment 하나에 VITE_API_BASE_URL 이
      # 여러 벌 필요해지는데, 이름이 같으면 서로 덮어쓴다. 그래서 프로젝트별로 접두사를 단다.
      VAR_PREFIX: MEDIFINDER_WEB_

    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-clinicfinder-web-${{ hashFiles('frontend/clinicfinder-web/pnpm-lock.yaml') }}
          restore-keys: pnpm-clinicfinder-web-

      # 접두사가 붙은 변수·시크릿을 골라 접두사를 떼고 .env 로 쓴다.
      #   MEDIFINDER_WEB_VITE_API_BASE_URL  →  VITE_API_BASE_URL
      #
      # 키 목록을 여기 적지 않는다. 적어두면 프론트가 키를 하나 늘릴 때마다 워크플로우를
      # 같이 고쳐야 하고, 빼먹으면 빈 값이 조용히 번들에 박힌다.
      #
      # VITE_* 는 전부 클라이언트 번들에 구워져 나간다. 즉 브라우저에서 다 보인다.
      # 그래서 여기 있는 값 중 진짜 비밀은 없다. API_KEY 를 Secrets 에 두는 건 로그에
      # 굳이 흘리지 않기 위해서지, 번들에서 감출 수 있어서가 아니다.
      - name: .env.${{ env.APP_ENV }} 생성
        working-directory: frontend/clinicfinder-web
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          umask 077
          pick() {
            jq -r --arg p "$VAR_PREFIX" '
              to_entries[]
              | select(.key | startswith($p))
              | "\(.key | ltrimstr($p))=\(.value)"
            '
          }
          {
            printf '%s' "$ALL_VARS"    | pick
            printf '%s' "$ALL_SECRETS" | pick
          } > ".env.$APP_ENV"

          # 값은 찍지 않는다. 어떤 키가 왔는지만 남긴다.
          echo "생성된 키: $(cut -d= -f1 ".env.$APP_ENV" | sort | tr '\n' ' ')"

      # 빈 값이 오면 vite 는 조용히 빈 문자열을 박는다. 빌드는 "성공" 하고 앱만 죽는다.
      # build-frontend.sh 가 필수 키를 검사해 여기서 크게 실패시킨다.
      - run: ./scripts/ci/build-frontend.sh "$PROJECT" "$APP_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT }}-${{ env.APP_ENV }}
          path: frontend/clinicfinder-web/dist
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/plzhans/hans-api/node-builder:node24

    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-docs-${{ hashFiles('frontend/hansapi-docs/pnpm-lock.yaml') }}
          restore-keys: pnpm-docs-

      # 여기는 **빌드가 되는지만** 본다. 실제 배포는 deploy-docs.yml 이 한다.
      # 그래서 환경은 develop 으로 고정한다(servers·base 는 배포 워크플로우가 환경별로 넘긴다).
      #
      # 레포에 커밋된 docs/openapi/openapi_hansapi.json 을 그대로 쓴다. DB 가 필요 없다.
      # (스펙 재생성은 앱을 부팅해 DB 에 붙어야 하므로 CI 에서 하지 않는다)
      - run: ./scripts/ci/build-frontend.sh hansapi-docs develop

      - uses: actions/upload-artifact@v4
        with:
          name: hansapi-docs
          path: frontend/hansapi-docs/.vitepress/dist
          retention-days: 7
