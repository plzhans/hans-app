name: push node-builder image

on:
  push:
    branches: [main]
    paths:
      - 'docker/node-builder/**'
      - '.github/workflows/docker-node-builder-push.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/node-builder

  # ▼▼▼ node 버전 목록은 여기서만 관리한다. ▼▼▼
  #NODE_VERSIONS: '["24", "22"]'
  NODE_VERSIONS: '["24"]'

jobs:
  # matrix 도, job outputs 도 env 컨텍스트를 직접 못 읽는다.
  # (jobs.<id>.outputs 에서 쓸 수 있는 건 github/needs/strategy/matrix/secrets/steps/inputs/vars 뿐)
  # 그래서 step output 을 한 번 경유시킨다. 버전 목록은 여전히 NODE_VERSIONS 한 곳에만 있다.
  setup:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.list }}
      pnpm: ${{ steps.ver.outputs.pnpm }}
    steps:
      - uses: actions/checkout@v4

      - name: NODE_VERSIONS 를 output 으로 전달
        id: versions
        run: echo "list=$NODE_VERSIONS" >> "$GITHUB_OUTPUT"

      # pnpm 은 node 버전과 무관하게 packageManager 필드가 유일한 진실이다.
      - name: pnpm 버전 추출
        id: ver
        run: echo "pnpm=$(jq -r '.packageManager | split("@")[1]' package.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.setup.outputs.versions) }}

    steps:
      - uses: actions/checkout@v4

      # arm64 를 amd64 러너에서 굽기 위한 에뮬레이터.
      # CI(ubuntu-latest)는 amd64 라 arm64 는 순전히 로컬(Apple Silicon)에서 당겨 쓰기 위한 것이다.
      # 에뮬레이션이라 arm64 쪽 apt 설치가 느리지만, 이 이미지는 paths 필터 때문에
      # docker/node-builder/** 가 바뀔 때만 빌드된다. 1 년에 몇 번이라 감수할 만하다.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 베이스(node:24-bookworm-slim)는 패치 버전이 떠 있다. 같은 Dockerfile 로 다시 빌드해도
      # 24.18.0 이 24.19.x 가 된다. 그런데 태그·라벨이 'node24' 뿐이면 그 둘을 구분할 수 없고,
      # "이 이미지로 빌드했더니 깨졌다" 는 상황에서 어느 node 였는지 역추적이 안 된다.
      # 그래서 빌드 전에 실제로 깔릴 버전을 확인해 태그와 라벨에 박는다.
      #
      # 베이스 이미지 이름은 Dockerfile 의 FROM 에서 꺼낸다. 여기에 다시 적으면
      # Dockerfile 이 바뀔 때 조용히 어긋난다.
      - name: 베이스 이미지의 실제 node 버전 확인
        id: node
        run: |
          base=$(grep -m1 '^FROM ' docker/node-builder/Dockerfile | sed 's/^FROM //')
          base=${base//\$\{NODE_VERSION\}/${{ matrix.node }}}
          full=$(docker run --rm "$base" node --version)   # v24.18.0
          full=${full#v}                                   # 24.18.0
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "base=$base → node $full"

      - uses: docker/build-push-action@v6
        with:
          context: docker/node-builder
          push: true
          # amd64 = CI 러너. arm64 = 로컬 맥. 매니페스트 하나로 묶여서
          # docker pull 하는 쪽이 자기 아키텍처를 알아서 고른다.
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_VERSION=${{ matrix.node }}
            PNPM_VERSION=${{ needs.setup.outputs.pnpm }}
          # source 라벨이 있어야 GHCR 패키지가 이 레포에 연결된다.
          # 연결돼야 패키지 설정(visibility 변경) 화면으로 들어갈 수 있다.
          #
          # 나머지 라벨은 "이 이미지에 뭐가 들었나" 를 이미지 자신이 답하게 하기 위한 것이다.
          # 컨테이너를 띄워 node -v 를 쳐보지 않아도 docker inspect 로 알 수 있다.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=hans-api CI 빌드/배포용 툴체인 이미지 (node ${{ steps.node.outputs.full }}, pnpm ${{ needs.setup.outputs.pnpm }})
            org.opencontainers.image.version=${{ steps.node.outputs.full }}
            io.hansapi.node-builder.node=${{ steps.node.outputs.full }}
            io.hansapi.node-builder.pnpm=${{ needs.setup.outputs.pnpm }}
          # latest 태그는 일부러 찍지 않는다.
          # 버전이 둘 이상이면 latest 가 무엇을 가리키는지 모호해지고,
          # 소비하는 잡이 조용히 엉뚱한 node 버전을 물게 된다. 항상 :node<버전> 으로 고정해서 쓸 것.
          # sha 태그도 버전을 접두사로 붙여야 두 매트릭스 잡이 서로 덮어쓰지 않는다.
          #
          # :node24        메이저. 최신 빌드로 계속 옮겨간다. 평소에 쓰는 태그.
          # :node24.18.0   실제로 깔린 패치까지. 안 움직인다.
          # :node24-<sha>  커밋 고정. 안 움직인다.
          tags: |
            ${{ env.IMAGE }}:node${{ matrix.node }}
            ${{ env.IMAGE }}:node${{ steps.node.outputs.full }}
            ${{ env.IMAGE }}:node${{ matrix.node }}-${{ github.sha }}
          # scope 를 나눠야 두 버전이 서로의 캐시를 밀어내지 않는다.
          cache-from: type=gha,scope=node${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=node${{ matrix.node }}
