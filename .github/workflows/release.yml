# 버전·CHANGELOG·태그·GitHub 릴리스를 만들고, **릴리스된 판만** 운영에 배포한다.
#
# 사람이 하는 일은 Release PR 을 머지하는 것 하나다. 나머지는 전부 여기서 이어진다.
# 배경과 절차는 docs/release.md.
#
#   main push        → 버전 계산 → Release PR 을 열거나 갱신 (릴리스는 아직 안 낸다)
#   Release PR 머지  → 버전 커밋·태그 → 그 판이 **빌드되는지만** 확인
#
# **배포는 여기서 하지 않는다.** 릴리스는 "이 상태를 v1.3.0 이라 부른다" 는 선언이고,
# 배포는 "그것을 언제 서버에 올리느냐" 는 별개 판단이다. 버전을 찍어두고 배포는 배포일에
# 하는 흐름을 막지 않으려고 끊어 뒀다 — docs/release.md 의 "릴리스와 배포는 분리돼 있다".
#
#   배포할 때  →  fe-deploy.yml 을 workflow_dispatch. ref 에 릴리스 태그를 지정한다
#
# 판은 backend·frontend 둘이고, 봇은 **커밋이 바꾼 파일 경로**로 판을 가른다.
# frontend 만 고친 커밋은 frontend 만 올리고 frontend 만 배포된다.
name: release · version, tag, changelog

on:
  push:
    # hotfix/** 도 받는다. 운영 v1.2.0 을 고쳐야 하는데 main 은 이미 1.3.0 을 향해
    # 가 있을 때, 릴리스 태그에서 브랜치를 따 그 위에서 1.2.1 을 낸다.
    #
    #   git checkout -b hotfix/1.2.x release-backend/v1.2.0
    #
    # **워크플로는 그 브랜치에 있는 파일이 돈다.** 옛 태그에서 딴 브랜치는 옛 워크플로를
    # 갖고 있으므로, 그때는 CI 만 최신으로 가져와야 한다:
    #   git checkout main -- .github/workflows/ release-please-config.json
    branches: [main, 'hotfix/**']
  # 봇이 놓쳤거나 손으로 다시 돌리고 싶을 때. 입력은 없다 — 무엇을 낼지는 커밋이 정한다.
  workflow_dispatch:

# 릴리스는 저장소에 커밋과 태그를 쓴다. 두 실행이 겹치면 어느 쪽이 이겼는지 알 수 없다.
# 앞의 것을 죽이지도 않는다 — 태그를 반쯤 만든 채로 끊기는 게 더 나쁘다.
concurrency:
  group: release
  cancel-in-progress: false

# 저장소 기본 권한으로는 PR 도 태그도 못 만든다. 여기서 실행 단위로만 올린다.
# 저장소 쪽에도 한 번 켜 줄 설정이 있다 — docs/github.md 의 "Actions Workflow 권한 설정".
permissions:
  contents: write # 버전 커밋 · 태그 · GitHub 릴리스
  pull-requests: write # Release PR
  # **호출하는 워크플로가 쓸 권한도 여기 있어야 한다.**
  # permissions 블록을 쓰면 나열하지 않은 스코프는 전부 none 이 된다. 그 상태에서
  # 재사용 워크플로(verify-frontend)에 packages: read 를 넘기면 "호출자보다 큰 권한"
  # 이라 거부되고, 잡이 도는 게 아니라 **워크플로가 시작조차 못 한다**(startup_failure).
  # 로그도 안 남아서 원인을 짚기 어렵다.
  # write 인 이유. verify-frontend → fe-deploy → toolchain → infra-node-builder 로
  # 중첩되는데, 마지막이 이미지를 **push** 한다. read 로는 그 중첩 호출이 거부된다.
  packages: write # 중첩 호출이 node-builder 이미지를 GHCR 에 올린다

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      # 이번 실행에서 릴리스가 **실제로** 만들어졌는지. PR 만 갱신하고 끝난 실행은 false 다.
      created: ${{ steps.rp.outputs.releases_created }}
      # 릴리스된 판의 경로 목록. 예: ["frontend"] · ["backend","frontend"]
      #
      # 이 이름을 배포 대상 경로와 같게 맞춰 뒀다(release-please-config.json 의 packages).
      # 그래서 태그 이름(release-frontend/v0.2.0)을 파싱해 경로로 되돌리는 변환표가 없다.
      paths: ${{ steps.rp.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # 기본 GITHUB_TOKEN 을 쓴다. 만료 없는 PAT 을 저장소에 상주시키지 않는다 —
          # 그 판단의 배경은 docs/github.md 에 적혀 있다.
          token: ${{ secrets.GITHUB_TOKEN }}
          # main 이든 hotfix/1.2.x 든 **자기가 푸시된 브랜치**를 대상으로 돈다.
          # 고정하면 핫픽스 브랜치에서 돌려도 main 을 릴리스하려 든다.
          target-branch: ${{ github.ref_name }}


  # ───────────────────────────────────────────────────────────────────────────
  # 릴리스된 판이 **빌드되는지만** 확인한다. 배포하지 않는다.
  #
  # 릴리스를 찍었는데 그 버전이 빌드가 안 되면 태그가 쓸모없어진다. 배포일에 가서야
  # "이 버전 빌드 안 되네" 를 아는 건 늦다. 배포는 안 해도 "이 태그는 배포 가능하다" 는
  # 보장은 릴리스 시점에 받아 둔다.
  #
  # **왜 태그 push 로 트리거하지 않는가.** 봇이 기본 GITHUB_TOKEN 으로 태그를 만들기
  # 때문에 그 push 는 다른 워크플로를 깨우지 않는다(무한 루프 방지). on: push tags 로
  # 짜면 문법은 맞는데 아무 일도 일어나지 않는다. 그래서 같은 실행 안에서 이어 붙인다.
  # 실행을 연 것은 사람의 PR 머지이므로 이 연결에는 제약이 없다.
  #
  # 빌드 방법은 여기 없다. fe-deploy.yml 이 알고, 그것도 결국 frontend/ci-build.sh 를 부른다.
  # ───────────────────────────────────────────────────────────────────────────
  verify-frontend:
    needs: release
    if: >-
      needs.release.outputs.created == 'true' &&
      contains(fromJSON(needs.release.outputs.paths || '[]'), 'frontend')
    uses: ./.github/workflows/fe-deploy.yml
    permissions:
      contents: read
      packages: write # 중첩된 toolchain 잡이 node-builder 를 GHCR 에 올린다
    secrets: inherit
    with:
      environment: production
      target: all
      build_only: true
  # TODO: verify-backend. 같은 자리에 `contains(..., 'backend')` 로 붙인다.

