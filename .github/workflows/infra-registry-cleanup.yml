# 레지스트리에 쌓인 옛 이미지를 정리한다.
#
# 릴리스마다 세 이미지가 올라가고, develop 은 푸시마다 올라간다. 용량 제한은 없지만
# 목록이 길어지면 "지금 쓰이는 게 무엇인가" 가 안 보인다.
#
# [무엇을 남기나]
#   v* 태그          릴리스. **롤백 대상이므로 절대 지우지 않는다**
#   움직이는 태그     staging · latest · develop · production
#   node* 태그       툴체인. node24 · node24.18.0 · node24-<sha>
#   최근 <sha> 태그   위에 안 걸리는 태그 중 최신 KEEP_TAGGED 개 (develop-<sha> · production-<sha>)
#   그 밖            지운다
#
# [태그 없는 버전을 직접 지우면 안 된다]
# 2026-08-02 실행이 레지스트리를 통째로 못 쓰게 만들었다. 남긴 태그의 인덱스는 그대로인데
# 그 인덱스가 가리키는 자식이 전부 지워져서, API 는 200 을 주지만 pull 은 404 로 죽었다.
# 네 패키지의 develop·staging·production·latest 와 v0.5.0~v0.11.0 릴리스가 전부 그렇게 됐다.
#
# 멀티아치 이미지는 GHCR 에서 이렇게 보인다:
#
#   sha256:392a…  ← 태그: latest, node24     (인덱스. 목록에 태그와 함께 뜬다)
#     ├ sha256:55a6…  linux/amd64            ← 태그 없음
#     ├ sha256:9e40…  linux/arm64            ← 태그 없음
#     └ sha256:c29b…  attestation            ← 태그 없음
#
# 자식과 attestation 은 태그를 갖지 않는다. "태그가 없다 = 아무도 참조하지 않는다" 가
# 아니다. 단일 아치라도 build-push-action 이 provenance 를 붙이면 인덱스가 생기므로
# 같은 함정에 빠진다 — hansapp-* 는 arm64 하나인데도 이번에 똑같이 죽었다.
#
# 이건 GHCR 을 쓰는 곳이면 다 겪는 문제라 전용 액션이 있다. 남길 이미지의 매니페스트를
# 먼저 읽어 자식 digest 를 삭제 후보에서 빼주고, 매니페스트를 못 읽으면 지우지 않는다.
# **직접 짜지 않는다.** 정확히 이 실수를 한 번 했다.
#
# [주의]
# 지운 이미지는 되돌릴 수 없다. 그래서 기본이 dry-run 이고, 실제로 지우려면 켜야 한다.
# 스케줄 실행만 자동으로 지운다 — 규칙이 검증된 뒤의 반복 작업이기 때문이다.
name: infra - registry cleanup

on:
  schedule:
    # 매주 월요일 새벽(UTC 19:00 = KST 04:00). 배포가 없는 시간대에 돈다.
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '무엇을 지울지만 보여준다 (실제로 지우지 않음)'
        type: boolean
        default: true
      keep_tagged:
        description: '앱마다 남길 <환경>-<sha> 태그 개수'
        type: string
        default: '10'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 버전을 지운다
    steps:
      # github.event.repository 를 쓰지 않는다. schedule 이벤트는 웹훅 페이로드가 없어서
      # 비어 있을 수 있고, 그러면 packages 가 '/*' 가 되어 조용히 아무것도 안 맞는다.
      # GITHUB_REPOSITORY 는 이벤트와 무관하게 항상 채워진다.
      - name: 레포 이름
        id: repo
        run: echo "name=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          # 이 레포가 올린 이미지 전부. 앱 목록을 여기 적어두면 새 앱이 늘 때 조용히 빠진다.
          # GHCR 패키지 이름은 <레포>/<앱> 이라 접두사가 붙는다.
          packages: ${{ steps.repo.outputs.name }}/*
          expand-packages: true

          # 여기 걸리는 태그는 다른 모든 규칙에서 빠진다. 나이도 개수도 안 본다.
          exclude-tags: v*,latest,staging,production,develop,node*

          # 위에 안 걸리는 태그(develop-<sha> · production-<sha>) 중 최신 것만 남긴다.
          keep-n-tagged: ${{ inputs.keep_tagged || '10' }}

          # 남길 이미지의 자식은 액션이 후보에서 먼저 빼낸다. 여기서 지워지는 것은
          # 태그가 옮겨가며 밀려난 진짜 고아뿐이다.
          delete-untagged: true

          # 정리가 끝난 뒤 멀티아치 이미지의 자식 digest 를 전부 짚어본다.
          # 경고만 하고 실패시키지는 않는다 — 하드 실패는 아래 pull 로 받는다.
          validate: true

          # 스케줄 실행은 실제로 지운다. 수동은 기본이 dry-run 이다.
          dry-run: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}

      # **정리가 node-builder 를 깨뜨렸으면 여기서 멈춘다.**
      #
      # 이 이미지가 죽으면 fe/be 의 빌드·배포 잡이 컨테이너를 못 받아 전부 죽는다.
      # 그래서 실제로 한 번 받아본다 — 시뮬레이션이 아니라 CI 가 매번 하는 그 동작이다.
      #
      # 인덱스만 읽는 확인으로는 안 된다. 자식이 전부 지워진 상태에서도
      # `docker buildx imagetools inspect` 는 exit 0 을 준다(2026-08-02 상태로 확인).
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: node-builder 를 실제로 받아본다
        run: docker pull ghcr.io/${{ github.repository }}/node-builder:latest
