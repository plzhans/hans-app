# medifinder.kr 사이트맵을 만들어 Cloudflare Workers 로 올린다.
#
#   build → (artifact) → deploy
#
# **be.yml 과 아무 관계가 없다.** 배포 파이프라인이 아니라 주기 실행이고, MediFinder 는
# hans-api 의 외부 소비자다. medifinder/ 가 자기 워크스페이스라 설치도 여기서 닫힌다 —
# 예전에는 backend 워크스페이스에 섞여 있어 `--filter` 로 걸러내야 했다.
#
# [만들기와 올리기를 나눈 이유]
# 만들다 실패하면 배포하지 않는다. 잘못된 사이트맵으로 덮는 것보다 지난 회차가 그대로
# 살아 있는 편이 낫다 — 색인은 잘못 제출한 순간에 빠지고, 되돌려도 다시 잡히는 데 몇 주가
# 걸린다. 산출물은 아티팩트로 남으므로 실패했을 때 무엇이 나왔는지 볼 수 있다.
#
# [올리는 방식]
# 정적 자산만 담은 Worker(<환경약칭>-medifinder-sitemap)로 올린다. R2 를 쓰면 버킷·액세스
# 키가 새로 필요하고 웹 워커에 바인딩과 분기를 넣어야 하는데, 이쪽은 그게 없고 자격증명도
# 프론트 배포가 쓰던 것을 그대로 쓴다.
#
# [부하가 커지면]
# 전용 서버로 옮길 때는 이 파일을 지우고 cron 이 같은 두 커맨드를 부르면 된다.
# CLI 와 응용 계층은 바뀌지 않는다.
name: medifinder - sitemap

on:
  workflow_dispatch:
    inputs:
      app_env:
        description: '대상 환경'
        type: choice
        options: [production, develop]
        default: production
      dry_run:
        description: '만들기만 하고 배포하지 않는다'
        type: boolean
        default: false

  # **병원 데이터가 다 준비된 뒤여야 한다.**
  #
  #   06:00 KST  healthcare  통합 병원 데이터 생성 (updated_at 갱신)
  #   06:30 KST  es-index    전량 재색인 — 목록 API 가 읽는 곳
  #   08:00 KST  여기
  #
  # 앞에 돌면 어제 값으로 사이트맵을 만든다. 한 시간 반을 띄운 것은 배치가 늦어질 여지를
  # 둔 것이다 — 사이트맵은 하루 한 번이라 서두를 이유가 없다.
  #
  # **예약 실행은 기본 브랜치에서만 돈다**(GitHub 제약). 태그로 돌리고 싶으면 수동 실행에서
  # ref 를 고른다. 산출물이 코드가 아니라 살아 있는 API 에서 뽑은 데이터라, 검증 게이트
  # (규격 상한·중복·min-urls)가 실질 방어다.
  schedule:
    - cron: '0 23 * * *' # 08:00 KST

# 두 실행이 겹치면 뒤섞인 회차가 배포된다. 줄을 세운다.
concurrency:
  group: medifinder-sitemap-${{ inputs.app_env || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # node·pnpm·sops·age 가 버전 고정으로 들어 있는 레포 공용 툴체인 이미지다.
    # sops 를 여기서 따로 깔지 않는 이유 — 버전이 레포와 갈라지고 아무도 안 고치게 된다.
    container:
      image: ghcr.io/${{ github.repository }}/node-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: medifinder/backend
    steps:
      - uses: actions/checkout@v7

      # node·pnpm 은 이미지에 들어 있다. setup-node 를 쓰지 않는 이유는 그러면 이미지가
      # 고정한 버전 위에 다른 버전을 덮어써서, 무엇으로 도는지가 두 곳에서 정해지기 때문이다.
      - name: 툴체인 확인
        run: node --version && pnpm --version && sops --version

      # **설정을 시크릿 하나로 푼다.**
      #
      # 값마다 GitHub Secret 을 만들지 않는다 — 늘어나면 관리가 안 되고, 한 번 넣으면
      # 다시 읽을 수도 없다. 대신 config/.env.<환경>.enc 를 커밋해 두고 age 키로 연다.
      # 그 키(AGE_SECRET_KEY_FILE)는 백엔드 배포가 이미 쓰던 것이라 새로 만들 것도 없다.
      #
      # 예약 실행에는 inputs 가 없어 기본값을 식에서 준다. 이 워크플로는 운영 사이트맵을
      # 매일 올리는 것이 일이라 production 이 기본이고, develop 은 확인용이다.
      - name: 설정 복호화
        env:
          AGE_SECRET_KEY: ${{ secrets.AGE_SECRET_KEY_FILE }}
          APP_ENV: ${{ inputs.app_env || 'production' }}
        run: |
          printf '%s' "$AGE_SECRET_KEY" > /tmp/age.key
          # 값은 절대 찍지 않는다. 모양만 본다 — 잘못 들어가 있어도 sops 는 "복호화 실패"
          # 라고만 말해서, 그 메시지로는 키가 틀린 건지 파일이 깨진 건지 구분되지 않는다.
          grep -qE '^AGE-SECRET-KEY-1[A-Z0-9]+$' /tmp/age.key \
            || { echo "❌ AGE_SECRET_KEY_FILE 에 개인키 줄이 없다. 키 파일 내용 전체가 들어가야 한다." >&2; exit 1; }

          SOPS_AGE_KEY_FILE=/tmp/age.key sops -d "config/.env.$APP_ENV.enc" > "config/.env.$APP_ENV"
          rm -f /tmp/age.key
          echo "config/.env.$APP_ENV 준비됨 ($(grep -c '=' "config/.env.$APP_ENV") 개 키)"

      # medifinder 워크스페이스(cli · admin-application). hans-api SDK 는 postinstall 이 만든다.
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 타입 검사는 be.yml 이 푸시마다 워크스페이스 전체로 돌린다. 여기서는 소스를
      # 그대로 실행한다(@swc-node/register) — 같은 것을 두 번 볼 이유가 없다.
      - name: 사이트맵 생성
        env:
          # 어느 환경으로 돌지만 준다. 나머지 값은 방금 복호화한 config/.env.<환경> 에 있다.
          MEDIFINDER_APP_ENV: ${{ inputs.app_env || 'production' }}
        # min-urls 는 "API 가 반쯤 죽었다" 를 잡는 바닥이다. 실제 건수(약 88,000)보다
        # 넉넉히 낮게 잡는다 — 폐업으로 자연히 줄어드는 몫까지 실패로 보면 안 된다.
        run: pnpm cli sitemap build --out ./out --min-urls 70000 --env "$MEDIFINDER_APP_ENV"

      # 실패해도 남긴다. 무엇이 나왔길래 검사에 걸렸는지는 파일을 봐야 안다.
      - name: 산출물 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: medifinder/backend/out/
          retention-days: 7
          if-no-files-found: ignore

      - name: 워커 배포
        if: ${{ !inputs.dry_run }}
        env:
          MEDIFINDER_APP_ENV: ${{ inputs.app_env || 'production' }}
          # wrangler 가 직접 읽는다. 프론트 배포가 쓰는 것과 같은 토큰이다.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm cli sitemap deploy --from ./out --env "$MEDIFINDER_APP_ENV"
