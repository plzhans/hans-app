# backend 의 진입점. **develop 에 관한 전부가 여기 있다.**
#
#   verify → build(arm64) → first_notify → image → migrate → deploy
#
# production 은 이 파일과 아무 관계가 없다. 릴리스가 이미지를 굽고
# be-deploy-production.yml 이 그것을 당긴다 — 여기서 production 으로 가는 길은 없다.
#
# [빌드를 도커 밖에서 한다]
# 러너에서 pnpm install·build 를 끝내고, 이미지는 그 결과를 COPY 만 한다
# (Dockerfile 의 --target prebuilt). develop 은 자주 도는데 도커 안에서 워크스페이스를
# 통째로 설치·빌드하면 매번 몇 분이 든다.
#
# **arm64 러너에서 굽는다.** 배포 서버가 arm64 이고, prisma 쿼리 엔진은 플랫폼별
# 네이티브 바이너리라 빌드 호스트가 그대로 산출물에 남는다.
#
# [배포는 요청해야 나간다]
# 커밋 메시지에 #deploy 또는 #be-deploy 가 있으면 이어서 배포하고, 없으면 **빌드·검사까지만**
# 하고 멈춘다. 평소 푸시에서 CI 가 볼 것은 "빌드가 깨지지 않는가" 뿐이므로 이미지를 굽지
# 않는다 — 나중에 올리고 싶으면 수동 실행(stage=deploy)이 그때 스스로 굽는다.
#
# **develop 은 같이 쓰는 서버다.** 협업하려고 아직 완성되지 않은 코드를 main 에 먼저
# 합치는 일이 있으므로, 합쳤다는 이유만으로 공용 서버가 바뀌면 안 된다. opt-out 이 아니라
# opt-in 인 이유는 빠뜨렸을 때의 대가가 다르기 때문이다 — opt-in 을 잊으면 배포가 안 될
# 뿐이지만, opt-out 을 잊으면 남들이 쓰는 서버가 깨진다.
#
# [슬랙]
# 배포가 나갈 때 채널에 카드를 하나 올리고(first_notify), 그 뒤의 진행 상황은 **전부 그
# 카드의 스레드 댓글**로 쌓인다. 채널에는 배포 하나당 메시지 하나만 남는다.
#
# **알림은 배포를 막지 않는다.** 토큰이 없거나 슬랙이 죽어 있으면 ts 가 빈 문자열이 되고,
# 그것을 보는 쪽은 전부 조용히 지나간다.
name: be

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/deploy/**'
      - '.github/workflows/be*.yml'
  # PR 에서도 verify 를 돌린다. 합치기 전에 깨진 것을 보는 게 요점이다.
  # 아래 단계들은 plan 이 push 가 아니면 false 로 두므로 PR 에서 배포가 나갈 일은 없다.
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/deploy/**'
      - '.github/workflows/be*.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: '어디까지 진행할지'
        type: choice
        options: [verify, image, deploy]
        default: verify

# **그룹을 둘로 가른다.** 취소는 같은 그룹 안에서만 일어나므로, 이것이 유일한 방법이다.
#
#   be-ci-<ref>   검사만 하는 실행. 새 푸시가 오면 앞의 것을 취소한다 (마지막 것만 보면 된다)
#   be-deploy     배포까지 가는 실행. 아무도 취소하지 않고 서로 줄을 선다
#
# **cancel-in-progress 는 "내가 취소당할까" 가 아니라 "내가 남을 취소할까" 다.** 새로 들어온
# 실행 기준으로 평가되기 때문에, 한 그룹에 섞어 두면 평범한 푸시가 배포 중인 실행을 죽인다.
# 실제로 그랬다 — 배포가 반쯤 진행된 채로 남으면 compose 는 갱신됐는데 up 은 안 된 상태가 된다.
#
# 배포끼리는 취소하지 않고 순서대로 기다린다. 같은 서버에 두 배포가 겹치면 안 되기도 하고,
# WireGuard 피어도 같은 키로 두 곳에서 붙을 수 없다.
concurrency:
  group: >-
    ${{ (contains(github.event.head_commit.message, '#deploy')
         || contains(github.event.head_commit.message, '#be-deploy')
         || inputs.stage == 'deploy')
        && 'be-deploy'
        || format('be-ci-{0}', github.ref) }}
  cancel-in-progress: >-
    ${{ !(contains(github.event.head_commit.message, '#deploy')
          || contains(github.event.head_commit.message, '#be-deploy')
          || inputs.stage == 'deploy') }}

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 어디까지 갈지 한 곳에서 정한다. 두 군데서 같은 것을 보면 언젠가 어긋난다.
  # ───────────────────────────────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.pick.outputs.verify }}
      image: ${{ steps.pick.outputs.image }}
      deploy: ${{ steps.pick.outputs.deploy }}
    steps:
      # 병합 커밋인지 보려면 부모를 알아야 한다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: pick
        env:
          STAGE: ${{ inputs.stage }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
        run: |
          verify=true
          image=false
          deploy=false

          # 병합 커밋(부모가 둘 이상)은 PR 을 거쳐 온 것이다. 그때 이미 검사했다.
          if [ "$EVENT" = 'push' ] && [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            verify=false
            echo "PR 병합 커밋이다 → verify 는 PR 에서 이미 돌았으므로 건너뛴다."
          fi

          if [ -n "$STAGE" ]; then
            # 직접 선택한 경우
            case "$STAGE" in
              image)  image=true ;;
              deploy) image=true; deploy=true ;;
            esac
          elif [ "$EVENT" = 'push' ]; then
            # **평소 푸시는 굽지 않는다.** CI 로서 볼 것은 "빌드가 깨지지 않는가" 뿐이고,
            # 그건 verify 단계에서 이미 확인된다. 안 쓸 이미지를 매번 레지스트리에 올리면 시간도 들고 목록만 길어진다.
            #
            # 미리 구워둘 이유도 없다 — 수동 배포(stage=deploy)가 같은 실행 안에서 스스로 굽는다.
            if printf '%s' "$HEAD_MSG" | head -1 | grep -qE '#(be-)?deploy'; then
              image=true
              deploy=true
            else
              echo "커밋 메시지에 #deploy·#be-deploy 가 없다 → 빌드·검사까지만 한다."
            fi
          fi

          echo "verify=$verify" >> "$GITHUB_OUTPUT"
          echo "image=$image"   >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "검증=$verify  이미지=$image  배포=$deploy"

  # ───────────────────────────────────────────────────────────────────────────
  # 배포 카드를 채널에 올리고 **그 메시지 id(ts)를 아래로 흘린다.** 뒤 단계들이 그 값으로
  # 같은 스레드에 댓글을 단다. ts 는 보내야 발급되므로 미리 알 수 없다.
  #
  # 동시에 **관문이다.** environment 의 보호 규칙(승인자·대기)이 여기 걸린다 — 승인 전에는
  # 아무것도 굽지도 배포하지도 않는다.
  #
  # **잡 조건이 deploy 가 아니라 image 다.** deploy 로 걸면 stage=image 수동 실행에서 이
  # 잡이 skip 되고, 그러면 needs 로 매달린 image 까지 연쇄로 skip 된다. 반대로 조건을 아예
  # 안 걸면 **평범한 푸시·PR 도 관문에서 승인을 기다리게 된다.** 굽는 실행에서만 존재하는
  # 것이 맞다 — 메시지를 보낼지 말지는 그 안의 스텝이 따로 가른다.
  #
  # **build 는 여기에 매달지 않는다.** 매달면 이 잡이 없는 평범한 CI 에서 빌드가 통째로
  # skip 된다. 관문과 나란히 도니 승인을 기다리는 동안 빌드가 미리 끝나 있게 된다.
  #
  # 잡 이름에 하이픈을 쓰지 않는다 — 표현식에서 `-` 는 뺄셈이라 needs.first-notify 가
  # 에러 없이 **조용히 false** 가 될 수 있다.
  # ───────────────────────────────────────────────────────────────────────────
  first_notify:
    needs: plan
    if: needs.plan.outputs.image == 'true'
    runs-on: ubuntu-latest
    environment: develop
    outputs:
      ts: ${{ steps.post.outputs.ts }}
      # **채널 id 를 응답에서 받아 흘린다.** chat.postMessage 는 `#이름` 도 받아 주지만,
      # 한 번 해석된 id 를 쓰면 뒤 단계들이 이름에 의존하지 않는다.
      channel: ${{ steps.post.outputs.channel_id }}
    steps:
      - uses: actions/checkout@v7

      # 채널에 남는 한 줄이라 **제목만** 담는다. 커밋·요청자·링크는 아래에서 첫 댓글로 내린다.
      - id: card
        if: needs.plan.outputs.deploy == 'true'
        # **여기서 실패해도 잡은 성공해야 한다.** 이 잡에 매달린 배포가 슬랙 설정
        # 하나 때문에 통째로 막히면 안 된다. 실패하면 아래 post 가 건너뛰고 ts 가
        # 비어서 뒤가 전부 조용해질 뿐이다.
        continue-on-error: true
        env:
          APP_ENV: develop
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          # be·fe 가 같은 채널에 뜬다. 제목에서 갈려야 한다.
          DEPLOY_LABEL: 백엔드
        run: ./scripts/deploy/ci-slack-deploy-card.sh > "$RUNNER_TEMP/card.json"

      # errors 기본값이 false 라 **슬랙이 에러를 뱉어도 이 스텝은 실패하지 않는다.**
      # 그때는 ts 가 비어서 아래가 전부 조용해질 뿐, 배포는 그대로 나간다.
      - id: post
        if: steps.card.outcome == 'success'
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ runner.temp }}/card.json

      # **세부는 여기서 스레드로 내린다.** 커밋 제목이 들어가므로 값은 환경변수로 받고
      # mrkdwn 특수문자만 막는다 — 꺾쇠를 그냥 두면 `<url|텍스트>` 링크 문법이 깨진다.
      - name: 슬랙 댓글 · 상세
        if: steps.post.outputs.ts != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ steps.post.outputs.channel_id }}
          GIT_SHA: ${{ github.sha }}
          GIT_ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          escape() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          text="$(printf '<%s|`%s`>  %s\n요청 %s  ·  <%s|실행 로그>' \
            "$COMMIT_URL" "${GIT_SHA:0:7}" "$(escape "$(git log -1 --pretty=%s)")" \
            "$(escape "$GIT_ACTOR")" "$RUN_URL")"
          ./scripts/deploy/ci-slack-send.sh \
            --thread '${{ steps.post.outputs.ts }}' --text "$text"

      # 이 잡이 도는 동안 build 가 나란히 돌고 있다.
      - name: 슬랙 댓글
        if: steps.post.outputs.ts != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ steps.post.outputs.channel_id }}
        run: |
          ./scripts/deploy/ci-slack-send.sh \
            --thread '${{ steps.post.outputs.ts }}' --title '빌드하는 중'

  # ───────────────────────────────────────────────────────────────────────────
  # **검사와 빌드를 한 잡에서 한다.** 둘 다 같은 install·같은 컴파일을 필요로 한다.
  #
  # 나눠 두면 워크스페이스 install 과 tsc 를 두 번 돌리게 되는데, 그게 이 파이프라인에서
  # 제일 비싼 두 단계다. 잡 상자가 하나로 합쳐지는 대신 시간을 절반으로 줄인다.
  #
  # **arm64 에서 돈다.** 배포 서버가 arm64 이고 prisma 엔진은 플랫폼별 네이티브
  # 바이너리라, 여기서 만든 것이 그대로 이미지에 들어간다. 검사만 x86 에서 하고 산출물만
  # arm 에서 만들면 같은 것을 두 번 만들게 되므로 기준을 arm 으로 맞춘다.
  #
  # 나중에 amd64 이미지도 필요해지면 **그때만** 같은 잡을 x86 러너로 한 벌 더 돌리고
  # buildx 로 합친다 — 검사는 여기서 이미 끝나 있으므로 그쪽은 산출물만 만들면 된다.
  #
  #   out/hansapp-api    --prod
  #   out/hansapp-batch  --prod
  #   out/hansapp-cli    --prod 아님 — prisma(devDependency)가 있어야 마이그레이션이 돈다
  # ───────────────────────────────────────────────────────────────────────────
  build:
    needs: plan
    if: needs.plan.outputs.verify == 'true' || needs.plan.outputs.image == 'true'
    name: verify · build (arm64)
    # **우회 변수를 두지 않는다.** x86 으로 떨어지면 prisma 엔진이 amd64 로 만들어져
    # 서버에서 뜨지 않는 이미지가 조용히 완성된다. 러너를 못 구하면 큰 소리로 실패하는
    # 편이 낫다.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: 아키텍처 확인
        run: echo "  러너 $(uname -m)"

      # **pnpm 이 먼저다.** setup-node 의 cache: pnpm 은 스토어 경로를 알아내려고
      # pnpm 을 실행하므로, 그 전에 깔려 있어야 한다. 버전은 package.json 의
      # packageManager 를 읽는다 — node-builder 이미지와 같은 출처다.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # 스토어를 캐시한다. 없으면 매 푸시마다 워크스페이스 전부를 새로 내려받는다.
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # **한 번만 컴파일한다.** lint 도 산출물도 이 결과를 쓴다.
      #
      # 앱별로 좁히지(--filter) 않는 이유는 타입 기반 lint 규칙(no-unsafe-*)이 워크스페이스
      # 전체의 생성된 타입을 봐야 하기 때문이다. Prisma 클라이언트도 이 단계(prisma
      # generate)가 만든다 — 순서가 뒤바뀌면 "타입을 못 찾겠다" 가 수백 줄 쏟아진다.
      #
      # 산출물의 신원(dist/build-info.json)은 각 앱의 build 스크립트가 만든다.
      # 안 주면 dev 로 채워져 **빌드된 산출물이 아니라는 사실이 드러난다.**
      - name: 빌드
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
        run: pnpm -r build

      - name: lint · format
        if: needs.plan.outputs.verify == 'true'
        run: pnpm check

      # **설정 로딩이 여기서 걸린다.** 부팅 때 한 번 도는 코드라 깨져도 늦게 아는데, 그중
      # 환경변수 이름 충돌(`a.b` 와 `a-b` 가 둘 다 `A_B`)은 설정을 읽는 순간에만 드러나
      # 이 단계가 없으면 배포에서 처음 본다. 값(.env)은 러너에 없지만 yaml 문법·자리표시자·
      # 충돌은 파일만으로 판정되므로 시크릿 없이 검사된다.
      - name: 테스트
        if: needs.plan.outputs.verify == 'true'
        run: pnpm test

      # pnpm deploy: 그 앱과 의존성만 추려 자립형 디렉터리(node_modules 포함)를 만든다.
      # --legacy 는 inject-workspace-packages 를 켜지 않은 워크스페이스에서 필요하다.
      - name: 산출물 추리기
        if: needs.plan.outputs.image == 'true'
        run: |
          rm -rf out
          pnpm deploy --filter hansapp-api   --prod --legacy out/hansapp-api
          pnpm deploy --filter hansapp-batch --prod --legacy out/hansapp-batch
          # cli 만 --prod 를 쓰지 않는다. prisma 가 devDependency 인데 그것으로 돌린다.
          pnpm deploy --filter hansapp-cli          --legacy out/hansapp-cli
          du -sh out/* | sed 's/^/  /'

      # **디렉터리째 올리지 않는다.** node_modules 는 작은 파일이 3만 개라 개당 오버헤드가
      # 지배한다 — 그대로 올렸더니 4분 17초가 걸렸다. 하나로 묶으면 파일 1개가 된다.
      #
      # 덤으로 **심볼릭 링크가 링크로 보존된다.** upload-artifact 는 링크를 따라가 실체를
      # 복사하는데, pnpm 은 같은 패키지를 링크로 공유하므로 그것이 전부 중복된다.
      # (숨김 항목 문제도 같이 사라진다 — .pnpm 이 tar 안으로 들어가므로.)
      - name: 산출물 묶기
        if: needs.plan.outputs.image == 'true'
        run: |
          tar --zstd -cf out.tar.zst out
          ls -lh out.tar.zst | awk '{print "  묶음 " $5}'

      - uses: actions/upload-artifact@v7
        if: needs.plan.outputs.image == 'true'
        with:
          name: backend-out-${{ github.sha }}
          path: backend/out.tar.zst
          retention-days: 1
          # 이미 zstd 로 압축돼 있다. 다시 감싸 봐야 시간만 든다.
          compression-level: 0

  # ───────────────────────────────────────────────────────────────────────────
  # 산출물을 이미지로 담는다. **여기서는 컴파일하지 않는다** — COPY 만 한다.
  #
  #   :develop         움직이는 태그. 개발 서버가 이것만 바라본다
  #   :develop-<sha>   안 움직인다. 어떤 커밋의 것인지 되짚는 용
  # ───────────────────────────────────────────────────────────────────────────
  image:
    # first_notify 를 거쳐야 여기 온다 — 그 잡이 관문이다.
    needs: [plan, build, first_notify]
    if: needs.plan.outputs.image == 'true'
    runs-on: ubuntu-24.04-arm
    # 슬랙 토큰이 environment secret 이라 붙는다. 배포 자격증명은 여기서 안 쓴다.
    environment: develop
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [hansapp-api, hansapp-batch, hansapp-cli]
    steps:
      - uses: actions/checkout@v7

      # 세 앱이 나란히 도니 **한 갈래만 카드를 고친다.** 셋 다 고쳐도 결과는 같지만
      # 같은 요청을 세 번 보내게 된다.
      - name: 슬랙 댓글
        if: matrix.app == 'hansapp-api' && needs.first_notify.outputs.ts != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ needs.first_notify.outputs.channel }}
        run: |
          ./scripts/deploy/ci-slack-send.sh \
            --thread '${{ needs.first_notify.outputs.ts }}' --title '도커 이미지를 굽는 중'

      - uses: actions/download-artifact@v8
        with:
          name: backend-out-${{ github.sha }}
          path: backend

      - name: 산출물 풀기
        run: |
          cd backend
          tar --zstd -xf out.tar.zst && rm out.tar.zst
          ls out | sed 's/^/  /'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # **.nvmrc 가 단일 출처다.** 산출물을 만든 node 와 그것을 실행할 node 가 같아야 한다.
      # Dockerfile 기본값도 같은 값이지만, 어긋나도 조용히 지나가지 않게 여기서 덮어쓰고
      # 다르면 멈춘다.
      - name: node 버전 확정
        id: node
        run: |
          nvmrc="$(tr -d 'v \t\r\n' < .nvmrc)"
          arg="$(grep -m1 '^ARG NODE_VERSION=' "backend/docker/${{ matrix.app }}.Dockerfile" | cut -d= -f2)"
          if [ "$nvmrc" != "$arg" ]; then
            echo "::error file=.nvmrc::.nvmrc($nvmrc) 와 Dockerfile 기본값($arg)이 다르다. 둘을 맞출 것."
            exit 1
          fi
          echo "version=$nvmrc" >> "$GITHUB_OUTPUT"
          echo "  node $nvmrc"

      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/docker/${{ matrix.app }}.Dockerfile
          # **빌드는 이미 끝났다.** builder 스테이지를 타지 않는 최종 스테이지를 고른다.
          target: prebuilt
          push: true
          platforms: linux/arm64
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
            APP_UID=${{ vars.APP_UID || '1001' }}
            APP_GID=${{ vars.APP_GID || '1001' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:develop
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:develop-${{ github.sha }}
          # source 라벨이 있어야 GHCR 패키지가 이 레포에 연결된다.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ matrix.app }} (develop)

  # ───────────────────────────────────────────────────────────────────────────
  # 스키마를 먼저 반영한다. **실패하면 배포하지 않는다.**
  #
  # 옛 스키마 위에 새 코드를 올리면 서버가 뜨지도 못한다. migrate deploy 는 적용할 게
  # 없으면 그냥 지나가므로(멱등) 스키마 변경이 없는 배포에서도 무해하다.
  # ───────────────────────────────────────────────────────────────────────────
  migrate:
    # first_notify 는 카드 ts 때문에 있다. outputs 는 needs 에 적어야 보인다 — image 를
    # 거쳐 왔다고 딸려 오지 않는다.
    needs: [plan, first_notify, image]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: develop
    container:
      image: ghcr.io/${{ github.repository }}/node-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # wg-quick 은 커널 모듈이 있든(NET_ADMIN) 없든(TUN) 둘 다 필요하다.
      options: --cap-add NET_ADMIN --device /dev/net/tun
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: 슬랙 댓글
        if: needs.first_notify.outputs.ts != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ needs.first_notify.outputs.channel }}
        run: |
          ./scripts/deploy/ci-slack-send.sh \
            --thread '${{ needs.first_notify.outputs.ts }}' --title 'DB 스키마를 반영하는 중'

      - name: 마이그레이션
        run: ./scripts/deploy/ci-migrate.sh
        env:
          APP_ENV: develop
          # 실패했을 때 어느 단계에서 멈췄는지 스크립트가 스레드에 남긴다.
          SLACK_DEPLOY_THREAD_TIMESTAMP: ${{ needs.first_notify.outputs.ts }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ needs.first_notify.outputs.channel }}
          # 개발 서버는 움직이는 태그만 본다. 방금 이 실행이 그 태그를 옮겼다.
          IMAGE_TAG: develop
          BE_HANSAPP_DEPLOY_SSH_HOST: ${{ vars.BE_HANSAPP_DEPLOY_SSH_HOST }}
          BE_HANSAPP_DEPLOY_PATH: ${{ vars.BE_HANSAPP_DEPLOY_PATH }}
          BE_HANSAPP_DEPLOY_SSH_KEY_FILE: ${{ secrets.BE_HANSAPP_DEPLOY_SSH_KEY_FILE }}
          BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ vars.BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE }}
          BE_WIREGUARD_PEER_CONF_FILE: ${{ secrets.BE_WIREGUARD_PEER_CONF_FILE }}
          AGE_SECRET_KEY_FILE: ${{ secrets.AGE_SECRET_KEY_FILE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

  # ───────────────────────────────────────────────────────────────────────────
  # 설정을 복호화해 서버로 나르고, compose 를 얹고, 이미지를 당겨 띄운다.
  #
  # **개발 서버는 :develop 만 바라본다.** 그 태그가 계속 움직이므로 배포는 반드시 pull
  # 부터 한다 — 안 그러면 서버에 캐시된 옛 이미지가 그대로 다시 뜬다.
  # 무엇이 떠 있는지는 태그가 아니라 앱이 답한다(dist/build-info.json 의 sha).
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    needs: [plan, first_notify, migrate]
    # migrate 를 건너뛰었으면 needs 가 skipped 라 기본 조건으로는 여기도 안 돈다.
    if: >-
      ${{ always()
          && needs.plan.outputs.deploy == 'true'
          && needs.migrate.result != 'failure'
          && needs.migrate.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment: develop
    container:
      image: ghcr.io/${{ github.repository }}/node-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add NET_ADMIN --device /dev/net/tun
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: 슬랙 댓글
        if: needs.first_notify.outputs.ts != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ needs.first_notify.outputs.channel }}
        run: |
          ./scripts/deploy/ci-slack-send.sh \
            --thread '${{ needs.first_notify.outputs.ts }}' --title '서버에 반영하는 중'

      - name: 배포
        run: ./scripts/deploy/ci-deploy.sh
        env:
          APP_ENV: develop
          # 실패했을 때 어느 단계에서 멈췄는지 스크립트가 스레드에 남긴다.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ needs.first_notify.outputs.channel }}
          IMAGE_TAG: develop
          # 서버로 넘어가 앱의 기동 알림이 이 배포 스레드에 붙게 한다.
          SLACK_DEPLOY_THREAD_TIMESTAMP: ${{ needs.first_notify.outputs.ts }}
          BE_HANSAPP_DEPLOY_SSH_HOST: ${{ vars.BE_HANSAPP_DEPLOY_SSH_HOST }}
          BE_HANSAPP_DEPLOY_PATH: ${{ vars.BE_HANSAPP_DEPLOY_PATH }}
          BE_HANSAPP_DEPLOY_SSH_KEY_FILE: ${{ secrets.BE_HANSAPP_DEPLOY_SSH_KEY_FILE }}
          BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ vars.BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE }}
          BE_WIREGUARD_PEER_CONF_FILE: ${{ secrets.BE_WIREGUARD_PEER_CONF_FILE }}
          AGE_SECRET_KEY_FILE: ${{ secrets.AGE_SECRET_KEY_FILE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

  # ───────────────────────────────────────────────────────────────────────────
  # 스레드의 마지막 줄 — 성공·실패·취소와 어디서 멈췄는지.
  #
  # **always() 여야 한다.** 기본 조건이면 앞이 깨졌을 때 같이 skip 되어 스레드가 중간에서
  # 끊긴다 — 도는 중인지 죽은 건지 구분할 수 없다.
  #
  # ts 가 비어 있으면 붙을 스레드가 없으므로 건너뛴다.
  # ───────────────────────────────────────────────────────────────────────────
  report:
    needs: [plan, first_notify, build, image, migrate, deploy]
    if: ${{ always() && needs.first_notify.outputs.ts != '' }}
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - uses: actions/checkout@v7

      # 성공·실패·취소와 **어느 단계에서 멈췄는지**를 판정한다.
      - id: verdict
        env:
          BUILD: ${{ needs.build.result }}
          IMAGE: ${{ needs.image.result }}
          MIGRATE: ${{ needs.migrate.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          status=success
          failed=''
          if [ "$DEPLOY" != 'success' ]; then
            # 앞에서부터 훑어 **처음 어긋난 곳**만 집는다. 그 뒤는 이것 때문에 안 돈 것이다.
            for pair in "빌드:$BUILD" "이미지:$IMAGE" "마이그레이션:$MIGRATE" "배포:$DEPLOY"; do
              name="${pair%%:*}"
              case "${pair##*:}" in
                cancelled) status=cancelled; failed="$name"; break ;;
                failure)   status=failure;   failed="$name"; break ;;
              esac
            done
            # 실패로 잡힌 것이 없는데 배포가 성공도 아니면(skipped 등) 실패로 본다.
            if [ "$status" = 'success' ]; then
              status=failure
              failed='배포'
            fi
          fi
          case "$status" in
            success)   title='✅ 백엔드 배포 완료' ;;
            cancelled) title='⚪ 백엔드 배포 취소' ;;
            *)         title="❌ 백엔드 배포 실패${failed:+ · $failed 단계에서 멈췄다}" ;;
          esac

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "title=$title"   >> "$GITHUB_OUTPUT"
          echo "  판정 $title"

      # **여기서는 액션을 쓰지 않는다.** 액션은 errors 기본값이 false 라 슬랙이 거절해도
      # 로그에 아무것도 남기지 않는다 — 카드가 안 바뀌는데 잡은 초록으로 끝나서, 실제로
      # channel_not_found 를 두 번의 배포 동안 못 보고 지나쳤다. 스크립트는 크게 알린다.
      # (액션이 필요한 곳은 ts 를 output 으로 받아야 하는 first_notify 뿐이다.)
      - name: 슬랙 댓글
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ needs.first_notify.outputs.channel }}
          STATUS: ${{ steps.verdict.outputs.status }}
          TITLE: ${{ steps.verdict.outputs.title }}
        run: |
          # **실패·취소만 채널로 내보낸다.** 성공하면 앱이 뜨면서 기동 알림을 채널에
          # 띄우므로 결론이 이미 보인다. 실패는 그것이 없어서 스레드를 열지 않는 한
          # 아무도 모른다 — 정작 봐야 하는 쪽이 안 보이면 알림을 붙인 뜻이 없다.
          cast=''
          [ "$STATUS" = 'success' ] || cast='--broadcast'
          # 따옴표를 안 씌운다. 빈 문자열이면 인자가 사라져야 한다.
          # shellcheck disable=SC2086
          ./scripts/deploy/ci-slack-send.sh \
            --thread '${{ needs.first_notify.outputs.ts }}' \
            --title "$TITLE" $cast
