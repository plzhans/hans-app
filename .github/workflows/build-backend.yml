name: build backend

# 이 워크플로우는 **빌드 방법을 모른다.** scripts/ci/build-backend.sh 를 호출만 한다.
# 로직을 여기 YAML 에 적으면 로컬에서 재현할 방법이 없어져서, CI 에서만 깨지는 실패가 생긴다.
# 로컬에서 같은 것을 돌리려면: make ci-build-backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/ci/build-backend.sh'
      # 버전 계산도 빌드의 일부다. 이게 빠져 있어서, version.sh 를 고쳐도 빌드가
      # 다시 돌지 않아 CI 에서 sha 가 unknown 으로 찍히는 걸 한참 못 봤다.
      - 'scripts/ci/version.sh'
      - '.github/workflows/build-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/ci/build-backend.sh'
      # 버전 계산도 빌드의 일부다. 이게 빠져 있어서, version.sh 를 고쳐도 빌드가
      # 다시 돌지 않아 CI 에서 sha 가 unknown 으로 찍히는 걸 한참 못 봤다.
      - 'scripts/ci/version.sh'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # 미리 구워둔 툴체인 이미지. node·pnpm 이 이미 들어 있어 설치 단계가 없다.
    # 버전을 고정해서 쓴다. latest 는 일부러 만들지 않는다(docker/node-builder/README.md).
    container:
      image: ghcr.io/plzhans/hans-api/node-builder:node24

    steps:
      - uses: actions/checkout@v5

      # pnpm store 를 캐시해 매 빌드마다 패키지를 다시 받지 않게 한다.
      # 이미지가 굽는 건 node·pnpm 까지고, 프로젝트 의존성은 여기서 받는다.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('backend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: ./scripts/ci/build-backend.sh
