name: build node-builder image

on:
  push:
    branches: [main]
    paths:
      - 'docker/node-builder/**'
      - '.github/workflows/docker-node-builder.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/node-builder

  # ▼▼▼ node 버전 목록은 여기서만 관리한다. ▼▼▼
  #NODE_VERSIONS: '["24", "22"]'
  NODE_VERSIONS: '["24"]'

jobs:
  # matrix 도, job outputs 도 env 컨텍스트를 직접 못 읽는다.
  # (jobs.<id>.outputs 에서 쓸 수 있는 건 github/needs/strategy/matrix/secrets/steps/inputs/vars 뿐)
  # 그래서 step output 을 한 번 경유시킨다. 버전 목록은 여전히 NODE_VERSIONS 한 곳에만 있다.
  setup:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.list }}
      pnpm: ${{ steps.ver.outputs.pnpm }}
    steps:
      - uses: actions/checkout@v4

      - name: NODE_VERSIONS 를 output 으로 전달
        id: versions
        run: echo "list=$NODE_VERSIONS" >> "$GITHUB_OUTPUT"

      # pnpm 은 node 버전과 무관하게 packageManager 필드가 유일한 진실이다.
      - name: pnpm 버전 추출
        id: ver
        run: echo "pnpm=$(jq -r '.packageManager | split("@")[1]' package.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.setup.outputs.versions) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/node-builder
          push: true
          build-args: |
            NODE_VERSION=${{ matrix.node }}
            PNPM_VERSION=${{ needs.setup.outputs.pnpm }}
          # source 라벨이 있어야 GHCR 패키지가 이 레포에 연결된다.
          # 연결돼야 패키지 설정(visibility 변경) 화면으로 들어갈 수 있다.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=hans-api CI 빌드/배포용 툴체인 이미지 (node ${{ matrix.node }})
          # latest 태그는 일부러 찍지 않는다.
          # 버전이 둘 이상이면 latest 가 무엇을 가리키는지 모호해지고,
          # 소비하는 잡이 조용히 엉뚱한 node 버전을 물게 된다. 항상 :node<버전> 으로 고정해서 쓸 것.
          # sha 태그도 버전을 접두사로 붙여야 두 매트릭스 잡이 서로 덮어쓰지 않는다.
          tags: |
            ${{ env.IMAGE }}:node${{ matrix.node }}
            ${{ env.IMAGE }}:node${{ matrix.node }}-${{ github.sha }}
          # scope 를 나눠야 두 버전이 서로의 캐시를 밀어내지 않는다.
          cache-from: type=gha,scope=node${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=node${{ matrix.node }}
