# 운영 서버에 배포한다.
#
# **환경이 파일에 박혀 있다.** 드롭다운으로 고르게 두면 잘못 고른 순간 운영이 나간다.
# 그건 주의로 막을 수 있는 종류가 아니라 설계로 막는다 — 진입점을 환경별로 갈랐다.
#
# [무엇을 배포할지는 ref 가 정한다]
#
#   Use workflow from:  staging                   ← 최신 릴리스
#                       release-backend/v0.6.4     ← 특정 버전(롤백)
#
# **태그가 아니면 첫 잡에서 거부한다.** 그 드롭다운은 브랜치도 함께 보여주고 기본이
# main 인데, 워크플로가 목록을 좁힐 수는 없어서 골라진 뒤에 막는다.
#
# **입력칸이 없다.** 어차피 ref 를 고르는데 버전을 또 적게 하면 두 곳이 어긋날 수 있고
# 오타도 난다. 고른 ref 의 .release-please-manifest.json 에서 읽는다 — 그 커밋이 무슨
# 버전인지는 그 파일이 이미 알고 있다.
#
# [단계]
#   plan      ref 에서 버전을 읽고 이미지가 있는지 확인. 굽지 않는다
#   migrate   스키마 반영. 실패하면 배포하지 않는다
#   deploy    서버에 올린다
#   promote   성공한 버전에 latest 를 붙인다
#
# [태그의 뜻]
#   staging   최신 릴리스            — 배포 후보. 릴리스가 옮긴다
#   latest    지금 운영에 떠 있는 것  — 배포가 성공해야 옮겨진다
#
# staging 과 latest 를 비교하면 **만들어 뒀지만 아직 안 올린 것**이 있는지 바로 보인다.
#
# **릴리스와 배포는 다른 실행이다.** 릴리스는 후보를 만들어 두고, 배포일에 이 워크플로를
# 돌린다. 그 사이가 며칠 벌어지는 것이 정상이고, 그동안 main 에는 커밋이 계속 쌓인다.
# 릴리스 실행에 배포를 매달아 두면 그 실행을 며칠씩 대기 상태로 붙잡게 된다.
#
# 롤백도 이 자리다 — ref 에 이전 릴리스 태그를 고르면 된다. 재빌드가 없다.
#
# **이 파일에는 배포 로직이 없다.** 환경변수를 선언하고 backend/ci-*.sh 를 부르는 게
# 전부다. develop 파일과 겹치는 부분이 있지만 그건 껍데기고, 실제 절차는 스크립트 한 벌이
# 갖는다. 공유 워크플로를 한 겹 두는 것보다 **한 파일만 읽으면 되는 편**을 택했다.
#
# 로컬에서 같은 배포를 돌리려면 scripts/deploy/deploy.sh 를 쓴다 — 같은 스크립트를 지나간다.
name: be - deploy - PRODUCTION

on:
  workflow_dispatch:
    inputs:
      skip_migrate:
        # 운영 스키마는 되돌리기가 어렵다(migrate deploy 에 down 이 없다). 거르는 것은
        # "이미 돌렸다" 를 아는 사람만 하는 선택이어야 한다.
        description: '마이그레이션 건너뛰기 (이미 돌렸을 때만)'
        type: boolean
        default: false


# **동시 실행을 막는다.**
#
# WireGuard 피어는 같은 키로 두 곳에서 붙을 수 없다. 두 배포가 겹치면 먼저 붙은 쪽의
# 연결이 끊겨 배포가 반쯤 진행된 채로 죽는다 — compose 는 갱신됐는데 up 은 안 된 상태가
# 남을 수 있다. cancel-in-progress 도 쓰지 않는다. 진행 중인 배포를 끊는 쪽이 더 나쁘다.
#
# 마이그레이션과 배포가 같은 그룹을 쓴다. 같은 환경에서 둘이 겹치면 안 되기 때문이다.
concurrency:
  group: be-server-production
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 올릴 이미지가 실제로 있는지 먼저 본다. **여기서 굽지 않는다.**
  #
  # 굽는 것은 릴리스 시점의 일이다(release.yml 의 verify-backend). 그때의 커밋으로 구운
  # 것이 v0.6.2 이므로, 배포일에 main 으로 다시 구워 같은 태그를 붙이면 **그 이름이
  # 거짓말이 된다** — 태그는 그 커밋을 가리켜야 한다.
  #
  # 그래서 없으면 만들지 않고 멈춘다. 릴리스가 실패했거나 이미지가 지워진 것이므로,
  # 조용히 다른 것을 올리는 대신 무엇이 없는지 알린다.
  # ───────────────────────────────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # **고른 ref 가 무슨 버전인지 확정한다.**
      #
      # ref 가 staging 이든 release-backend/v0.6.4 든, 그 커밋의 manifest 가 답을 갖고
      # 있다. 사람이 적게 하면 ref 와 어긋날 수 있으므로 파일에서 읽는다.
      # **태그에서만 배포한다.**
      #
      # "Use workflow from" 은 GitHub UI 라 브랜치도 같이 뜨고 기본이 main 이다. 워크플로가
      # 그 목록을 좁힐 수는 없으니, 잘못 고른 것을 여기서 거부한다 — 첫 잡에서 멈추므로
      # 마이그레이션도 배포도 나가지 않는다.
      #
      # 브랜치로 배포하면 "무엇을 배포했나" 가 남지 않는다. main 은 계속 움직이므로
      # 며칠 뒤에 같은 것을 재현할 수 없다.
      - name: ref 확인
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) echo "  ref $GITHUB_REF_NAME (태그)" ;;
            *)
              echo "❌ 태그에서만 배포한다. 받은 ref: $GITHUB_REF_NAME" >&2
              echo "   Use workflow from 에서 아래 중 하나를 고를 것:" >&2
              echo "     staging                  최신 릴리스" >&2
              echo "     release-backend/v0.6.4   특정 버전(롤백)" >&2
              exit 1
              ;;
          esac

      - id: resolve
        name: 버전 확정
        run: |
          semver="$(jq -r '.backend' .release-please-manifest.json)"
          [ -n "$semver" ] && [ "$semver" != 'null' ] \
            || { echo '❌ .release-please-manifest.json 에서 backend 버전을 못 읽었다.' >&2; exit 1; }
          echo "version=v$semver" >> "$GITHUB_OUTPUT"
          echo "  ref ${GITHUB_REF_NAME} → v$semver ($(git rev-parse --short HEAD))"

      - name: 이미지 확인
        env:
          TAG: ${{ steps.resolve.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          missing=''
          for app in hansapp-api hansapp-batch hansapp-migrate; do
            img="ghcr.io/${{ github.repository }}/$app:$TAG"
            if docker manifest inspect "$img" >/dev/null 2>&1; then
              echo "  ✅ $img"
            else
              echo "  ❌ $img"
              missing=1
            fi
          done
          docker logout ghcr.io >/dev/null 2>&1 || true

          if [ -n "$missing" ]; then
            echo
            echo "❌ 올릴 이미지가 없다: $TAG"
            echo "   릴리스가 만든 태그인지 확인할 것 (git tag | grep release-backend)."
            echo "   릴리스 실행이 실패했다면 be - docker image 를 수동으로 돌린다:"
            echo "     environment: production · version: ${TAG#v}"
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 스키마를 먼저 반영한다. **실패하면 배포하지 않는다.**
  #
  # 옛 스키마 위에 새 코드를 올리면 서버가 뜨지도 못한다. 반쯤 간 상태를 만들 이유가
  # 없으므로 여기서 멈춘다. migrate deploy 는 적용할 게 없으면 통과하므로(멱등)
  # 스키마 변경이 없는 배포에서도 그냥 지나간다.
  #
  # 필요한 것(compose·env)은 스스로 올린다. 배포가 날라 주기를 기다리면 첫 배포에서
  # 순서가 꼬인다 — 마이그레이션이 먼저 도는데 그 파일을 만드는 것이 배포이기 때문이다.
  # ───────────────────────────────────────────────────────────────────────────
  migrate:
    needs: plan
    if: ${{ !inputs.skip_migrate }}
    runs-on: ubuntu-latest
    environment: production
    container:
      image: ghcr.io/${{ github.repository }}/node-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # wg-quick 은 커널 모듈이 있든(NET_ADMIN) 없든(TUN) 둘 다 필요하다.
      options: --cap-add NET_ADMIN --device /dev/net/tun
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: 마이그레이션
        run: ./scripts/deploy/ci-migrate.sh
        env:
          APP_ENV: production
          IMAGE_TAG: ${{ needs.plan.outputs.version }}
          BE_HANSAPP_DEPLOY_SSH_HOST: ${{ vars.BE_HANSAPP_DEPLOY_SSH_HOST }}
          BE_HANSAPP_DEPLOY_PATH: ${{ vars.BE_HANSAPP_DEPLOY_PATH }}
          BE_HANSAPP_DEPLOY_SSH_KEY_FILE: ${{ secrets.BE_HANSAPP_DEPLOY_SSH_KEY_FILE }}
          BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ vars.BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE }}
          BE_WIREGUARD_PEER_CONF_FILE: ${{ secrets.BE_WIREGUARD_PEER_CONF_FILE }}
          AGE_SECRET_KEY_FILE: ${{ secrets.AGE_SECRET_KEY_FILE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

  deploy:
    needs: [plan, migrate]
    # migrate 를 건너뛰었으면 needs 가 skipped 라 기본 조건으로는 deploy 도 안 돈다.
    # always() 로 그 사슬을 끊되, image 는 반드시 성공해야 한다(없는 이미지를 올릴 수 없다).
    if: >-
      ${{ always()
          && needs.plan.result == 'success'
          && needs.migrate.result != 'failure'
          && needs.migrate.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment: production
    container:
      image: ghcr.io/${{ github.repository }}/node-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add NET_ADMIN --device /dev/net/tun
    permissions:
      contents: read
      packages: read # node-builder 이미지를 GHCR 에서 받는다
    steps:
      - uses: actions/checkout@v4

      - name: 배포
        run: ./scripts/deploy/ci-deploy.sh
        env:
          APP_ENV: production
          IMAGE_TAG: ${{ needs.plan.outputs.version }}
          BE_HANSAPP_DEPLOY_SSH_HOST: ${{ vars.BE_HANSAPP_DEPLOY_SSH_HOST }}
          BE_HANSAPP_DEPLOY_PATH: ${{ vars.BE_HANSAPP_DEPLOY_PATH }}
          BE_HANSAPP_DEPLOY_SSH_KEY_FILE: ${{ secrets.BE_HANSAPP_DEPLOY_SSH_KEY_FILE }}
          BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ vars.BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE }}
          BE_WIREGUARD_PEER_CONF_FILE: ${{ secrets.BE_WIREGUARD_PEER_CONF_FILE }}
          AGE_SECRET_KEY_FILE: ${{ secrets.AGE_SECRET_KEY_FILE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

  # ───────────────────────────────────────────────────────────────────────────
  # 배포에 성공한 버전에 latest 를 붙인다.
  #
  # **latest 는 "지금 운영에 떠 있는 것" 이다.** 흔히 쓰는 "가장 최근에 구운 것" 이 아니다.
  # 구운 것은 staging 이 가리키고, 올라간 것은 latest 가 가리킨다. 그래서 두 태그를
  # 비교하면 "만들어 뒀지만 아직 안 올린 것" 이 있는지 바로 보인다.
  #
  # **배포에 쓰지 않는다.** 움직이는 태그로 배포하면 서버 .env 가 "지금 무엇이 떠 있나" 에
  # 답하지 못한다. 이것은 사람이 보는 이정표다.
  #
  # imagetools create 는 레지스트리 안에서 매니페스트만 복사한다 — 이미지를 받지 않는다.
  # ───────────────────────────────────────────────────────────────────────────
  promote:
    needs: [plan, deploy]
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # 태그를 옮긴다
      packages: write # 이미지에도 같은 이름을 붙인다
    steps:
      - uses: actions/checkout@v4

      # **git 태그 latest 를 이 커밋으로 옮긴다.**
      # Actions 의 ref 드롭다운에 뜨므로, "지금 운영에 뭐가 떠 있나" 를 그 목록에서 본다.
      - name: latest 태그 이동
        run: |
          git tag -f latest
          git push -f origin latest
          echo "  latest → $(git rev-parse --short HEAD)  (${{ needs.plan.outputs.version }})"

      - name: 이미지 latest 마킹
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          for app in hansapp-api hansapp-batch hansapp-migrate; do
            img="ghcr.io/${{ github.repository }}/$app"
            docker buildx imagetools create -t "$img:latest" "$img:$VERSION"
            echo "  $app:latest → $VERSION"
          done
          docker logout ghcr.io >/dev/null 2>&1 || true
