# 운영 서버에 배포한다.
#
# **환경이 파일에 박혀 있다.** 드롭다운으로 고르게 두면 잘못 고른 순간 운영이 나간다.
# 그건 주의로 막을 수 있는 종류가 아니라 설계로 막는다 — 진입점을 환경별로 갈랐다.
#
# [무엇을 배포할지는 ref 가 정한다]
#
#   Use workflow from:  staging                   ← 최신 릴리스
#                       release-backend/v0.6.4     ← 특정 버전(롤백)
#
# **입력칸이 없다.** 태그를 고르는 것이 곧 버전을 고르는 것이다 — 그 커밋의
# .release-please-manifest.json 이 버전을 갖고 있으므로 사람이 적을 필요가 없고,
# 적게 하면 ref 와 어긋날 수 있다.
#
# 설정·compose·배포 스크립트도 그 ref 의 것을 쓴다. 릴리스는 "이 조합을 배포한다" 는
# 선언이므로 조합 전체가 그 시점에 고정된다.
#
# **워크플로도 그 ref 의 것이 돈다.** GitHub 이 그렇게 동작한다. 그래서 이 파일을 고치면
# 릴리스를 한 번 내야 태그에 담긴다 — .github 은 릴리스 대상이 아니므로 backend/ 아래에
# 변경이 하나는 있어야 한다.
#
# [단계]
#   plan      ref 에서 버전을 읽고 이미지가 있는지 확인. 굽지 않는다
#   migrate   스키마 반영. 실패하면 배포하지 않는다
#   deploy    서버에 올린다
#   promote   성공한 버전에 latest 를 붙인다
#
# [태그의 뜻]
#   staging   최신 릴리스            — 배포 후보. 릴리스가 옮긴다
#   latest    지금 운영에 떠 있는 것  — 배포가 성공해야 옮겨진다
#
# staging 과 latest 를 비교하면 **만들어 뒀지만 아직 안 올린 것**이 있는지 바로 보인다.
#
# **릴리스와 배포는 다른 실행이다.** 릴리스는 후보를 만들어 두고, 배포일에 이 워크플로를
# 돌린다. 그 사이가 며칠 벌어지는 것이 정상이고, 그동안 main 에는 커밋이 계속 쌓인다.
# 릴리스 실행에 배포를 매달아 두면 그 실행을 며칠씩 대기 상태로 붙잡게 된다.
#
# 롤백도 이 자리다 — ref 에 이전 릴리스 태그를 고르면 된다. 재빌드가 없다.
#
# **이 파일에는 배포 로직이 없다.** 환경변수를 선언하고 backend/ci-*.sh 를 부르는 게
# 전부다. develop 파일과 겹치는 부분이 있지만 그건 껍데기고, 실제 절차는 스크립트 한 벌이
# 갖는다. 공유 워크플로를 한 겹 두는 것보다 **한 파일만 읽으면 되는 편**을 택했다.
#
# 로컬에서 같은 배포를 돌리려면 scripts/deploy/deploy.sh 를 쓴다 — 같은 스크립트를 지나간다.
name: be - deploy - PRODUCTION

on:
  workflow_dispatch:
    inputs:
      skip_migrate:
        # 운영 스키마는 되돌리기가 어렵다(migrate deploy 에 down 이 없다). 거르는 것은
        # "이미 돌렸다" 를 아는 사람만 하는 선택이어야 한다.
        description: '마이그레이션 건너뛰기 (이미 돌렸을 때만)'
        type: boolean
        default: false


# **동시 실행을 막는다.**
#
# WireGuard 피어는 같은 키로 두 곳에서 붙을 수 없다. 두 배포가 겹치면 먼저 붙은 쪽의
# 연결이 끊겨 배포가 반쯤 진행된 채로 죽는다 — compose 는 갱신됐는데 up 은 안 된 상태가
# 남을 수 있다. cancel-in-progress 도 쓰지 않는다. 진행 중인 배포를 끊는 쪽이 더 나쁘다.
#
# 마이그레이션과 배포가 같은 그룹을 쓴다. 같은 환경에서 둘이 겹치면 안 되기 때문이다.
concurrency:
  group: be-server-production
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 올릴 이미지가 실제로 있는지 먼저 본다. **여기서 굽지 않는다.**
  #
  # 굽는 것은 릴리스 시점의 일이다(release.yml 의 verify-backend). 그때의 커밋으로 구운
  # 것이 v0.6.2 이므로, 배포일에 main 으로 다시 구워 같은 태그를 붙이면 **그 이름이
  # 거짓말이 된다** — 태그는 그 커밋을 가리켜야 한다.
  #
  # 그래서 없으면 만들지 않고 멈춘다. 릴리스가 실패했거나 이미지가 지워진 것이므로,
  # 조용히 다른 것을 올리는 대신 무엇이 없는지 알린다.
  # ───────────────────────────────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # **태그에서만 배포한다.**
      #
      # "Use workflow from" 은 GitHub UI 라 브랜치도 함께 뜨고 기본이 main 이다. 목록을
      # 좁힐 수는 없으니 골라진 뒤에 거부한다 — 첫 잡에서 멈추므로 아무것도 나가지 않는다.
      #
      # 브랜치로 배포하면 무엇을 배포했는지 남지 않는다. main 은 계속 움직여서 며칠 뒤에
      # 같은 것을 재현할 수 없다.
      - name: ref 확인
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) echo "  ref $GITHUB_REF_NAME (태그)" ;;
            *)
              echo "❌ 태그에서만 배포한다. 받은 ref: $GITHUB_REF_NAME" >&2
              echo "   Use workflow from 에서 아래 중 하나를 고를 것:" >&2
              echo "     staging                  최신 릴리스" >&2
              echo "     release-backend/v0.6.4   특정 버전(롤백)" >&2
              exit 1
              ;;
          esac

      # **고른 ref 가 무슨 버전인지 확정한다.** 그 커밋의 manifest 가 답을 갖고 있다.
      - id: resolve
        name: 버전 확정
        run: |
          semver="$(jq -r '.backend' .release-please-manifest.json)"
          [ -n "$semver" ] && [ "$semver" != 'null' ] \
            || { echo '❌ .release-please-manifest.json 에서 backend 버전을 못 읽었다.' >&2; exit 1; }
          echo "version=v$semver" >> "$GITHUB_OUTPUT"
          echo "  $GITHUB_REF_NAME → v$semver ($(git rev-parse --short HEAD))"

      # **최신 릴리스인지 알려만 준다. 막지 않는다.**
      #
      # 옛 버전 배포는 롤백이라 정당하므로 거부할 수 없다. 다만 릴리스를 병합하고 곧바로
      # 배포를 누르면 staging 이 아직 직전 릴리스를 가리키는 짧은 창이 있어, 의도치 않게
      # 한 판 뒤가 나갈 수 있다. 둘은 화면상 구분되지 않으므로 여기서 드러낸다.
      - name: 최신 릴리스와 비교
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          latest="$(git ls-remote --tags --refs origin 'refs/tags/release-backend/v*' \
            | sed 's#.*/release-backend/##' | sort -V | tail -1)"
          echo "  배포 대상   $VERSION  ($GITHUB_REF_NAME)"
          echo "  최신 릴리스 ${latest:-(없음)}"
          if [ -n "$latest" ] && [ "$latest" != "$VERSION" ]; then
            echo "  ⚠ 최신이 아니다 — 롤백이면 정상, 아니면 릴리스가 아직 도는 중일 수 있다"
          fi

      # **이미지가 올라올 때까지 기다린다.**
      #
      # 릴리스를 병합하고 바로 배포를 누르는 것이 자연스러운 흐름인데, 그때 이미지 빌드가
      # 아직 돌고 있다. 없다고 바로 실패시키면 사람이 빌드 끝나는 시점을 재고 있어야 한다 —
      # 그건 기계가 할 일이다.
      #
      # 세 개가 순서대로 끝나므로 마지막 하나가 늦다. 10분이면 충분하고, 그보다 오래
      # 걸리면 빌드가 실패한 것이라 기다릴 이유가 없다.
      - name: 이미지 확인
        env:
          TAG: ${{ steps.resolve.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          apps='hansapp-api hansapp-batch hansapp-cli'
          deadline=$(( $(date +%s) + 600 ))   # 10분

          while :; do
            missing=''
            for app in $apps; do
              img="ghcr.io/${{ github.repository }}/$app:$TAG"
              docker manifest inspect "$img" >/dev/null 2>&1 || missing="$missing $app"
            done

            [ -z "$missing" ] && break

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo
              echo "❌ 10분을 기다렸는데 아직 없다:$missing  ($TAG)"
              echo "   릴리스의 이미지 빌드가 실패했을 수 있다 — release 실행을 확인할 것."
              echo "   수동으로 구우려면 be - docker image:"
              echo "     environment: production · version: ${TAG#v}"
              docker logout ghcr.io >/dev/null 2>&1 || true
              exit 1
            fi

            echo "  기다리는 중:$missing"
            sleep 20
          done

          for app in $apps; do
            echo "  ✅ ghcr.io/${{ github.repository }}/$app:$TAG"
          done
          docker logout ghcr.io >/dev/null 2>&1 || true

  # ───────────────────────────────────────────────────────────────────────────
  # 스키마를 먼저 반영한다. **실패하면 배포하지 않는다.**
  #
  # 옛 스키마 위에 새 코드를 올리면 서버가 뜨지도 못한다. 반쯤 간 상태를 만들 이유가
  # 없으므로 여기서 멈춘다. migrate deploy 는 적용할 게 없으면 통과하므로(멱등)
  # 스키마 변경이 없는 배포에서도 그냥 지나간다.
  #
  # 필요한 것(compose·env)은 스스로 올린다. 배포가 날라 주기를 기다리면 첫 배포에서
  # 순서가 꼬인다 — 마이그레이션이 먼저 도는데 그 파일을 만드는 것이 배포이기 때문이다.
  # ───────────────────────────────────────────────────────────────────────────
  # ───────────────────────────────────────────────────────────────────────────
  # 배포 카드를 채널에 올리고 **그 메시지 id(ts)를 아래로 흘린다.** 뒤 단계들이 그 값으로
  # 같은 스레드에 댓글을 단다. develop(be.yml)과 같은 규칙이고, 색만 주황이다.
  #
  # 알림이 실패해도 배포는 나간다 — ts 가 비면 뒤가 전부 조용해질 뿐이다.
  # ───────────────────────────────────────────────────────────────────────────
  first_notify:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    outputs:
      ts: ${{ steps.post.outputs.ts }}
      # chat.postMessage 는 `#이름` 을 받아 주지만 update 는 id 만 받는다. 응답에서 받아 흘린다.
      channel: ${{ steps.post.outputs.channel_id }}
    steps:
      - uses: actions/checkout@v7

      # 채널에 남는 한 줄이라 제목만 담는다. 세부는 아래에서 첫 댓글로 내린다.
      - id: card
        # **여기서 실패해도 잡은 성공해야 한다.** 이 잡에 매달린 배포가 슬랙 설정
        # 하나 때문에 통째로 막히면 안 된다. 실패하면 아래 post 가 건너뛰고 ts 가
        # 비어서 뒤가 전부 조용해질 뿐이다.
        continue-on-error: true
        env:
          APP_ENV: production
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          DEPLOY_LABEL: 백엔드
        run: ./scripts/deploy/ci-slack-deploy-card.sh > "$RUNNER_TEMP/card.json"

      - id: post
        if: steps.card.outcome == 'success'
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ runner.temp }}/card.json

      # develop 과 달리 **커밋이 아니라 버전이 신원이다** — 태그에서만 배포하기 때문이다.
      - name: 슬랙 댓글 · 상세
        if: steps.post.outputs.ts != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ steps.post.outputs.channel_id }}
          VERSION: ${{ needs.plan.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          GIT_ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          escape() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          text="$(printf '`%s`  ·  %s\n요청 %s  ·  <%s|실행 로그>' \
            "$(escape "$VERSION")" "$(escape "$REF_NAME")" "$(escape "$GIT_ACTOR")" "$RUN_URL")"
          ./scripts/deploy/ci-slack-send.sh \
            --thread '${{ steps.post.outputs.ts }}' --text "$text"

  migrate:
    needs: [plan, first_notify]
    if: ${{ !inputs.skip_migrate }}
    runs-on: ubuntu-latest
    environment: production
    container:
      image: ghcr.io/${{ github.repository }}/node-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # wg-quick 은 커널 모듈이 있든(NET_ADMIN) 없든(TUN) 둘 다 필요하다.
      options: --cap-add NET_ADMIN --device /dev/net/tun
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: 슬랙 댓글
        if: needs.first_notify.outputs.ts != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ needs.first_notify.outputs.channel }}
        run: |
          ./scripts/deploy/ci-slack-send.sh \
            --thread '${{ needs.first_notify.outputs.ts }}' --title 'DB 스키마를 반영하는 중'

      - name: 마이그레이션
        run: ./scripts/deploy/ci-migrate.sh
        env:
          APP_ENV: production
          # 실패했을 때 어느 단계에서 멈췄는지 스크립트가 스레드에 남긴다.
          # deploy 쪽은 이 값을 서버로도 넘겨 앱 기동 알림이 스레드에 붙게 한다.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ needs.first_notify.outputs.channel }}
          SLACK_DEPLOY_THREAD_TIMESTAMP: ${{ needs.first_notify.outputs.ts }}
          IMAGE_TAG: ${{ needs.plan.outputs.version }}
          BE_HANSAPP_DEPLOY_SSH_HOST: ${{ vars.BE_HANSAPP_DEPLOY_SSH_HOST }}
          BE_HANSAPP_DEPLOY_PATH: ${{ vars.BE_HANSAPP_DEPLOY_PATH }}
          BE_HANSAPP_DEPLOY_SSH_KEY_FILE: ${{ secrets.BE_HANSAPP_DEPLOY_SSH_KEY_FILE }}
          BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ vars.BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE }}
          BE_WIREGUARD_PEER_CONF_FILE: ${{ secrets.BE_WIREGUARD_PEER_CONF_FILE }}
          AGE_SECRET_KEY_FILE: ${{ secrets.AGE_SECRET_KEY_FILE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

  deploy:
    needs: [plan, first_notify, migrate]
    # migrate 를 건너뛰었으면 needs 가 skipped 라 기본 조건으로는 deploy 도 안 돈다.
    # always() 로 그 사슬을 끊되, image 는 반드시 성공해야 한다(없는 이미지를 올릴 수 없다).
    if: >-
      ${{ always()
          && needs.plan.result == 'success'
          && needs.migrate.result != 'failure'
          && needs.migrate.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment: production
    container:
      image: ghcr.io/${{ github.repository }}/node-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add NET_ADMIN --device /dev/net/tun
    permissions:
      contents: read
      packages: read # node-builder 이미지를 GHCR 에서 받는다
    steps:
      - uses: actions/checkout@v7

      - name: 슬랙 댓글
        if: needs.first_notify.outputs.ts != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ needs.first_notify.outputs.channel }}
        run: |
          ./scripts/deploy/ci-slack-send.sh \
            --thread '${{ needs.first_notify.outputs.ts }}' --title '서버에 반영하는 중'

      - name: 배포
        run: ./scripts/deploy/ci-deploy.sh
        env:
          APP_ENV: production
          # 실패했을 때 어느 단계에서 멈췄는지 스크립트가 스레드에 남긴다.
          # deploy 쪽은 이 값을 서버로도 넘겨 앱 기동 알림이 스레드에 붙게 한다.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ needs.first_notify.outputs.channel }}
          SLACK_DEPLOY_THREAD_TIMESTAMP: ${{ needs.first_notify.outputs.ts }}
          IMAGE_TAG: ${{ needs.plan.outputs.version }}
          BE_HANSAPP_DEPLOY_SSH_HOST: ${{ vars.BE_HANSAPP_DEPLOY_SSH_HOST }}
          BE_HANSAPP_DEPLOY_PATH: ${{ vars.BE_HANSAPP_DEPLOY_PATH }}
          BE_HANSAPP_DEPLOY_SSH_KEY_FILE: ${{ secrets.BE_HANSAPP_DEPLOY_SSH_KEY_FILE }}
          BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ vars.BE_HANSAPP_DEPLOY_SSH_KNOWN_HOSTS_FILE }}
          BE_WIREGUARD_PEER_CONF_FILE: ${{ secrets.BE_WIREGUARD_PEER_CONF_FILE }}
          AGE_SECRET_KEY_FILE: ${{ secrets.AGE_SECRET_KEY_FILE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

  # ───────────────────────────────────────────────────────────────────────────
  # 배포에 성공한 버전에 latest 를 붙인다.
  #
  # **latest 는 "지금 운영에 떠 있는 것" 이다.** 흔히 쓰는 "가장 최근에 구운 것" 이 아니다.
  # 구운 것은 staging 이 가리키고, 올라간 것은 latest 가 가리킨다. 그래서 두 태그를
  # 비교하면 "만들어 뒀지만 아직 안 올린 것" 이 있는지 바로 보인다.
  #
  # **배포에 쓰지 않는다.** 움직이는 태그로 배포하면 서버 .env 가 "지금 무엇이 떠 있나" 에
  # 답하지 못한다. 이것은 사람이 보는 이정표다.
  #
  # imagetools create 는 레지스트리 안에서 매니페스트만 복사한다 — 이미지를 받지 않는다.
  # ───────────────────────────────────────────────────────────────────────────
  promote:
    needs: [plan, deploy]
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # 태그를 옮긴다
      packages: write # 이미지에도 같은 이름을 붙인다
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # **git 태그 latest 를 배포한 커밋으로 옮긴다.**
      # Actions 의 ref 드롭다운에 뜨므로, "지금 운영에 뭐가 떠 있나" 를 그 목록에서 본다.
      - name: latest 태그 이동
        run: |
          git tag -f latest
          git push -f origin latest
          echo "  latest → $(git rev-parse --short HEAD)  (${{ needs.plan.outputs.version }})"

      - name: 이미지 latest 마킹
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          for app in hansapp-api hansapp-batch hansapp-cli; do
            img="ghcr.io/${{ github.repository }}/$app"
            docker buildx imagetools create -t "$img:latest" "$img:$VERSION"
            echo "  $app:latest → $VERSION"
          done
          docker logout ghcr.io >/dev/null 2>&1 || true

  # ───────────────────────────────────────────────────────────────────────────
  # 스레드의 마지막 줄 — 성공·실패·취소와 어디서 멈췄는지.
  #
  # **always() 여야 한다.** 기본 조건이면 앞이 깨졌을 때 같이 skip 되어 스레드가 중간에서
  # 끊긴다. ts 가 비어 있으면 붙을 스레드가 없으므로 건너뛴다.
  # ───────────────────────────────────────────────────────────────────────────
  report:
    needs: [plan, first_notify, migrate, deploy, promote]
    if: ${{ always() && needs.first_notify.outputs.ts != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      # 성공·실패·취소와 **어느 단계에서 멈췄는지**를 판정한다.
      - id: verdict
        env:
          MIGRATE: ${{ needs.migrate.result }}
          DEPLOY: ${{ needs.deploy.result }}
          PROMOTE: ${{ needs.promote.result }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          status=success
          failed=''
          if [ "$DEPLOY" != 'success' ]; then
            # 앞에서부터 훑어 **처음 어긋난 곳**만 집는다. 그 뒤는 이것 때문에 안 돈 것이다.
            # migrate 는 skip 될 수 있다(skip_migrate) — 그건 실패가 아니다.
            for pair in "마이그레이션:$MIGRATE" "배포:$DEPLOY"; do
              name="${pair%%:*}"
              case "${pair##*:}" in
                cancelled) status=cancelled; failed="$name"; break ;;
                failure)   status=failure;   failed="$name"; break ;;
              esac
            done
            if [ "$status" = 'success' ]; then
              status=failure
              failed='배포'
            fi
          fi

          case "$status" in
            success)   title="✅ 백엔드 $VERSION 운영 배포 완료" ;;
            cancelled) title="⚪ 백엔드 $VERSION 운영 배포 취소" ;;
            *)         title="❌ 백엔드 $VERSION 운영 배포 실패${failed:+ · $failed 단계에서 멈췄다}" ;;
          esac

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "title=$title"   >> "$GITHUB_OUTPUT"
          echo "  판정 $title"

      # **운영은 성공도 채널로 내보낸다.** develop 과 달리 하루에 몇 번씩 도는 일이 아니라,
      # 나갔다는 사실 자체가 스크롤하다 걸려야 하는 사건이다.
      - name: 슬랙 댓글
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ needs.first_notify.outputs.channel }}
          TITLE: ${{ steps.verdict.outputs.title }}
        run: |
          ./scripts/deploy/ci-slack-send.sh \
            --thread '${{ needs.first_notify.outputs.ts }}' \
            --title "$TITLE" --broadcast
