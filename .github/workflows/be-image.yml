# backend 앱을 도커 이미지로 구워 GHCR 에 올린다. **서버에는 배포하지 않는다.**
#
# 지금은 여기까지다. 이미지가 레지스트리에 올라간 뒤 서버가 그것을 당겨 띄우는 단계는
# 아직 없다 — 그건 서버 쪽 준비(pm2 → 컨테이너 런타임 전환)가 따라와야 한다.
#
#   workflow_dispatch  → 환경을 골라서 굽고 민다
#   workflow_call      → 나중에 release.yml 이 검증용으로 부를 수 있다
#
# 이미지는 **환경에 무관하다.** APP_ENV 를 런타임에 읽어 config/config.<환경>.yaml 을
# 고르기 때문이다(프론트와 정반대 — 그쪽은 VITE_* 가 빌드에 구워져 환경마다 산출물이 다르다).
# 그래도 태그를 환경별로 나누는 이유는 "지금 develop 에 뭐가 떠 있나" 를 태그로 답하기
# 위해서다. 같은 커밋이면 두 태그가 같은 이미지를 가리켜도 된다.
name: be - docker image

on:
  # **push 트리거가 없다.** develop 은 main.yml 이 자기 안에서 굽고, production 은
  # release.yml 이 여기를 부른다. 트리거를 여기에도 두면 같은 커밋에 이미지가 두 번 구워진다.
  workflow_dispatch:
    inputs:
      environment:
        description: '태그를 붙일 환경'
        type: choice
        options: [develop, production]
        default: develop
      target:
        description: '대상 (all = 전부)'
        type: choice
        options: [all, hansapp-api, hansapp-batch, hansapp-cli]
        default: all
      version:
        description: '릴리스 버전 (예: 0.3.0). 주면 v0.3.0 태그를 같이 붙인다'
        type: string
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      target:
        type: string
        default: all
      version:
        type: string

concurrency:
  group: be-image-${{ inputs.environment || 'develop' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  setup:
    runs-on: ubuntu-latest
    # **명시한다.** 저장소 기본 권한이 read 로 내려가도 이 잡이 무엇을 필요로 하는지
    # 파일만 보고 알 수 있어야 하고, 기본값에 기대면 그 설정이 바뀔 때 조용히 깨진다.
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.pick.outputs.list }}
      app_env: ${{ steps.pick.outputs.app_env }}
    steps:
      - name: 대상·환경 고르기
        id: pick
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          # **환경은 반드시 들어온다.** workflow_call 은 required 이고 workflow_dispatch 는
          # 기본값이 있다. 그래서 "안 왔을 때" 를 가르는 분기가 없다 — 예전에는 push
          # 트리거가 있어서 그 갈래가 필요했지만, 지금 진입점은 부르는 쪽 둘뿐이다.
          if [ "$INPUT_TARGET" = 'all' ]; then
            list='["hansapp-api","hansapp-batch","hansapp-cli"]'
          else
            list="[\"$INPUT_TARGET\"]"
          fi

          echo "list=$list"          >> "$GITHUB_OUTPUT"
          echo "app_env=$INPUT_ENV"  >> "$GITHUB_OUTPUT"
          echo "환경=$INPUT_ENV  대상=$list"

  # ───────────────────────────────────────────────────────────────────────────
  # **도커 밖에서 굽는다.** 산출물만 다음 잡으로 넘긴다.
  #
  # develop(main.yml)과 같은 방식이다. 도커 안에서 워크스페이스를 통째로 설치·빌드하면
  # 릴리스마다 몇 분이 드는데, 러너에서 한 번 만들고 이미지는 COPY 만 하면 몇 초로 끝난다.
  #
  # **arm64 에서 만든다.** 배포 서버가 arm64 이고 prisma 쿼리 엔진은 플랫폼별 네이티브
  # 바이너리라, 빌드 호스트의 아키텍처가 그대로 산출물에 남는다.
  #
  # 검사(lint)는 하지 않는다. 릴리스 PR 에서 이미 돌았고, 여기는 "그 버전이 빌드되는지" 만
  # 확인하는 자리다.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    needs: setup
    name: build (arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: 아키텍처 확인
        run: echo "  러너 $(uname -m)"

      # **pnpm 이 먼저다.** setup-node 의 캐시가 스토어 경로를 알아내려고 pnpm 을 실행한다.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 산출물의 신원(dist/build-info.json)은 각 앱의 build 스크립트가 만든다.
      # 안 주면 dev 로 채워져 **빌드된 산출물이 아니라는 사실이 드러난다.**
      - name: 빌드
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
        run: pnpm -r build

      # cli 만 --prod 를 쓰지 않는다. prisma 가 devDependency 인데 그것으로 돌린다.
      - name: 산출물 추리기
        run: |
          rm -rf out
          pnpm deploy --filter hansapp-api   --prod --legacy out/hansapp-api
          pnpm deploy --filter hansapp-batch --prod --legacy out/hansapp-batch
          pnpm deploy --filter hansapp-cli          --legacy out/hansapp-cli
          du -sh out/* | sed 's/^/  /'

      # **디렉터리째 올리지 않는다.** node_modules 는 작은 파일이 1만 개라 개당 오버헤드가
      # 지배한다. 하나로 묶으면 파일 1개가 되고 심볼릭 링크도 링크로 보존된다.
      - name: 산출물 묶기
        run: |
          tar --zstd -cf out.tar.zst out
          ls -lh out.tar.zst | awk '{print "  묶음 " $5}'

      - uses: actions/upload-artifact@v7
        with:
          name: backend-out-${{ github.sha }}
          path: backend/out.tar.zst
          retention-days: 1
          compression-level: 0

  # ───────────────────────────────────────────────────────────────────────────
  # 산출물을 이미지로 담는다. **여기서는 컴파일하지 않는다** — COPY 만 한다.
  # ───────────────────────────────────────────────────────────────────────────
  image:
    needs: [setup, build]
    # 이미지도 arm64 에서 만든다. 산출물이 arm64 이므로 그것을 담는 이미지의 플랫폼도
    # 같아야 한다 — 여기서는 COPY 만 하므로 빌드 시간은 몇 초다.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.targets) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: backend-out-${{ github.sha }}
          path: backend

      - name: 산출물 풀기
        run: |
          cd backend
          tar --zstd -xf out.tar.zst && rm out.tar.zst
          ls out | sed 's/^/  /'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그는 두 갈래다. node-builder 와 같은 결이다.
      #
      #   움직이는 태그  :develop            지금 그 환경에 해당하는 것
      #   고정 태그      :develop-<sha>      안 움직인다. 롤백할 때 되짚는 용
      #
      # 고정 태그가 없으면 "어제 것으로 되돌린다" 를 할 수가 없다. 움직이는 태그만으로는
      # 과거를 가리킬 방법이 없기 때문이다.
      - name: 태그 목록 구성
        id: tags
        env:
          APP: ${{ matrix.app }}
          APP_ENV: ${{ needs.setup.outputs.app_env }}
          VERSION: ${{ inputs.version }}
        run: |
          image="$REGISTRY/$APP"
          {
            echo "list<<TAGS"
            echo "$image:$APP_ENV"
            echo "$image:$APP_ENV-$GITHUB_SHA"
            # **릴리스 버전 태그.** 이것만이 "무엇이 떠 있나" 에 답할 수 있는 이름이다.
            #
            # $APP_ENV 는 움직이는 태그라 새로 구울 때마다 다른 이미지를 가리킨다. 서버
            # .env 에 IMAGE_TAG=production 이라고 적혀 있어 봐야 아무 정보가 없고, 되돌릴
            # 이전 태그도 남지 않아 롤백이 불가능하다. $APP_ENV-<sha> 는 안정적이지만
            # 버전과 sha 를 매번 대조해야 한다.
            #
            # git 태그(release-backend/v0.3.0)와 1:1 로 맞춘다. 그래야
            # `deploy.sh production v0.3.0` 이 그대로 성립하고, 롤백이 태그 교체로 끝난다.
            [ -n "$VERSION" ] && echo "$image:v${VERSION#v}"
            # **staging** — 가장 최근 릴리스를 가리키는 별칭.
            #
            # 배포할 때 버전을 외우지 않아도 되게 한다. 다만 배포는 이 이름을 그대로
            # 서버에 적지 않고 실제 버전(v0.6.2)으로 바꿔 넣는다 — 서버 .env 에
            # 'staging' 이라고 적혀 있으면 무엇이 떠 있는지 답할 수 없기 때문이다.
            [ -n "$VERSION" ] && echo "$image:staging"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      # **.nvmrc 가 단일 출처다.** Dockerfile 기본값과 어긋나면 여기서 멈춘다.
      - name: node 버전 확정
        id: node
        run: |
          nvmrc="$(tr -d 'v \t\r\n' < .nvmrc)"
          arg="$(grep -m1 '^ARG NODE_VERSION=' "backend/docker/${{ matrix.app }}.Dockerfile" | cut -d= -f2)"
          if [ "$nvmrc" != "$arg" ]; then
            echo "::error file=.nvmrc::.nvmrc($nvmrc) 와 Dockerfile 기본값($arg)이 다르다. 둘을 맞출 것."
            exit 1
          fi
          echo "version=$nvmrc" >> "$GITHUB_OUTPUT"
          echo "  node $nvmrc"

      - uses: docker/build-push-action@v6
        with:
          # 컨텍스트가 backend/ 다. 워크스페이스 의존성과 lockfile 이 있어야 설치가 된다.
          context: backend
          file: backend/docker/${{ matrix.app }}.Dockerfile
          # **빌드는 이미 끝났다.** builder 스테이지를 타지 않는 최종 스테이지를 고른다.
          target: prebuilt
          push: true
          platforms: linux/arm64
          # 컨테이너가 돌 uid. 배포 서버의 로그인 계정과 같아야 마운트된 설정을 읽는다.
          # 저장소 변수로 덮을 수 있게 두되, 없으면 배포 대상 기본값(1001)을 쓴다.
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
            APP_UID=${{ vars.APP_UID || '1001' }}
            APP_GID=${{ vars.APP_GID || '1001' }}
          tags: ${{ steps.tags.outputs.list }}
          # source 라벨이 있어야 GHCR 패키지가 이 레포에 연결된다.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ matrix.app }} (${{ needs.setup.outputs.app_env }})

      # **다음에 뭘 해야 하는지 여기 남긴다.**
      # 배포는 이 워크플로가 하지 않는다. 그래서 "구웠다" 로 끝나면 오랜만에 온 사람은
      # 어떤 태그를 어디에 넣어야 하는지부터 찾아야 한다. 방금 만든 이름을 그대로 적어 둔다.
      - name: 배포 방법 요약
        env:
          APP: ${{ matrix.app }}
          APP_ENV: ${{ needs.setup.outputs.app_env }}
          TAGS: ${{ steps.tags.outputs.list }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="${VERSION:+v${VERSION#v}}"
          tag="${tag:-$APP_ENV}"
          {
            echo "### $APP 이미지를 올렸다"
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
            echo
            echo "#### 배포하려면"
            echo
            echo '로컬:'
            echo '```bash'
            echo "scripts/deploy/deploy.sh $APP_ENV $tag"
            echo '```'
            echo
            if [ "$APP_ENV" = 'production' ]; then
              echo "CI: [be - deploy - PRODUCTION](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/be-deploy-production.yml)"
              echo "→ Use workflow from 에 \`staging\` 또는 \`release-backend/$tag\`"
            else
              echo "CI: [main](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/main.yml) → stage \`deploy\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

