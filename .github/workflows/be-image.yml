# backend 앱을 도커 이미지로 구워 GHCR 에 올린다. **서버에는 배포하지 않는다.**
#
# 지금은 여기까지다. 이미지가 레지스트리에 올라간 뒤 서버가 그것을 당겨 띄우는 단계는
# 아직 없다 — 그건 서버 쪽 준비(pm2 → 컨테이너 런타임 전환)가 따라와야 한다.
#
#   workflow_dispatch  → 환경을 골라서 굽고 민다
#   workflow_call      → 나중에 release.yml 이 검증용으로 부를 수 있다
#
# 이미지는 **환경에 무관하다.** APP_ENV 를 런타임에 읽어 config/config.<환경>.yaml 을
# 고르기 때문이다(프론트와 정반대 — 그쪽은 VITE_* 가 빌드에 구워져 환경마다 산출물이 다르다).
# 그래도 태그를 환경별로 나누는 이유는 "지금 develop 에 뭐가 떠 있나" 를 태그로 답하기
# 위해서다. 같은 커밋이면 두 태그가 같은 이미지를 가리켜도 된다.
name: be · docker image

on:
  # backend 를 건드린 커밋이 main 에 들어오면 develop 이미지를 굽는다.
  # 다만 **커밋 메시지에 #deploy 가 있을 때만** 이다 — develop 은 같이 쓰는 서버라,
  # 협업하려고 미완성 코드를 먼저 합치는 것만으로 바뀌면 안 된다(fe-deploy 와 같은 규칙).
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/be-image.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: '태그를 붙일 환경'
        type: choice
        options: [develop, production]
        default: develop
      target:
        description: '대상 (all = 전부)'
        type: choice
        options: [all, hansapp-api, hansapp-batch]
        default: all
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      target:
        type: string
        default: all

concurrency:
  group: be-image-${{ inputs.environment || 'develop' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.list }}
      app_env: ${{ steps.pick.outputs.app_env }}
      # push 인데 #deploy 가 없으면 굽지 않는다. build 잡이 통째로 건너뛴다.
      run: ${{ steps.pick.outputs.run }}
    steps:
      - name: 대상·환경 고르기
        id: pick
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_ENV: ${{ inputs.environment }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          # **입력이 있으면 그게 답이다.** 사람이 골랐든 다른 워크플로가 넘겼든 같다.
          # github.event_name 으로 가르면 workflow_call 일 때 부르는 쪽의 이벤트가 잡힌다.
          if [ -n "$INPUT_ENV" ]; then
            app_env="$INPUT_ENV"
            run=true
            if [ "$INPUT_TARGET" = 'all' ]; then
              list='["hansapp-api","hansapp-batch"]'
            else
              list="[\"$INPUT_TARGET\"]"
            fi
          else
            # push 경로. develop 만 자동으로 굽는다.
            app_env='develop'
            list='["hansapp-api","hansapp-batch"]'

            # **develop 은 같이 쓰는 서버다.** 협업하려고 미완성 코드를 main 에 먼저
            # 합치는 일이 있으므로, 합쳤다는 이유만으로 이미지가 갱신되면 안 된다.
            # fe-deploy 와 같은 규칙으로 #deploy 를 요구한다.
            if printf '%s' "$HEAD_MSG" | grep -q '#deploy'; then
              run=true
            else
              run=false
              echo "커밋 메시지에 #deploy 가 없다 → 이미지를 굽지 않는다."
            fi
          fi

          echo "list=$list"       >> "$GITHUB_OUTPUT"
          echo "app_env=$app_env" >> "$GITHUB_OUTPUT"
          echo "run=$run"         >> "$GITHUB_OUTPUT"
          echo "환경=$app_env  대상=$list  실행=$run"

  build:
    needs: setup
    if: needs.setup.outputs.run == 'true'
    # **arm64 러너에서 네이티브로 굽는다.** 배포 서버가 arm64 이기 때문이다
    # (prisma 스키마 주석 참고 — 아키텍처가 다르면 엔진이 없어 부팅이 실패한다).
    #
    # amd64 러너에서 QEMU 로 구울 수도 있지만, 워크스페이스 전체 install + prisma
    # generate + nest build 를 에뮬레이션으로 돌리면 몇십 분이 걸린다. node-builder 는
    # 1 년에 몇 번이라 감수했지만 이건 자주 도는 빌드다.
    #
    # arm64 호스티드 러너는 **public 레포에서 무료**다. private 이면 과금되거나 아예
    # 잡히지 않으므로, 그때는 저장소 Variable 로 ubuntu-latest 를 지정해 우회한다
    # (그 경우 아래 QEMU 스텝의 주석을 풀어야 한다).
    runs-on: ${{ vars.BE_IMAGE_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.targets) }}

    steps:
      - uses: actions/checkout@v4

      # arm64 러너를 못 쓰는 상황(private 레포 등)에서만 필요하다.
      # - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그는 두 갈래다. node-builder 와 같은 결이다.
      #
      #   움직이는 태그  :develop            지금 그 환경에 해당하는 것
      #   고정 태그      :develop-<sha>      안 움직인다. 롤백할 때 되짚는 용
      #
      # 고정 태그가 없으면 "어제 것으로 되돌린다" 를 할 수가 없다. 움직이는 태그만으로는
      # 과거를 가리킬 방법이 없기 때문이다.
      - name: 태그 목록 구성
        id: tags
        env:
          APP: ${{ matrix.app }}
          APP_ENV: ${{ needs.setup.outputs.app_env }}
        run: |
          image="$REGISTRY/$APP"
          {
            echo "list<<TAGS"
            echo "$image:$APP_ENV"
            echo "$image:$APP_ENV-$GITHUB_SHA"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          # 컨텍스트가 backend/ 다. 워크스페이스 의존성과 lockfile 이 있어야 설치가 된다.
          context: backend
          file: backend/docker/${{ matrix.app }}.Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.tags.outputs.list }}
          # source 라벨이 있어야 GHCR 패키지가 이 레포에 연결된다.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ matrix.app }} (${{ needs.setup.outputs.app_env }})
          cache-from: type=gha,scope=be-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=be-${{ matrix.app }}

      - name: 푸시된 태그
        run: echo "${{ steps.tags.outputs.list }}"
