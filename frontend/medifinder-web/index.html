<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      아이콘. **예전엔 type 이 svg+xml 인데 href 는 .ico 였고, 그 파일조차 없었다** —
      SPA 폴백이 index.html 을 200 으로 돌려줘서 오류로도 안 잡혔다.

      .ico 는 브라우저가 루트에서 자동으로 찾는 옛 규약이라 남기고(16·32·48 을 한 파일에
      담았다), 최신 브라우저는 더 선명한 PNG 를 고르게 둘 다 준다.
      작은 마크는 핀만 잘라 쓴다 — 원본 장면 전체는 16px 에서 파란 얼룩이 된다.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      viewport-fit=cover: 노치 기기에서 화면 끝까지 그리게 하고, 그 대신 세이프에어리어
      값(env(safe-area-inset-*))을 CSS 로 넘겨준다. **이게 없으면 그 값이 전부 0 이라**
      상단 바에 준 pt-safe-top 이 아무 일도 하지 않고 내비바가 상태바에 깔린다.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 안드로이드 크롬의 상태바 색. 스티키 내비바와 같은 흰색이라 경계가 안 보인다. -->
    <meta name="theme-color" content="#FFFFFF" />
    <!--
      **JS 를 실행하지 않는 크롤러가 읽는 값이다.** 네이버 Yeti·카카오톡 미리보기 봇이
      여기서 멈춘다. 화면마다의 제목은 shared/seo/useSeo 가 세우는데 그건 JS 가 돌아야 한다.
      그래서 이 두 줄은 ko 기본값(i18n 의 seo.default)과 **같은 문장으로 맞춰 둔다** —
      한쪽만 고치면 크롤러가 보는 문장과 사람이 보는 문장이 갈린다.
    -->
    <title>병원 찾기 | MediFinder</title>
    <meta
      name="description"
      content="진료시간·야간·휴일 진료부터 심평원 적정성평가까지, 전국 병원 정보를 한 번에 확인하세요."
    />
    <!--
      Pretendard. dynamic-subset 은 화면에 실제로 쓰인 글자만 잘라 받는 방식이라
      한글 전체(수 MB)를 받지 않는다. 변수 서체 한 벌로 400~800 굵기가 전부 나온다.

      **CDN 이 아니라 우리 오리진에서 준다.** 외부 스타일시트는 렌더를 막은 채
      새 오리진의 DNS·TLS 왕복을 기다리게 해 1.1~1.3초를 잡아먹었다.
      preload 하는 조각 하나에 라틴 문자와 가장 흔한 한글이 같이 들어 있어 어느 로케일이든 쓴다.
      경로의 버전과 조각 번호는 함부로 바꾸면 안 된다 — 같은 폴더의 README 를 볼 것.
    -->
    <link
      rel="preload"
      href="/assets/fonts/pretendard-1.3.9/woff2-dynamic-subset/PretendardVariable.subset.91.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/fonts/pretendard-1.3.9/subset.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
