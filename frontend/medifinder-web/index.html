<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <!--
      viewport-fit=cover: 노치 기기에서 화면 끝까지 그리게 하고, 그 대신 세이프에어리어
      값(env(safe-area-inset-*))을 CSS 로 넘겨준다. **이게 없으면 그 값이 전부 0 이라**
      상단 바에 준 pt-safe-top 이 아무 일도 하지 않고 내비바가 상태바에 깔린다.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 안드로이드 크롬의 상태바 색. 스티키 내비바와 같은 흰색이라 경계가 안 보인다. -->
    <meta name="theme-color" content="#FFFFFF" />
    <title>MediFinder · 병원 찾기</title>
    <meta name="description" content="전국 병원을 쉽고 빠르게 찾아보세요 - MediFinder" />
    <!--
      Pretendard. dynamic-subset 은 화면에 실제로 쓰인 글자만 잘라 받는 방식이라
      한글 전체(수 MB)를 받지 않는다. 변수 서체 한 벌로 400~800 굵기가 전부 나온다.

      **CDN 이 아니라 우리 오리진에서 준다.** 외부 스타일시트는 렌더를 막은 채
      새 오리진의 DNS·TLS 왕복을 기다리게 해 1.1~1.3초를 잡아먹었다.
      preload 하는 조각 하나에 라틴 문자와 가장 흔한 한글이 같이 들어 있어 어느 로케일이든 쓴다.
      경로의 버전과 조각 번호는 함부로 바꾸면 안 된다 — 같은 폴더의 README 를 볼 것.
    -->
    <link
      rel="preload"
      href="/assets/fonts/pretendard-1.3.9/woff2-dynamic-subset/PretendardVariable.subset.91.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/fonts/pretendard-1.3.9/subset.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
