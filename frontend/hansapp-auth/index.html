<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HansApp 로그인</title>
    <meta name="description" content="HansApp 계정으로 로그인" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      글꼴은 **렌더를 막지 않게** 받는다. 평범한 stylesheet 로 두면 이 외부 요청이 끝날 때까지
      브라우저가 첫 페인트를 미루고, 그러면 위의 부팅 화면조차 안 보인다(흰 화면 그대로다).
      media="print" 로 받아 두고 다 받은 뒤 all 로 바꾸는 것이 그 우회다.
      URL 에 display=swap 이 이미 있어 글꼴 교체 방식은 달라지지 않는다.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!--
      **부팅 전 화면.** JS 번들이 내려와 React 가 뜨기까지는 #root 가 비어 있어 흰 화면이다.
      다른 사이트에서 넘어오는 경우(포털 → 인증웹) 사용자는 그 흰 화면을 "멈췄다" 로 읽는다.
      여기 인라인으로 넣어 두면 **문서가 도착하는 즉시** 칠해진다 — 추가 요청이 없어서다.

      지우는 코드는 없다. React 18 의 createRoot 는 첫 렌더에서 컨테이너의 기존 자식을 걷어내므로,
      **React 가 실제로 그릴 때** 교체된다(먼저 지웠다가 다시 비는 깜빡임이 없다).

      모양은 앱의 FullScreenSpinner 와 똑같이 맞춘다 — 다르면 넘어가는 순간 한 번 더 깜빡인다.
      globals.css 는 번들에 들어 있어 아직 없으므로 높이 규칙도 여기서 준다.
    -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      #boot {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        color: #9ca3af;
        font-size: 14px;
        font-family:
          'Noto Sans KR',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
    </style>

  </head>
  <body>
    <div id="root"><div id="boot">불러오는 중…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
